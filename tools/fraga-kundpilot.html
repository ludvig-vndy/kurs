<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fråga · lokal kundpilot</title>
<style nonce="__NONCE__">
:root{font-family:system-ui,sans-serif;color:#18362c;background:#f4f5ee}body{max-width:900px;margin:40px auto;padding:0 20px}h1{font:2rem Georgia,serif}p{line-height:1.65}label{font-weight:600}select,textarea,button{font:inherit;padding:12px;border:1px solid #80958a;border-radius:8px}textarea{display:block;box-sizing:border-box;width:100%;margin:12px 0;min-height:100px}button{cursor:pointer;background:#174936;color:white}button:disabled{opacity:.5;cursor:wait}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.note,#status,.meta{font-size:.9rem;color:#486257}.turn{background:white;padding:24px;border:1px solid #d5dfd4;border-radius:12px;margin:20px 0}.question{white-space:pre-wrap;font-weight:600}.fraga-block{margin:20px 0}.fraga-etikett{display:block}.fraga-tidigare{display:block;font-size:.8rem}a{color:#176649}table{border-collapse:collapse;display:block;overflow:auto}td,th{padding:8px;border-bottom:1px solid #ccd6ca}#status{min-height:1.5em}#error{color:#a02323;white-space:pre-wrap}details{margin:12px 0}
</style><script src="/fraga-svar.js" defer></script></head><body>
<h1>Fråga · lokal kundpilot</h1><p class="note">Testa med publika bolagsfrågor. Frågor och fullständiga resultat sparas lokalt. Svarsmotorn anropar Anthropic; pilotläget kan också söka externa källor.</p>
<p id="context" class="note"></p><p id="model" class="note"></p><p id="keys" class="note"></p>
<div class="toolbar"><label for="mode">Läge</label><select id="mode"><option value="baseline">Baslinje · befintlig motor</option><option value="pilot">Pilot · befintlig motor + research</option></select><button id="reset" type="button">Nytt samtal</button></div>
<div id="conversation" aria-live="polite"></div>
<form id="form"><label for="question">Din fråga eller följdfråga</label><textarea id="question" maxlength="1000" required placeholder="Vad behöver jag kontrollera för att bedöma om marginalförbättringen är uthållig?"></textarea><button id="send">Skicka fråga</button></form>
<p id="status" role="status"></p><p id="error" role="alert"></p>
<script nonce="__NONCE__">
const $=id=>document.getElementById(id);let trad='',busy=false,start=0,timer;
const labels={forbereder:'Förbereder',underlag:'Hämtar underlag',planerar:'Planerar',laser:'Läser källor',beraknar:'Beräknar',skriver:'Skriver',kortar:'Redigerar',kontrollerar:'Kontrollerar'};let stage='';
async function config(){const c=await(await fetch('/config')).json();$('context').textContent=c.context;$('model').textContent=c.model;$('keys').textContent=`Anthropic: ${c.anthropicReady?'nyckel finns':'nyckel saknas'}. Research: ${c.researchReady?'nyckel finns':'nyckel saknas'}.`;}
function reset(){trad='';$('conversation').replaceChildren();$('error').textContent='';$('status').textContent='';} $('reset').onclick=reset;$('mode').onchange=reset;
function state(value){busy=value;for(const id of ['send','mode','reset'])$(id).disabled=value;}
$('form').onsubmit=async e=>{e.preventDefault();if(busy)return;const question=$('question').value.trim();if(!question)return;state(true);$('error').textContent='';start=performance.now();stage='Startar';timer=setInterval(()=>{$('status').textContent=`${stage} · ${Math.round((performance.now()-start)/1000)} s`;},200);let result;
try{await config();const r=await fetch('/api/fraga',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/x-ndjson'},body:JSON.stringify({question,mode:$('mode').value,trad})});
if(!r.ok){const d=await r.json();throw Error(d.error||'Frågan misslyckades.');}const reader=r.body.getReader(),decoder=new TextDecoder();let pending='';
function event(line){if(!line.trim())return;const d=JSON.parse(line);if(d.type==='status')stage=labels[d.stage]||d.stage;if(d.type==='result')result=d;}
while(true){const {done,value}=await reader.read();if(done)break;pending+=decoder.decode(value,{stream:true});let pos;while((pos=pending.indexOf('\n'))>=0){event(pending.slice(0,pos));pending=pending.slice(pos+1);}}pending+=decoder.decode();event(pending);
if(!result||result.status>=400||result.data.error)throw Error(result?.data?.error||'Inget färdigt svar mottogs.');const data=result.data;trad=data.trad||'';const turn=document.createElement('article');turn.className='turn';const q=document.createElement('p');q.className='question';q.textContent=question;const answer=document.createElement('div');answer.innerHTML=FragaSvar.render(data);const meta=document.createElement('p');meta.className='meta';meta.textContent=`${$('mode').selectedOptions[0].textContent} · ${((performance.now()-start)/1000).toFixed(1)} s · ${data.tackning?.modell||'modell ej rapporterad'}${data.tackning?.modellfall?' (reservmodell)':''} · resultat sparat lokalt`;turn.append(q,answer,meta);$('conversation').append(turn);$('question').value='';stage='Klart';
}catch(error){$('error').textContent=error.message;stage='Kunde inte slutföra';}finally{clearInterval(timer);$('status').textContent=`${stage} · ${((performance.now()-start)/1000).toFixed(1)} s`;state(false);$('question').focus();}};config().catch(()=>{$('error').textContent='Kunde inte läsa lokal konfiguration.';});
</script></body></html>
