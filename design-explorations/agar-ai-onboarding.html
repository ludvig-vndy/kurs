<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ägar-AI — varför du äger dina bolag</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E0F11; --bg2:#131417; --card:#16181C; --card2:#1C1F24;
    --line:#262A30; --line2:#333842;
    --ink:#ECEEF1; --mut:#9AA1AC; --faint:#646B76;
    --gold:#E0A43B; --gold-soft:#1F232C; --gold-d:#7E5E22;
    --pos:#5FB89A; --pos-soft:#16241F; --pos-d:#2F5C4C;
    --neg:#E0726F; --neg-soft:#261A1D;
    --disp:'Fraunces',Georgia,serif; --sans:'Inter',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.6;
    background-image:radial-gradient(620px 300px at 50% -8%,rgba(224,164,59,.06),transparent)}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  button{font-family:inherit;cursor:pointer}
  ::selection{background:var(--gold-soft)}
  .ico{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle}
  .ico svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .ico.sm svg{width:14px;height:14px}

  .top{display:flex;align-items:center;gap:10px;justify-content:center;padding:22px;font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
  .top .mark{width:20px;height:20px;border-radius:6px;background:linear-gradient(150deg,var(--gold),#c98a28);display:grid;place-items:center}
  .top .mark svg{width:12px;height:12px;stroke:#15171a;stroke-width:2.2}

  .stage{max-width:600px;margin:0 auto;padding:14px 24px 90px}
  .prog{display:flex;gap:6px;margin:6px 0 34px}
  .prog i{height:3px;flex:1;border-radius:2px;background:var(--line2);transition:background .3s}
  .prog i.on{background:var(--gold)}

  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
  h1{font-family:var(--disp);font-weight:600;font-size:32px;line-height:1.12;letter-spacing:-.5px;margin:0 0 14px}
  .lede{color:var(--mut);font-size:15.5px;margin:0 0 30px;line-height:1.6}
  .lede b{color:var(--ink);font-weight:500}

  /* search + chips */
  .search{position:relative;margin-bottom:16px}
  .search .ico{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--faint)}
  .search input{width:100%;background:var(--card);border:1px solid var(--line2);border-radius:13px;color:var(--ink);font-size:16px;padding:15px 16px 15px 46px;outline:none;font-family:var(--sans);transition:border-color .15s,box-shadow .15s}
  .search input:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(224,164,59,.1)}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{background:var(--card);border:1px solid var(--line2);border-radius:99px;padding:9px 15px;font-size:13.5px;color:var(--mut);transition:.14s;display:flex;align-items:center;gap:7px}
  .chip:hover{color:var(--ink);border-color:var(--line2);background:var(--card2)}
  .chip.sel{border-color:var(--gold);color:var(--ink);background:var(--gold-soft)}
  .chip .tk{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
  .chip.sel .tk{color:var(--gold)}

  /* sentence builder */
  .sent{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 22px 20px;font-family:var(--disp);font-size:19px;line-height:1.75;margin-bottom:18px}
  .sent .co{color:var(--gold);font-weight:600}
  .sent input{background:none;border:none;border-bottom:1.5px solid var(--gold-d);color:var(--ink);font-family:var(--disp);font-size:19px;outline:none;min-width:120px;padding:0 2px 2px;transition:border-color .15s}
  .sent input::placeholder{color:var(--faint);font-style:italic}
  .sent input:focus{border-bottom-color:var(--gold)}
  .exlink{background:none;border:none;color:var(--gold);font-size:13px;display:inline-flex;align-items:center;gap:6px;padding:0;margin-bottom:20px}
  .exlink:hover{text-decoration:underline}

  /* course callout */
  .course{display:flex;align-items:center;gap:13px;background:var(--gold-soft);border:1px solid var(--gold-d);border-radius:13px;padding:14px 16px;margin-bottom:8px;text-decoration:none;color:inherit;transition:.15s}
  .course:hover{border-color:var(--gold)}
  .course .cap{width:34px;height:34px;border-radius:9px;background:rgba(224,164,59,.14);display:grid;place-items:center;color:var(--gold);flex:0 0 auto}
  .course .cap svg{width:18px;height:18px}
  .course .ct b{font-size:14px;font-weight:600;display:block}
  .course .ct span{font-size:12px;color:var(--mut)}
  .course .arr{margin-left:auto;color:var(--gold)}
  .course .arr svg{width:16px;height:16px}
  .microcourse{font-size:12.5px;color:var(--faint);margin:14px 2px 0;line-height:1.55}
  .microcourse a{color:var(--gold);text-decoration:none}.microcourse a:hover{text-decoration:underline}

  /* pillars */
  .phelp{color:var(--mut);font-size:14px;margin:0 0 18px}
  .pill{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:15px 16px;margin-bottom:11px}
  .pill .ph{display:flex;align-items:center;gap:11px;margin-bottom:10px}
  .light{width:9px;height:9px;border-radius:50%;background:var(--pos);box-shadow:0 0 9px rgba(95,184,154,.6);flex:0 0 auto}
  .pill .pn{flex:1;background:none;border:none;color:var(--ink);font-family:var(--disp);font-weight:500;font-size:15.5px;outline:none;padding:2px 0;border-bottom:1px solid transparent}
  .pill .pn:focus{border-bottom-color:var(--line2)}
  .pill .rm{background:none;border:none;color:var(--faint);padding:4px}.pill .rm:hover{color:var(--neg)}.pill .rm svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7}
  .pill .alarm{display:flex;align-items:center;gap:9px;margin-left:20px}
  .pill .alarm .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);flex:0 0 auto}
  .pill .alarm input{flex:1;background:var(--bg2);border:1px solid var(--line2);border-radius:8px;color:var(--mut);font-size:13px;padding:8px 11px;outline:none;font-family:var(--sans)}
  .pill .alarm input:focus{border-color:var(--gold);color:var(--ink)}
  .addp{width:100%;background:none;border:1px dashed var(--line2);border-radius:13px;padding:14px;color:var(--mut);font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;transition:.14s}
  .addp:hover{border-color:var(--gold);color:var(--ink)}.addp svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}

  /* premortem */
  .opt{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;font-size:14.5px;transition:.14s}
  .opt:hover{border-color:var(--line2)}
  .opt.sel{border-color:var(--gold);background:var(--gold-soft)}
  .opt .box{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line2);flex:0 0 auto;display:grid;place-items:center;color:transparent}
  .opt.sel .box{border-color:var(--gold);background:var(--gold);color:#15171a}
  .opt .box svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.4}

  /* nav */
  .nav{display:flex;gap:11px;margin-top:30px}
  .btn{border-radius:13px;padding:14px 22px;font-size:14.5px;border:1px solid var(--line2);background:var(--card2);color:var(--ink);transition:.15s;display:flex;align-items:center;gap:8px;justify-content:center}
  .btn:hover{border-color:var(--gold)}
  .btn.prim{background:var(--gold);border-color:var(--gold);color:#15171a;font-weight:600;flex:1}
  .btn.prim:hover{background:#eeb24a}
  .btn.ghost{color:var(--mut)}
  .btn .ico svg{width:16px;height:16px}
  .btn[disabled]{opacity:.4;pointer-events:none}

  /* done */
  .doneic{width:54px;height:54px;border-radius:50%;background:var(--pos-soft);color:var(--pos);display:grid;place-items:center;margin-bottom:20px}
  .doneic svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:2}
  .summary{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin:6px 0 8px}
  .summary .sl{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:9px}
  .summary .ssent{font-family:var(--disp);font-size:17px;line-height:1.5;margin-bottom:18px}
  .summary .ssent .co{color:var(--gold);font-weight:600}
  .summary .sp{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
  .summary .sp .light{width:8px;height:8px}
  .summary .sp .sc{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--faint)}

  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  .fade{animation:fade .25s ease}@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="top"><span class="mark" id="mk"></span> Marginalen · Ägar-AI</div>
<div class="stage">
  <div class="prog" id="prog"></div>
  <div id="body"></div>
</div>

<script>
const SVG={
  search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  arrow:'<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
  back:'<path d="M19 12H5"/><path d="m12 19-7-7 7-7"/>',
  cap:'<path d="M21.4 10.9a1 1 0 0 0 0-1.8L12.8 5.2a2 2 0 0 0-1.6 0L2.6 9.1a1 1 0 0 0 0 1.8l8.6 3.9a2 2 0 0 0 1.6 0z"/><path d="M22 10v6"/><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  plus:'<path d="M5 12h14"/><path d="M12 5v14"/>',
  bulb:'<path d="M15 14c.2-1 .7-1.7 1.5-2.5C17.7 10.2 18 9 18 8a6 6 0 0 0-12 0c0 1 .2 2.2 1.5 3.5.8.8 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/>',
  pulse:'<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>'
};
function svg(n,w){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w||1.6}" stroke-linecap="round" stroke-linejoin="round">${SVG[n]||''}</svg>`;}
function ic(n,c){return `<span class="ico ${c||''}">${svg(n)}</span>`;}
document.getElementById('mk').innerHTML=`<svg viewBox="0 0 24 24" fill="none">${SVG.pulse}</svg>`;

const HOLD=[['Norlux Industri','NORL'],['Telvio','TELV'],['Kavex Medical','KAVX'],['Brunna Hydro','BRUN'],['Almi Foods','ALMI']];
const SEED={
  NORL:{a:'köpa upp lönsamma småbolag och driva dem bättre',b:'marknaden är fragmenterad och kassaflödet betalar nästa förvärv',
    pillars:[['Organisk tillväxt över 8% per år','under 8% två kvartal i rad'],['Stigande rörelsemarginal','EBIT-marginalen faller år mot år'],['Ingen utspädning','antalet aktier ökar']]},
  _default:{a:'',b:'',pillars:[['','när det här inte längre stämmer'],['','när det här inte längre stämmer']]}
};
const PREMORTEM=['Skuldsättningen stiger snabbt','Marginalen faller flera kvartal i rad','Grundaren eller VD lämnar','Bolaget börjar ge ut nya aktier ofta','En större kund eller marknad försvinner'];

const st={step:0, company:null, a:'', b:'', pillars:[], pre:[]};
const STEPS=5; // company, sentence, pillars, premortem, done
const body=document.getElementById('body'), prog=document.getElementById('prog');

function renderProg(){prog.innerHTML=Array.from({length:STEPS},(_, i)=>`<i class="${i<=st.step?'on':''}"></i>`).join('');prog.style.visibility=st.step===0&&false?'hidden':'visible';}
function go(n){st.step=Math.max(0,Math.min(STEPS-1,n));render();window.scrollTo(0,0);}

function render(){
  renderProg();
  if(st.step===0) return stepCompany();
  if(st.step===1) return stepSentence();
  if(st.step===2) return stepPillars();
  if(st.step===3) return stepPre();
  return stepDone();
}

/* 0. company */
function stepCompany(){
  body.className='fade';body.innerHTML=`
    <div class="eyebrow">Kom igång</div>
    <h1>Vad tror du om dina bolag?</h1>
    <p class="lede">Innan vi bevakar något åt dig vill vi veta <b>varför du äger bolaget</b>: hur det tjänar pengar och varför det tjänar mer framöver. Sen larmar vi bara när det skälet faktiskt rör sig, inte vid varje kursryck. Börja med ett bolag.</p>
    <div class="search"><span class="ico">${svg('search')}</span>
      <input id="cin" placeholder="Vilket bolag vill du börja med?" autocomplete="off"></div>
    <div class="chips" id="chips">${HOLD.map(([n,t])=>`<button class="chip ${st.company===t?'sel':''}" data-t="${t}">${n} <span class="tk">${t}</span></button>`).join('')}</div>
    <div class="nav"><button class="btn prim" id="next" ${st.company?'':'disabled'}>Fortsätt ${ic('arrow','sm')}</button></div>`;
  body.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{st.company=c.dataset.t;render();});
  body.querySelector('#next').onclick=()=>{seedFor();go(1);};
}
function seedFor(){const s=SEED[st.company]||SEED._default;if(!st.a)st.a=s.a;if(!st.b)st.b=s.b;
  if(!st.pillars.length)st.pillars=s.pillars.map(p=>({name:p[0],cond:p[1]}));}

/* 1. sentence */
function stepSentence(){
  const cn=HOLD.find(h=>h[1]===st.company)[0];
  body.className='fade';body.innerHTML=`
    <div class="eyebrow">Ditt skäl, i en mening</div>
    <h1>Varför äger du ${cn}?</h1>
    <p class="lede">Kärnan i att äga: kan du inte säga det i en mening äger du inte ännu, du gissar. Fyll i luckorna.</p>
    <div class="sent">Jag äger en andel av <span class="co">${cn}</span> som tjänar pengar genom att
      <input id="sa" placeholder="…" value="${esc(st.a)}" size="28">, och kommer tjäna mer för att
      <input id="sb" placeholder="…" value="${esc(st.b)}" size="28">.</div>
    <button class="exlink" id="ex">${ic('bulb','sm')} Fyll i ett exempel åt mig</button>
    <a class="course" href="#" onclick="return false">
      <span class="cap">${svg('cap')}</span>
      <span class="ct"><b>Osäker på hur du sätter ord på det?</b><span>Marginalen · Lektion 1.1 — Vad det innebär att äga en aktie</span></span>
      <span class="arr">${svg('arrow')}</span></a>
    <div class="nav"><button class="btn ghost" onclick="go(0)">${ic('back','sm')} Tillbaka</button>
      <button class="btn prim" id="next">Fortsätt ${ic('arrow','sm')}</button></div>`;
  const sa=body.querySelector('#sa'), sb=body.querySelector('#sb');
  sa.oninput=e=>st.a=e.target.value; sb.oninput=e=>st.b=e.target.value;
  body.querySelector('#ex').onclick=()=>{const s=SEED[st.company]||SEED._default;st.a=s.a||'sälja en tjänst kunderna betalar för varje månad';st.b=s.b||'fler kunder stannar och betalar mer över tid';render();};
  body.querySelector('#next').onclick=()=>go(2);
}

/* 2. pillars */
function stepPillars(){
  body.className='fade';body.innerHTML=`
    <div class="eyebrow">Gör skälet konkret</div>
    <h1>Bryt ned det till pelare vi kan bevaka</h1>
    <p class="phelp">Ett skäl du inte kan motbevisa är bara en förhoppning. Skriv varje del som ett påstående, och vad som ska få oss att larma. Vi rör dig bara när en pelare faktiskt vänder.</p>
    <div id="plist"></div>
    <button class="addp" id="addp">${svg('plus',1.8)} Lägg till en pelare</button>
    <p class="microcourse">Vill du läsa mer om varför detta slår magkänsla? <a href="#" onclick="return false">Marginalen · Lektion 11.3 — Story mot analys →</a></p>
    <div class="nav"><button class="btn ghost" onclick="go(1)">${ic('back','sm')} Tillbaka</button>
      <button class="btn prim" id="next">Fortsätt ${ic('arrow','sm')}</button></div>`;
  paintPillars();
  body.querySelector('#addp').onclick=()=>{st.pillars.push({name:'',cond:'när det här inte längre stämmer'});paintPillars();};
  body.querySelector('#next').onclick=()=>go(3);
}
function paintPillars(){
  const w=body.querySelector('#plist');
  w.innerHTML=st.pillars.map((p,i)=>`<div class="pill"><div class="ph"><span class="light"></span>
    <input class="pn" data-i="${i}" placeholder="t.ex. Stigande rörelsemarginal" value="${esc(p.name)}">
    <button class="rm" data-r="${i}"><svg viewBox="0 0 24 24">${SVG.x}</svg></button></div>
    <div class="alarm"><span class="lbl">Larma om</span><input class="cond" data-c="${i}" value="${esc(p.cond)}"></div></div>`).join('');
  w.querySelectorAll('.pn').forEach(el=>el.oninput=e=>st.pillars[+el.dataset.i].name=e.target.value);
  w.querySelectorAll('.cond').forEach(el=>el.oninput=e=>st.pillars[+el.dataset.c].cond=e.target.value);
  w.querySelectorAll('.rm').forEach(el=>el.onclick=()=>{st.pillars.splice(+el.dataset.r,1);paintPillars();});
}

/* 3. premortem */
function stepPre(){
  body.className='fade';body.innerHTML=`
    <div class="eyebrow">Bestäm i förväg</div>
    <h1>Vad skulle få dig att ompröva?</h1>
    <p class="lede">Bestäm det nu, i lugn och ro, inte mitt i en krasch. Vi flaggar om något av det här börjar hända. Valfritt, välj det som känns rätt.</p>
    <div id="pre">${PREMORTEM.map((t,i)=>`<div class="opt ${st.pre.includes(i)?'sel':''}" data-i="${i}"><span class="box"><svg viewBox="0 0 24 24">${SVG.check}</svg></span>${t}</div>`).join('')}</div>
    <p class="microcourse">Det här är en <a href="#" onclick="return false">pre-mortem</a>, ägarens sätt att skydda sig mot sina egna nerver. (Marginalen · Kapitel 10)</p>
    <div class="nav"><button class="btn ghost" onclick="go(2)">${ic('back','sm')} Tillbaka</button>
      <button class="btn prim" id="next">Slutför ${ic('arrow','sm')}</button></div>`;
  body.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{const i=+o.dataset.i;const k=st.pre.indexOf(i);if(k<0)st.pre.push(i);else st.pre.splice(k,1);stepPre();});
  body.querySelector('#next').onclick=()=>go(4);
}

/* 4. done */
function stepDone(){
  const cn=HOLD.find(h=>h[1]===st.company)[0];
  const pills=st.pillars.filter(p=>p.name.trim());
  body.className='fade';body.innerHTML=`
    <div class="doneic"><svg viewBox="0 0 24 24">${SVG.check}</svg></div>
    <div class="eyebrow">Klart</div>
    <h1>Vi bevakar ${cn} mot ditt skäl</h1>
    <p class="lede">Från och med nu läser vi rapporter, pressmeddelanden och register åt dig, och stör dig <b>bara när en pelare faktiskt rör sig</b>. Resten är brus.</p>
    <div class="summary">
      <div class="sl">Ditt skäl att äga</div>
      <div class="ssent">Jag äger en andel av <span class="co">${cn}</span> som tjänar pengar genom att ${esc(st.a)||'…'}, och kommer tjäna mer för att ${esc(st.b)||'…'}.</div>
      <div class="sl">Pelare vi bevakar</div>
      ${pills.map(p=>`<div class="sp"><span class="light"></span>${esc(p.name)}<span class="sc">larma om: ${esc(p.cond)}</span></div>`).join('')||'<div class="sp" style="color:var(--mut)">Inga pelare ännu</div>'}
    </div>
    <div class="nav"><button class="btn ghost" id="more">Lägg till nästa bolag</button>
      <button class="btn prim" id="open">Öppna Ägar-AI ${ic('arrow','sm')}</button></div>`;
  body.querySelector('#more').onclick=()=>{st.step=0;st.company=null;st.a='';st.b='';st.pillars=[];st.pre=[];render();window.scrollTo(0,0);};
  body.querySelector('#open').onclick=()=>{alert('I prototypen tar den här knappen dig till dashboarden (agar-ai-prototyp.html).');};
}

/* utils */
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fixIco(host,name,strokeOnly){if(!host)return;const el=host.querySelector('.ico')||host;
  const t=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${strokeOnly?1.8:1.6}" stroke-linecap="round" stroke-linejoin="round">${SVG[name]}</svg>`;
  if(host.classList.contains('cap')||host.classList.contains('arr')){host.innerHTML=t;}else{const span=host.querySelector('.ico');if(span)span.innerHTML=t;}}

render();
</script>
</body>
</html>
