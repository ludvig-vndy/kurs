<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ägarboken, lektionsvy (Levande Broadsheet)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Spectral:ital,wght@0,300;0,400;0,500;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F2ECE0; --paper-2:#EAE1D0; --card:#F8F3E9;
    --ink:#211C17; --ink-soft:#4A4239; --muted:#8A7F6F; --faint:#C7BBA6;
    --rule:rgba(33,28,23,.16); --rule-strong:rgba(33,28,23,.42);
    --oxblood:#8A2E26; --gold:#9A6E1C;
    --serif:"Spectral",Georgia,serif; --display:"Fraunces",Georgia,serif; --mono:"IBM Plex Mono",monospace;
  }
  *{box-sizing:border-box;margin:0}
  body{background:var(--paper); color:var(--ink); font-family:var(--serif); font-size:18px; line-height:1.62; -webkit-font-smoothing:antialiased; min-height:100vh; display:flex; flex-direction:column}
  .bg{position:fixed; inset:0; z-index:-1; pointer-events:none; background-image:repeating-linear-gradient(0deg, transparent 0 39px, rgba(33,28,23,.02) 39px 40px)}
  .bg::before{content:""; position:absolute; inset:0; background:radial-gradient(1100px 620px at 80% -12%, rgba(154,110,28,.08), transparent 60%); animation:breathe 16s ease-in-out infinite}
  @keyframes breathe{50%{opacity:.55; transform:translateY(12px)}}

  /* running head */
  .rh{position:sticky; top:0; z-index:10; background:linear-gradient(var(--paper) 70%, rgba(242,236,224,0)); padding:16px clamp(18px,5vw,52px) 0}
  .rh-in{max-width:1080px; margin:0 auto}
  .rh-top{display:flex; justify-content:space-between; align-items:center; gap:16px}
  .crumb{display:flex; align-items:center; gap:9px; font-family:var(--mono); font-size:11.5px; letter-spacing:.06em; color:var(--muted); flex-wrap:wrap}
  .crumb .mk{width:18px;height:18px;border-radius:5px;background:var(--oxblood); margin-right:4px}
  .crumb a{color:var(--ink-soft); text-decoration:none}
  .crumb a:hover{color:var(--oxblood)}
  .crumb .sep{color:var(--faint)}
  .crumb .here{color:var(--oxblood)}
  .folio{font-family:var(--mono); font-size:11.5px; letter-spacing:.1em; color:var(--ink-soft); white-space:nowrap}
  .folio b{color:var(--oxblood); font-weight:500}
  .track{display:flex; gap:4px; margin:12px 0 0; padding-bottom:12px}
  .seg{flex:1; height:3px; background:var(--paper-2); cursor:pointer; position:relative; overflow:hidden}
  .seg::after{content:""; position:absolute; inset:0; background:var(--oxblood); transform:scaleX(0); transform-origin:left; transition:transform .5s cubic-bezier(.2,.7,.2,1)}
  .seg.done::after{transform:scaleX(1)}
  .seg.cur::after{transform:scaleX(1); background:var(--oxblood)}
  .rh::after{content:""; display:block; max-width:1080px; margin:0 auto; border-bottom:1px solid var(--rule)}

  /* stage */
  .stage{flex:1; display:flex; align-items:center; justify-content:center; padding:clamp(28px,5vh,64px) clamp(18px,5vw,52px)}
  .step{width:100%; max-width:660px}
  .step.in > *{opacity:0; transform:translateY(14px); animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards}
  .step.in > *:nth-child(1){animation-delay:.04s}
  .step.in > *:nth-child(2){animation-delay:.12s}
  .step.in > *:nth-child(3){animation-delay:.2s}
  .step.in > *:nth-child(4){animation-delay:.28s}
  .step.in > *:nth-child(5){animation-delay:.36s}
  .step.in > *:nth-child(n+6){animation-delay:.42s}
  @keyframes rise{to{opacity:1; transform:none}}

  .kicker{font-family:var(--mono); font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--oxblood); margin-bottom:18px}
  /* intro */
  .s-intro{text-align:center; max-width:600px; margin:0 auto}
  .s-intro .title{font-family:var(--display); font-weight:300; font-size:clamp(40px,7vw,76px); line-height:1.0; letter-spacing:-.02em; margin-bottom:22px}
  .s-intro .ingress{font-size:21px; color:var(--ink-soft); font-style:italic; max-width:34ch; margin:0 auto}
  /* reading */
  .lead{font-family:var(--display); font-weight:300; font-size:clamp(23px,3vw,30px); line-height:1.34; letter-spacing:-.01em; margin-bottom:24px}
  .lead mark{background:none; color:var(--oxblood); font-style:italic}
  .body{margin-bottom:18px; color:var(--ink-soft)}
  .take{margin-top:26px; border-left:2px solid var(--oxblood); padding:4px 0 4px 22px; font-family:var(--display); font-style:italic; font-size:21px; line-height:1.4; color:var(--ink)}
  .take::before{content:"TA MED DIG"; display:block; font-family:var(--mono); font-style:normal; font-size:10px; letter-spacing:.18em; color:var(--oxblood); margin-bottom:8px}
  /* concept / dataviz */
  .ctitle{font-family:var(--display); font-weight:400; font-size:clamp(26px,3.6vw,38px); line-height:1.08; letter-spacing:-.015em; margin-bottom:8px}
  .underrubrik{color:var(--ink-soft); font-style:italic; font-size:18px; margin-bottom:22px; max-width:52ch}
  .forklaring{color:var(--ink-soft); margin-top:22px}
  .slutsats{margin-top:22px; font-family:var(--display); font-weight:400; font-size:20px; line-height:1.4}
  .slutsats::before{content:"⟶ "; color:var(--oxblood)}

  /* visual: jamforelse */
  .jmf{display:grid; grid-template-columns:1fr 1fr; gap:0; border:1px solid var(--rule-strong); margin-top:24px; background:var(--card)}
  .jmf .col{padding:22px 24px}
  .jmf .col+.col{border-left:1px solid var(--rule-strong)}
  .jmf .r{font-family:var(--display); font-weight:500; font-size:20px; color:var(--oxblood); margin-bottom:10px}
  .jmf .x{font-size:15.5px; color:var(--ink-soft); line-height:1.55}
  .figtext{font-family:var(--mono); font-size:10px; letter-spacing:.06em; color:var(--muted); text-align:center; margin-top:10px; text-transform:uppercase}

  /* visual: linjediagram (living) */
  .fig{margin-top:24px; border:1px solid var(--rule); background:var(--card); padding:18px 18px 12px; position:relative}
  .fig::before{content:""; position:absolute; inset:5px; border:1px solid var(--rule); pointer-events:none}
  .fig svg{width:100%; height:auto; display:block; overflow:visible; position:relative}
  .vline{fill:none; stroke:var(--ink); stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; pathLength:1; stroke-dasharray:1; stroke-dashoffset:1; animation:draw 2.2s cubic-bezier(.4,0,.2,1) .4s forwards}
  .vglow{fill:none; stroke:var(--gold); stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; pathLength:1; stroke-dasharray:.08 .92; stroke-dashoffset:1; opacity:0; filter:drop-shadow(0 0 4px rgba(154,110,28,.7)); animation:trail 3.4s linear 2.6s infinite}
  .pline{fill:none; stroke:var(--oxblood); stroke-width:1.8; stroke-linejoin:round; stroke-dasharray:5 6; animation:flow 2.4s linear infinite}
  .dot{fill:var(--oxblood); opacity:0; animation:pop .5s cubic-bezier(.2,.85,.3,1.3) 2.2s both, dotglow 2.4s ease-in-out 2.8s infinite}
  .dottext{fill:var(--oxblood); font-family:var(--mono); font-size:10px; opacity:0; animation:fade .6s 2.5s both}
  .legend{display:flex; gap:18px; justify-content:center; margin-top:10px; font-family:var(--mono); font-size:11px; color:var(--ink-soft)}
  .legend i{display:inline-block; width:18px; height:2.5px; vertical-align:middle; margin-right:7px}
  @keyframes draw{to{stroke-dashoffset:0}} @keyframes flow{to{stroke-dashoffset:-22}}
  @keyframes trail{0%{opacity:0;stroke-dashoffset:1}12%{opacity:.85}88%{opacity:.85}100%{opacity:0;stroke-dashoffset:0}}
  @keyframes dotglow{50%{filter:drop-shadow(0 0 6px var(--oxblood))}} @keyframes pop{0%{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}} @keyframes fade{to{opacity:1}}

  /* visual: stapeldiagram */
  .bars{margin-top:24px; border:1px solid var(--rule); background:var(--card); padding:20px 22px}
  .bar{display:grid; grid-template-columns:130px 1fr 54px; align-items:center; gap:12px; margin:10px 0; font-family:var(--mono); font-size:11px}
  .bar .lab{color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em}
  .bar .tk{height:14px; background:var(--paper-2); position:relative}
  .bar .tk i{position:absolute; top:0; bottom:0; left:0; background:var(--ink)}
  .bar.acc .tk i{background:var(--oxblood)}
  .bar .val{text-align:right; color:var(--ink)}
  /* visual: flode */
  .flow{display:flex; flex-wrap:wrap; align-items:stretch; gap:8px; margin-top:24px}
  .node{flex:1; min-width:120px; border:1px solid var(--rule-strong); background:var(--card); padding:14px 16px; font-family:var(--display); font-size:16px; display:flex; align-items:center}
  .node.acc{background:var(--ink); color:var(--paper); border-color:var(--ink)}
  .op{display:flex; align-items:center; font-family:var(--mono); color:var(--oxblood); font-size:16px}
  /* visual: andel */
  .andel{margin-top:24px}
  .andel .barwrap{display:flex; height:38px; border:1px solid var(--rule-strong); overflow:hidden}
  .andel .seg2{display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-size:10.5px; color:var(--paper); white-space:nowrap; overflow:hidden}
  .andel .keys{display:flex; gap:16px; margin-top:10px; font-family:var(--mono); font-size:11px; color:var(--ink-soft)}
  .andel .keys i{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:middle}

  /* quiz */
  .quiz h2{font-family:var(--display); font-weight:400; font-size:clamp(26px,3.4vw,36px); margin-bottom:6px; text-align:center}
  .quiz .qkick{font-family:var(--mono); font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--oxblood); text-align:center; margin-bottom:24px}
  .q{margin-top:26px}
  .q . qn{font-family:var(--mono); font-size:11px; color:var(--oxblood); margin-right:8px}
  .q .qt{font-family:var(--display); font-size:20px; line-height:1.3; margin-bottom:6px}
  .q .qsub{font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:12px}
  .opt{display:flex; align-items:flex-start; gap:13px; width:100%; text-align:left; padding:13px 16px; border:1px solid var(--rule); background:var(--card); cursor:pointer; margin-top:8px; font-family:var(--serif); font-size:16px; color:var(--ink); transition:border-color .18s, background .18s}
  .opt:hover{border-color:var(--rule-strong)}
  .opt .mk{flex:none; width:20px;height:20px;border:1.4px solid var(--faint); border-radius:50%; display:grid; place-items:center; font-size:11px; color:transparent; margin-top:1px}
  .opt.multi .mk{border-radius:4px}
  .opt.sel{border-color:var(--oxblood); background:#F0E4DE}
  .opt.sel .mk{border-color:var(--oxblood); background:var(--oxblood); color:var(--paper)}
  .opt.correct{border-color:#3E7A4F; background:#E6EFE3}
  .opt.correct .mk{border-color:#3E7A4F; background:#3E7A4F; color:#fff}
  .opt.wrong{border-color:var(--oxblood); background:#F3E2DE}
  .opt.wrong .mk{border-color:var(--oxblood); background:var(--oxblood); color:#fff}
  .exp{margin-top:10px; padding-left:16px; border-left:2px solid var(--oxblood); font-size:15px; color:var(--ink-soft); display:none}
  .exp.show{display:block}
  .qresult{display:none; text-align:center; margin-top:30px; padding-top:22px; border-top:2px solid var(--ink)}
  .qresult.show{display:block}
  .qresult .score{font-family:var(--display); font-size:46px}
  .qresult .msg{color:var(--ink-soft); margin-top:6px}
  .qgrade{display:block; margin:26px auto 0; font-family:var(--mono); font-size:12px; letter-spacing:.12em; text-transform:uppercase; background:var(--ink); color:var(--paper); border:none; padding:14px 26px; cursor:pointer}
  .qgrade[disabled]{opacity:.4; cursor:not-allowed}
  .qredo{background:none; border:1px solid var(--rule-strong); color:var(--ink); padding:10px 18px; font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; cursor:pointer; margin-top:18px}

  /* bottom nav */
  .nav{position:sticky; bottom:0; background:linear-gradient(rgba(242,236,224,0), var(--paper) 40%); padding:14px clamp(18px,5vw,52px) 22px}
  .nav-in{max-width:1080px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:16px; border-top:1px solid var(--rule); padding-top:16px}
  .back{background:none; border:none; font-family:var(--mono); font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); cursor:pointer; padding:8px 4px}
  .back:hover{color:var(--ink)} .back[disabled]{opacity:.3; cursor:default}
  .next{font-family:var(--mono); font-size:12px; letter-spacing:.1em; text-transform:uppercase; background:var(--ink); color:var(--paper); border:none; padding:15px 30px; border-radius:99px; cursor:pointer; transition:background .25s, transform .25s}
  .next:hover{background:var(--oxblood); transform:translateX(3px)}
  .hint{font-family:var(--mono); font-size:10.5px; color:var(--faint); letter-spacing:.04em}

  @media(max-width:680px){
    .jmf{grid-template-columns:1fr} .jmf .col+.col{border-left:0; border-top:1px solid var(--rule-strong)}
    .crumb .full{display:none} .hint{display:none}
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms!important; animation-iteration-count:1!important}
    .vline{stroke-dashoffset:0}.vglow{display:none}.pline,.bg::before{animation:none!important}
    .seg::after{transition:none}
  }
</style>
</head>
<body>
<div class="bg"></div>

<header class="rh">
  <div class="rh-in">
    <div class="rh-top">
      <div class="crumb">
        <span class="mk"></span>
        <a href="#">Hem</a><span class="sep">›</span>
        <a href="#" id="cb-chap">Kapitel 1</a><span class="sep">›</span>
        <span class="here" id="cb-lesson">Lektion 1.2</span>
      </div>
      <div class="folio"><b id="fnow">01</b> / <span id="ftot">07</span></div>
    </div>
    <div class="track" id="track"></div>
  </div>
</header>

<main class="stage"><div class="step in" id="step"></div></main>

<footer class="nav">
  <div class="nav-in">
    <button class="back" id="back">← Tillbaka</button>
    <span class="hint">Använd piltangenterna ← →</span>
    <button class="next" id="next">Fortsätt →</button>
  </div>
</footer>

<script>
const LESSON={"kapitel":1,"lektion":"1.2","titel":"Pris mot värde","niva":"Nybörjare","steg":[
 {"typ":"intro","kicker":"LEKTION 1.2","titel":"Pris mot värde","ingress":"Skillnaden mellan vad en aktie kostar och vad den är värd är det som skiljer investering från spel."},
 {"typ":"reading","kicker":"GRUNDEN","lead":"Pris är vad du betalar. Värde är vad du får. Priset är ett faktum, det står på skärmen och vem som helst kan läsa det. Värdet är en bedömning: din uppskattning av vad verksamheten är värd, baserat på de pengar den kommer att producera.","highlight":"Pris är vad du betalar. Värde är vad du får.","brodtext":["För det mesta ligger de två nära varandra, eftersom marknaden oftast är hyfsat förnuftig. Men ibland trycker rädsla ned priset under värdet, och då blir saker rea. Ibland trycker girighet upp priset över värdet, och då blir saker dyra.","En bra investerare köper när priset ligger under den egna uppskattningen av värdet, och avstår eller säljer när priset ligger långt över. Värde är dessutom ett intervall, inte en exakt punkt: ett grovt spann räcker för att se om priset är billigt, rimligt eller dyrt."],"takeaway":"Du försöker inte förutsäga priset. Du uppskattar värdet och väntar tills priset erbjuder ett gap."},
 {"typ":"concept","kicker":"TVÅ OLIKA SAKER","titel":"Priset rör sig, värdet ligger still","visual":{"typ":"jamforelse","element":[{"rubrik":"Pris","text":"Ett faktum på skärmen. Sätts av dem som råkar handla idag och kan svänga på en rubrik, ett fondutflöde eller en våg av humör."},{"rubrik":"Värde","text":"En bedömning. Nuvärdet av de pengar verksamheten kommer att ge sina ägare, och det rör sig långsamt."}],"figurtext":"Pris mot värde, två skilda storheter."},"forklaring":"Priset sätts av den marginella köparen och säljaren och kan hoppa flera procent på en dag utan att något i verksamheten ändrats. Värdet är jämförelsevis stabilt. Den skillnaden i rörlighet är precis där möjligheten bor."},
 {"typ":"dataviz","titel":"I gapet bor möjligheten","underrubrik":"Priset svänger runt värdet. När priset faller tydligt under värdet uppstår ett köpläge.","visual":{"typ":"linjediagram","serier":[{"namn":"Värde","stil":"heldragen","accent":true,"punkter":[25,30,34,39,45,50,56,62,68,73,78]},{"namn":"Pris","stil":"streckad","punkter":[22,38,20,44,28,52,36,60,44,70,62]}],"markor":{"serieIndex":1,"punktIndex":4,"etikett":"köpläge"},"figurtext":"Illustrativ. Punkterna visar mönstret, inte verkliga kurser."},"slutsats":"Ett köpläge är inte när priset stigit, utan när det fallit tydligt under värdet du redan uppskattat."},
 {"typ":"concept","kicker":"TVÅ FRÅGOR, INTE EN","titel":"Bra bolag och bra köp är olika saker","visual":{"typ":"jamforelse","element":[{"rubrik":"Är det en bra verksamhet?","text":"Handlar om kvaliteten: lönsamhet, tillväxt, hur stabil och försvarbar affären är."},{"rubrik":"Är det ett bra pris?","text":"Handlar om priset i förhållande till värdet. En lysande verksamhet till ett absurt pris kan vara en dålig investering."}],"figurtext":"Två frågor som nybörjaren slår ihop och den vane håller isär."},"forklaring":"Betygsätt först verksamhetens kvalitet och sedan köpets kvalitet, och köp bara när båda klarar ribban. Pris utan kvalitet är en värdefälla. Kvalitet utan prisdisciplin är hur man betalar för mycket för fina bolag och ändå förlorar pengar."},
 {"typ":"reading","kicker":"EXEMPEL: NÄR KVALITET INTE RÄCKER","lead":"Ta två bolag med samma startvinst men motsatt prislapp, så syns det varför priset avgör utfallet. Siffrorna är illustrativa.","highlight":"samma startvinst men motsatt prislapp","brodtext":["Bolag A är utmärkt: tjänar 10 kronor per aktie, växer 12 procent om året, men prissatt till 400 kronor, alltså P/E 40. Priset förutsätter redan flera år av stark tillväxt. Saktar tillväxten in till goda 8 procent kan multipeln falla från 40 till säg 20, och kursen ungefär halveras trots fortsatt lönsamhet.","Bolag B är medelmåttigt: samma 10 kronor per aktie men växer bara 3 procent, och är prissatt till 70 kronor, alltså P/E 7. Kryper det bara upp till P/E 10 stiger kursen från 70 till 100, innan någon vinsttillväxt ens räknats in."],"takeaway":"Samma startvinst, motsatta utfall, helt och hållet på grund av priset du betalade i förhållande till värdet."},
 {"typ":"quiz","fragor":[
  {"typ":"single","fraga":"Vad är den avgörande skillnaden mellan pris och värde?","alternativ":["Pris är vad du betalar, värde är vad du får","Pris gäller på kort sikt, värde gäller bara historiskt","Pris sätts av bolaget, värde sätts av marknaden"],"ratt":[0],"forklaring":"Priset är ett faktum på skärmen. Värdet är en bedömning av de pengar verksamheten kommer att producera. Besluten fattas på gapet mellan dem."},
  {"typ":"single","fraga":"Varför kan ett utmärkt bolag på P/E 40 vara en dålig investering?","alternativ":["För att höga multiplar alltid betyder bedrägeri","För att priset förutsätter perfektion, så om tillväxten saktar in kan multipeln falla och kursen nästan halveras","För att bra bolag aldrig är värda att äga"],"ratt":[1],"forklaring":"Kvalitet utan prisdisciplin är hur man förlorar pengar på fina bolag. Priset på P/E 40 lämnade inget utrymme för något mindre än perfektion."},
  {"typ":"multi","fraga":"Vilka av dessa är tecken på sund prisdisciplin?","underrubrik":"Välj alla som stämmer","alternativ":["Du har ett grovt intervall för vad verksamheten är värd, oberoende av dagens pris","Ditt enda argument för att köpa är att kursen har stigit","Du kan säga vilken avkastning dagens pris implicerar","Du kallar en aktie billig bara för att den fallit från en gammal topp"],"ratt":[0,2],"forklaring":"Disciplin är en egen värdeuppskattning oberoende av kursen och en uppfattning om implicerad avkastning. Att luta sig mot kursrörelsen eller en gammal topp är tvärtom varningstecken."}
 ]}
]};

const steps=LESSON.steg, total=steps.length;
let idx=0;
const stepEl=document.getElementById('step'), trackEl=document.getElementById('track');
const backEl=document.getElementById('back'), nextEl=document.getElementById('next');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
document.getElementById('cb-lesson').textContent='Lektion '+LESSON.lektion;
document.getElementById('cb-chap').textContent='Kapitel '+LESSON.kapitel;
document.getElementById('ftot').textContent=String(total).padStart(2,'0');
// build track segments
trackEl.innerHTML=steps.map((_,i)=>`<span class="seg" data-i="${i}"></span>`).join('');
trackEl.querySelectorAll('.seg').forEach(s=>s.addEventListener('click',()=>go(+s.dataset.i)));

const quizState={};

function esc(s){return s;}
function lineChart(v){
  const W=560,H=210,P=16, n=Math.max(...v.serier.map(s=>s.punkter.length));
  const X=i=>P+i*(W-2*P)/(n-1), Y=p=>H-P-(p/100)*(H-2*P);
  let svg='';
  v.serier.forEach(s=>{
    const d=s.punkter.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+','+Y(p).toFixed(1)).join(' ');
    if(s.accent){svg+=`<path class="vline" d="${d}"/><path class="vglow" d="${d}"/>`;}
    else{svg+=`<path class="pline" d="${d}"/>`;}
  });
  if(v.markor){const s=v.serier[v.markor.serieIndex]; const mx=X(v.markor.punktIndex), my=Y(s.punkter[v.markor.punktIndex]);
    svg+=`<circle class="dot" cx="${mx}" cy="${my}" r="4.5"/><text class="dottext" x="${mx}" y="${my+18}" text-anchor="middle">${v.markor.etikett}</text>`;}
  const leg=v.serier.map(s=>`<span><i style="${s.accent?'background:var(--ink)':'height:0;border-top:2px dashed var(--oxblood)'}"></i>${s.namn}</span>`).join('');
  return `<div class="fig"><svg viewBox="0 0 ${W} ${H}" aria-hidden="true">${svg}</svg><div class="legend">${leg}</div><div class="figtext">${v.figurtext||''}</div></div>`;
}
function bars(v){
  const max=Math.max(...v.data.map(d=>Math.abs(d.varde)))||1;
  const rows=v.data.map(d=>`<div class="bar ${d.accent?'acc':''}"><span class="lab">${d.kategori}</span><span class="tk"><i style="width:${Math.round(Math.abs(d.varde)/max*100)}%"></i></span><span class="val">${d.varde}</span></div>`).join('');
  return `<div class="bars">${rows}<div class="figtext">${v.figurtext||''}</div></div>`;
}
function flode(v){
  const parts=[];
  v.noder.forEach((nd,i)=>{ if(i){const o=nd.operator==='minus'?'−':nd.operator==='plus'?'+':nd.operator==='likamed'?'=':'→'; parts.push(`<div class="op">${o}</div>`);} parts.push(`<div class="node ${nd.accent?'acc':''}">${nd.etikett}</div>`); });
  return `<div class="flow">${parts.join('')}</div><div class="figtext">${v.figurtext||''}</div>`;
}
function andel(v){
  const tot=v.delar.reduce((a,d)=>a+d.varde,0)||1;
  const cols=['var(--ink)','var(--oxblood)','var(--gold)','var(--faint)'];
  const segs=v.delar.map((d,i)=>`<div class="seg2" style="width:${d.varde/tot*100}%;background:${cols[i%cols.length]}">${Math.round(d.varde/tot*100)}%</div>`).join('');
  const keys=v.delar.map((d,i)=>`<span><i style="background:${cols[i%cols.length]}"></i>${d.etikett}</span>`).join('');
  return `<div class="andel"><div class="barwrap">${segs}</div><div class="keys">${keys}</div><div class="figtext">${v.figurtext||''}</div></div>`;
}
function visual(v){return v.typ==='linjediagram'?lineChart(v):v.typ==='stapeldiagram'?bars(v):v.typ==='flode'?flode(v):v.typ==='andel'?andel(v):
  `<div class="jmf">${v.element.map(e=>`<div class="col"><div class="r">${e.rubrik}</div><div class="x">${e.text}</div></div>`).join('')}</div><div class="figtext">${v.figurtext||''}</div>`;}

function renderStep(s){
  if(s.typ==='intro') return `<div class="s-intro"><div class="kicker">${s.kicker}</div><h1 class="title">${s.titel}</h1><p class="ingress">${s.ingress}</p></div>`;
  if(s.typ==='reading'){
    const lead=s.lead.replace(s.highlight, m=>`<mark>${m}</mark>`);
    return `<div class="kicker">${s.kicker}</div><p class="lead">${lead}</p>${s.brodtext.map(p=>`<p class="body">${p}</p>`).join('')}<blockquote class="take">${s.takeaway}</blockquote>`;
  }
  if(s.typ==='concept') return `<div class="kicker">${s.kicker}</div><h2 class="ctitle">${s.titel}</h2>${s.visual?visual(s.visual):''}${s.forklaring?`<p class="forklaring">${s.forklaring}</p>`:''}`;
  if(s.typ==='dataviz') return `<h2 class="ctitle">${s.titel}</h2><p class="underrubrik">${s.underrubrik}</p>${s.visual?visual(s.visual):''}${s.slutsats?`<p class="slutsats">${s.slutsats}</p>`:''}`;
  if(s.typ==='quiz') return renderQuiz(s);
  return '';
}
function renderQuiz(s){
  const qs=s.fragor.map((q,qi)=>{
    const opts=q.alternativ.map((a,ai)=>`<button class="opt ${q.typ==='multi'?'multi':''}" data-q="${qi}" data-a="${ai}"><span class="mk"></span><span>${a}</span></button>`).join('');
    return `<div class="q" data-qi="${qi}"><div class="qt"><span class="qn">${qi+1}</span>${q.fraga}</div>${q.underrubrik?`<div class="qsub">${q.underrubrik}</div>`:''}${opts}<div class="exp">${q.forklaring}</div></div>`;
  }).join('');
  return `<div class="quiz"><div class="qkick">Kunskapskoll</div><h2>Testa dig själv</h2>${qs}<button class="qgrade" id="grade" disabled>Rätta svar</button><div class="qresult" id="qres"></div></div>`;
}

function go(i){
  idx=Math.max(0,Math.min(total-1,i));
  stepEl.classList.remove('in'); void stepEl.offsetWidth;
  stepEl.innerHTML=renderStep(steps[idx]);
  stepEl.classList.add('in');
  trackEl.querySelectorAll('.seg').forEach((sg,k)=>{sg.classList.toggle('done',k<idx); sg.classList.toggle('cur',k===idx);});
  document.getElementById('fnow').textContent=String(idx+1).padStart(2,'0');
  backEl.disabled=idx===0;
  nextEl.textContent=idx===total-1?'Slutför lektionen':'Fortsätt →';
  window.scrollTo({top:0,behavior:'auto'});
  if(steps[idx].typ==='quiz') wireQuiz(steps[idx]);
}
function wireQuiz(s){
  if(!quizState[idx]) quizState[idx]=s.fragor.map(q=>q.typ==='multi'?[]:null);
  const ans=quizState[idx];
  const grade=document.getElementById('grade');
  stepEl.querySelectorAll('.opt').forEach(btn=>btn.addEventListener('click',()=>{
    const qi=+btn.dataset.q, ai=+btn.dataset.a, q=s.fragor[qi];
    if(grade.dataset.graded)return;
    if(q.typ==='multi'){const arr=ans[qi]; const p=arr.indexOf(ai); p>=0?arr.splice(p,1):arr.push(ai);}
    else ans[qi]=ai;
    stepEl.querySelectorAll(`.opt[data-q="${qi}"]`).forEach(o=>{const a=+o.dataset.a; const on=q.typ==='multi'?ans[qi].includes(a):ans[qi]===a; o.classList.toggle('sel',on);});
    grade.disabled=!s.fragor.every((q,i)=>q.typ==='multi'?ans[i].length>0:ans[i]!=null);
  }));
  grade.addEventListener('click',()=>{
    if(grade.dataset.graded)return; grade.dataset.graded='1';
    let correct=0;
    s.fragor.forEach((q,qi)=>{
      const sel=q.typ==='multi'?ans[qi].slice().sort():[ans[qi]];
      const right=q.ratt.slice().sort();
      const ok=sel.length===right.length&&sel.every((v,i)=>v===right[i]); if(ok)correct++;
      stepEl.querySelectorAll(`.opt[data-q="${qi}"]`).forEach(o=>{const a=+o.dataset.a; if(q.ratt.includes(a))o.classList.add('correct'); else if((q.typ==='multi'?ans[qi].includes(a):ans[qi]===a))o.classList.add('wrong');});
      stepEl.querySelector(`.q[data-qi="${qi}"] .exp`).classList.add('show');
    });
    const pass=correct/s.fragor.length>=0.8;
    const res=document.getElementById('qres'); res.classList.add('show');
    res.innerHTML=`<div class="score" style="color:${pass?'#3E7A4F':'var(--oxblood)'}">${correct} / ${s.fragor.length}</div><div class="msg">${pass?'Godkänt. Du har greppat grunden.':'Inte riktigt än. Läs förklaringarna och försök igen.'}</div><button class="qredo" id="redo">Gör om</button>`;
    grade.style.display='none';
    document.getElementById('redo').addEventListener('click',()=>{quizState[idx]=null; go(idx);});
  });
}
function next(){ idx<total-1?go(idx+1):alert('(Mockup) Lektion klar, tillbaka till kapitlet.'); }
nextEl.addEventListener('click',next);
backEl.addEventListener('click',()=>go(idx-1));
document.addEventListener('keydown',e=>{const t=e.target; if(t&&/INPUT|TEXTAREA/.test(t.tagName))return; if(e.key==='ArrowRight'){e.preventDefault();next();} else if(e.key==='ArrowLeft'){e.preventDefault();go(idx-1);}});
go(0);
</script>
</body>
</html>
