<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ägar-AI v2 · instrumentet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E0F11; --bg2:#131417; --card:#16181C; --card2:#1C1F24;
    --line:#262A30; --line2:#333842;
    --ink:#ECEEF1; --mut:#9AA1AC; --faint:#646B76;
    --gold:#E0A43B; --gold-soft:#1F232C; --gold-d:#7E5E22;
    --pos:#5FB89A; --pos-soft:#16241F;
    --neg:#E0726F; --neg-soft:#261A1D; --neg-d:#6E3A33;
    --disp:'Fraunces',Georgia,serif; --sans:'Inter',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.55}
  .mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
  button{font-family:inherit;cursor:pointer}
  ::selection{background:var(--gold-soft)}
  .ico{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle}
  .ico svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .ico.sm svg{width:14px;height:14px}
  .pos{color:var(--pos)}.neg{color:var(--neg)}.gold{color:var(--gold)}.mutc{color:var(--mut)}.faintc{color:var(--faint)}

  /* shell */
  .app{display:grid;grid-template-columns:224px 1fr;min-height:100vh}
  .side{background:var(--bg2);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:3px;position:sticky;top:0;height:100vh}
  .logo{display:flex;align-items:center;gap:10px;font-family:var(--disp);font-weight:600;font-size:18px;padding:4px 10px 20px}
  .logo .mark{width:24px;height:24px;border-radius:7px;background:linear-gradient(150deg,var(--gold),#c98a28);display:grid;place-items:center;flex:0 0 auto}
  .logo .mark svg{width:15px;height:15px;stroke:#15171a;stroke-width:2.2;fill:none}
  .nav{background:none;border:none;color:var(--mut);text-align:left;padding:10px 11px;border-radius:9px;font-size:14px;display:flex;align-items:center;gap:11px;transition:background .16s,color .16s}
  .nav:hover{background:var(--card);color:var(--ink)}
  .nav.on{background:var(--card2);color:var(--ink)}
  .nav.on .ico{color:var(--gold)}
  .sidefoot{margin-top:auto;font-size:11px;color:var(--faint);padding:6px 10px;line-height:1.55}
  .mocktag{font-family:var(--mono);font-size:9.5px;color:var(--faint);border:1px solid var(--line2);border-radius:7px;padding:5px 8px;letter-spacing:.04em;text-align:center;margin-bottom:9px}
  .main{padding:28px 42px 90px;max-width:980px}
  @media(max-width:760px){.app{grid-template-columns:1fr}.side{display:none}.main{padding:20px}}

  .masthead{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:20px;font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
  .masthead .r{margin-left:auto;color:var(--mut)}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
  h1.big{font-family:var(--disp);font-weight:600;font-size:34px;margin:8px 0 3px;letter-spacing:-.5px;line-height:1.05}
  .sub{color:var(--mut);font-size:14px;margin-bottom:20px}
  .slab{display:flex;align-items:center;gap:12px;margin:28px 2px 12px;font-family:var(--mono);font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint)}
  .slab::after{content:'';flex:1;height:1px;background:var(--line)}

  /* ===== front page rows with data blocks ===== */
  .front{border-top:1px solid var(--line2);margin-top:4px}
  .frow{display:grid;grid-template-columns:1fr auto;gap:8px 26px;padding:17px 4px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .14s;align-items:start}
  .frow:hover{background:var(--bg2)}
  .fr-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .fr-name{font-family:var(--disp);font-weight:600;font-size:19px;letter-spacing:-.2px}
  .fr-tk{font-family:var(--mono);font-size:10.5px;color:var(--faint);letter-spacing:.05em}
  .stword{font-size:12px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
  .stword .d{width:6px;height:6px;border-radius:50%;background:currentColor;flex:0 0 auto}
  .frow p{color:var(--mut);font-size:13.5px;line-height:1.55;margin:6px 0 0;max-width:56ch}
  .fr-src{margin-top:7px;font-size:11px;color:var(--faint);font-family:var(--mono)}
  .dblock{text-align:right;min-width:190px}
  .dblock .price{font-family:var(--mono);font-size:15px}
  .dblock .price .chg{font-size:12px;margin-left:8px}
  .dblock .sp{margin:6px 0 5px;color:var(--faint)}
  .dblock .micro{font-family:var(--mono);font-size:10.5px;color:var(--faint);letter-spacing:.02em}
  .dblock .micro b{color:var(--mut);font-weight:500}
  .frow.smallr .fr-name{font-size:15.5px;font-weight:500}
  .frow.smallr p{margin-top:3px;font-size:12.5px}
  .frow.smallr .dblock .price{font-size:13px}
  .endrow{padding:13px 4px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--faint);display:flex;gap:10px;align-items:baseline;line-height:1.6}
  .endrow .el{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;flex:0 0 92px;padding-top:2px}
  .endrow .ev b{color:var(--mut);font-weight:500}
  .endrow .ev i{font-style:normal;color:var(--mut)}

  /* ===== stock page ===== */
  .back{background:none;border:none;color:var(--mut);font-size:13px;margin-bottom:14px;display:flex;align-items:center;gap:7px;padding:0}
  .back:hover{color:var(--ink)}
  .shead{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-bottom:10px}
  .shead h1{font-family:var(--disp);font-weight:600;font-size:29px;margin:0;letter-spacing:-.4px}
  .factbar{display:flex;flex-wrap:wrap;gap:6px 0;align-items:baseline;font-family:var(--mono);font-size:12.5px;color:var(--mut);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 2px;margin-bottom:14px}
  .factbar .f{display:inline-flex;gap:7px;align-items:baseline}
  .factbar .k{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
  .factbar .v{color:var(--ink)}
  .factbar .sep{margin:0 14px;color:var(--line2)}
  .whyline{color:var(--mut);font-size:13.5px;margin:0 0 16px;border-left:2px solid var(--gold-d);padding-left:12px;line-height:1.5}
  .whyline b{color:var(--faint);font-weight:500;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:3px}
  /* single-page: sticky anchor bar + sections */
  .anchbar{position:sticky;top:0;z-index:20;background:rgba(14,15,17,.92);backdrop-filter:blur(8px);display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin:0 0 4px;padding:6px 0}
  .anch{background:none;border:none;color:var(--mut);padding:8px 12px;font-size:12.5px;border-radius:8px;white-space:nowrap;transition:.14s}
  .anch:hover{color:var(--ink)}
  .anch.on{color:var(--ink);background:var(--card2)}
  section.sec{scroll-margin-top:58px;padding:24px 0 10px;border-top:1px solid var(--line);margin-top:16px}
  section.sec:first-of-type{border-top:none;margin-top:0;padding-top:10px}
  .sech{display:flex;align-items:baseline;gap:11px;margin:0 0 14px}
  .sech h2{font-family:var(--disp);font-weight:600;font-size:19px;margin:0;letter-spacing:-.2px}
  .sech .sm{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
  .duo{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  @media(max-width:680px){.duo{grid-template-columns:1fr}}
  .kv{font-family:var(--mono);font-size:24px;margin-top:2px}
  .ownnote{font-size:12px;color:var(--mut);margin-top:9px;line-height:1.55}

  /* two-lane: prose + data rail */
  .lane{display:grid;grid-template-columns:1fr 264px;gap:24px;align-items:start}
  @media(max-width:820px){.lane{grid-template-columns:1fr}}
  .prose .lab{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-bottom:11px}
  .prose p{margin:0 0 11px;font-size:14.5px;line-height:1.62}
  .tag{display:inline-block;font-size:10px;font-family:var(--mono);letter-spacing:.05em;border-radius:5px;padding:2px 7px;margin-right:7px;text-transform:uppercase}
  .tag.fakta{background:var(--pos-soft);color:var(--pos)}.tag.slutsats{background:var(--gold-soft);color:var(--gold)}
  .cit{font-family:var(--mono);font-size:9.5px;color:var(--gold);background:var(--gold-soft);border-radius:4px;padding:1px 5px;vertical-align:super;cursor:pointer;margin-left:2px}
  .rail{display:flex;flex-direction:column;gap:9px}
  .rail .rlab{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:-2px}
  .chip{border:1px solid var(--line);border-radius:10px;padding:10px 13px;background:var(--card)}
  .chip .ck{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
  .chip .cv{display:flex;align-items:baseline;gap:9px;margin-top:3px}
  .chip .cv .v{font-family:var(--mono);font-size:17px}
  .chip .cv .dd{font-family:var(--mono);font-size:11.5px}
  .chip .cc{font-size:11px;color:var(--mut);margin-top:2px}

  /* tables */
  .tscroll{overflow-x:auto}
  table.dt{width:100%;border-collapse:collapse;font-size:12.5px}
  table.dt th{text-align:right;color:var(--faint);font-weight:500;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;padding:0 0 9px 14px;white-space:nowrap}
  table.dt th:first-child{text-align:left;padding-left:0}
  table.dt td{padding:9px 0 9px 14px;border-top:1px solid var(--line);font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
  table.dt td:first-child{text-align:left;font-family:var(--sans);color:var(--ink);padding-left:0}
  table.dt tr:hover td{background:var(--bg2)}
  table.dt td .u{color:var(--faint);font-size:10px;margin-left:3px}
  .sparkcell{color:var(--faint)}
  .note{font-size:11px;color:var(--faint);margin:8px 2px 0;font-family:var(--mono)}

  /* verdict + minis + quotes */
  .verdict{font-family:var(--disp);font-size:17.5px;line-height:1.45;margin:0 0 4px}
  .vlab{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-bottom:9px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0}
  @media(max-width:640px){.cols{grid-template-columns:1fr}}
  .mini h4{margin:0 0 9px;font-size:10.5px;font-family:var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--mut)}
  .mini.good h4{color:var(--pos)}.mini.bad h4{color:var(--neg)}
  .mini ul{margin:0;padding:0;list-style:none}
  .mini li{font-size:13px;line-height:1.5;margin-bottom:7px;padding-left:15px;position:relative}
  .mini li::before{content:'';position:absolute;left:0;top:8px;width:4px;height:4px;border-radius:50%;background:var(--line2)}
  .mini.good li::before{background:var(--pos)}.mini.bad li::before{background:var(--neg)}
  .quote{border-left:2px solid var(--gold-d);padding:3px 0 3px 15px;margin:12px 0;font-size:14.5px;line-height:1.55;font-family:var(--disp);font-style:italic}
  .quote .who{display:block;font-size:10.5px;color:var(--faint);font-family:var(--mono);font-style:normal;margin-top:5px}

  /* pillar cards with threshold charts */
  .pcard{border:1px solid var(--line);border-radius:12px;padding:15px 17px 13px;margin-bottom:11px;background:var(--card)}
  .pcard.rr{border-color:var(--neg-d)}
  .pcard .ph{display:flex;align-items:baseline;gap:11px;flex-wrap:wrap}
  .pcard .pt{font-family:var(--disp);font-weight:500;font-size:15px}
  .pcard .pv{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--mut)}
  .pchart{margin:10px 0 4px;position:relative}
  .pchart svg{display:block;width:100%;height:58px}
  .pmeta{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9.5px;color:var(--faint);letter-spacing:.03em}
  .pev{font-size:12px;color:var(--mut);margin-top:7px;line-height:1.5}
  .tnote{background:var(--neg-soft);border:1px solid var(--neg-d);border-radius:11px;padding:13px 15px;font-size:13px;color:#f3c8c2;margin-bottom:15px;line-height:1.55}
  .tnote b{color:#fff}

  /* chat */
  .chat{display:flex;flex-direction:column;gap:13px;margin-bottom:16px}
  .bub{max-width:92%;padding:13px 16px;border-radius:14px;font-size:14px;line-height:1.6}
  .bub.u{align-self:flex-end;background:var(--gold);color:#15171a;font-weight:500}
  .bub.a{align-self:flex-start;background:var(--card);border:1px solid var(--line)}
  .bub.a table.dt{margin-top:10px;font-size:11.5px}
  .bub.a table.dt td{padding:6px 0 6px 12px}
  .seed{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .seedb{background:var(--card);border:1px solid var(--line2);border-radius:99px;padding:8px 13px;font-size:12.5px;color:var(--mut);transition:.14s}
  .seedb:hover{border-color:var(--gold);color:var(--ink)}
  .askbar{display:flex;gap:9px;position:sticky;bottom:14px}
  .askbar input{flex:1;background:var(--card2);border:1px solid var(--line2);border-radius:12px;color:var(--ink);padding:12px 15px;font-size:14px;outline:none;font-family:var(--sans)}
  .askbar input:focus{border-color:var(--gold)}
  .askbar button{background:var(--gold);border:none;color:#15171a;border-radius:12px;padding:0 18px;font-weight:600}

  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="logo"><span class="mark" id="mk"></span> Ägar-AI</div>
    <button class="nav on" data-view="idag"></button>
    <button class="nav" data-view="fraga"></button>
    <div class="sidefoot">
      <div class="mocktag">V2 · PROTOTYP · EXEMPELDATA</div>
      Fiktiva bolag och illustrativa siffror. Fokus: look and feel med data.
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>

<script>
/* ============ icons ============ */
const SVG={
  today:'<path d="M12 2v7"/><path d="m4.9 11 1.4 1.4"/><path d="M2 18h2"/><path d="M20 18h2"/><path d="m17.7 12.4 1.4-1.4"/><path d="M22 22H2"/><path d="m8 6 4-4 4 4"/><path d="M16 18a4 4 0 0 0-8 0"/>',
  ask:'<path d="M9.9 15.5A2 2 0 0 0 8.5 14L2.4 12.5a.5.5 0 0 1 0-1L8.5 10A2 2 0 0 0 9.9 8.5l1.6-6.1a.5.5 0 0 1 1 0L14 8.5A2 2 0 0 0 15.5 9.9l6.1 1.6a.5.5 0 0 1 0 1L15.5 14a2 2 0 0 0-1.4 1.4l-1.6 6.1a.5.5 0 0 1-1 0z"/>',
  arrow:'<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
  file:'<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/>',
  pulse:'<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>'
};
function svgi(n,w){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w||1.6}" stroke-linecap="round" stroke-linejoin="round">${SVG[n]||''}</svg>`;}
function ic(n,c){return `<span class="ico ${c||''}">${svgi(n)}</span>`;}
document.getElementById('mk').innerHTML=svgi('pulse',2.2);

/* ============ chart helpers ============ */
function spark(pts,w=72,h=20,color){
  const mn=Math.min(...pts),mx=Math.max(...pts),r=mx-mn||1;
  const xs=pts.map((p,i)=>[(i/(pts.length-1))*(w-4)+2, h-3-((p-mn)/r)*(h-7)]);
  const path=xs.map(p=>p.map(n=>n.toFixed(1)).join(',')).join(' ');
  const last=xs[xs.length-1];
  const c=color||'#646B76';
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${path}" fill="none" stroke="${c}" stroke-width="1.4"/><circle cx="${last[0]}" cy="${last[1]}" r="2" fill="${c}"/></svg>`;
}
function pillChart(pts,larm,status){
  const W=560,H=58,P=6;
  const all=larm==null?pts:[...pts,larm];
  const mn=Math.min(...all),mx=Math.max(...all),pad=(mx-mn||1)*0.18,lo=mn-pad,hi=mx+pad,r=hi-lo;
  const y=v=>H-P-((v-lo)/r)*(H-2*P);
  const xs=pts.map((p,i)=>[(i/(pts.length-1))*(W-14)+7,y(p)]);
  const path=xs.map(p=>p.map(n=>n.toFixed(1)).join(',')).join(' ');
  const last=xs[xs.length-1];
  const col=status==='r'?'#E0726F':status==='y'?'#E0A43B':'#5FB89A';
  const larmLine=larm==null?'':`<line x1="7" x2="${W-7}" y1="${y(larm).toFixed(1)}" y2="${y(larm).toFixed(1)}" stroke="#7E5E22" stroke-width="1" stroke-dasharray="4 4"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${larmLine}<polyline points="${path}" fill="none" stroke="${col}" stroke-width="1.8"/><circle cx="${last[0]}" cy="${last[1]}" r="3" fill="${col}"/></svg>`;
}
function fmtChg(v){const s=v>0?'+':'';const c=v>0?'pos':v<0?'neg':'mutc';return `<span class="${c}">${s}${v.toFixed(1).replace('.',',')}%</span>`;}
function d(cls,txt){return `<span class="${cls}">${txt}</span>`;}

/* ============ data (fiktiv, illustrativ) ============ */
const Q=['Q2 25','Q3 25','Q4 25','Q1 26','Q2 26','Q3 26'];
const STOCKS={
 NORL:{tk:'NORL',namn:'Norlux Industri',status:'ok',statusLab:'Skälet stärkt',
  pris:284.50,idag:1.8,spark12:[205,212,220,232,228,241,248,255,251,262,271,284],
  micro:['P/E 24,3','EV/EBIT 18,9','NS/EBITDA 1,4x'],
  fact:{v52:'198,20 till 291,00',mcap:'42,2 mdkr',pe:'24,3',dir:'1,4%'},
  why:'Lönsam förvärvsmaskin: organisk tillväxt över 8%, stigande marginal, ingen utspädning.',
  event:'Q3: organisk tillväxt 11,0% mot guidning 7 till 9. FCF 388 Mkr, +18%. Höjd helårsguidning. Alla tre pelare håller.',src:'Q3-rapport · imorse 07:30',
  what:[
   {t:'fakta',txt:'Q3-rapporten kom imorse. Organisk tillväxt 11,0%, över bolagets guidning om 7 till 9%. Fritt kassaflöde 388 Mkr, upp 18% mot samma kvartal i fjol. Nettoskulden nere på 1,4x EBITDA.',c:1},
   {t:'slutsats',txt:'Rapporten stärker ditt skäl på alla tre pelare: tillväxten håller, marginalen vidgas, aktieantalet står stilla. Marknaden lär fokusera på den höjda helårsguidningen. Svagheten att bevaka är Nordamerika, organiskt minus 2%.',c:0}],
  rail:[
   {k:'Organisk tillväxt Q3',v:'11,0%',dd:'+2,5 pp',dc:'pos',cc:'mot konsensus 8,5 · guidning 7 till 9'},
   {k:'Fritt kassaflöde',v:'388 Mkr',dd:'+18%',dc:'pos',cc:'i fjol 329 Mkr · konvertering 95%'},
   {k:'EBIT-marginal',v:'19,2%',dd:'+1,2 pp',dc:'pos',cc:'i fjol 18,0% · konsensus 18,3%'},
   {k:'Nettoskuld/EBITDA',v:'1,4x',dd:'ned 0,3',dc:'pos',cc:'förvärvsutrymme kvar'},
   {k:'Antal aktier',v:'148,2 M',dd:'oförändrat',dc:'mutc',cc:'11 kvartal i rad'}],
  fund:{
   rows:[
    ['Omsättning, Mkr',[2145,2203,2260,2255,2340,2410],'+9,4%','pos',0],

    <div class="shead"><h1>${s.namn}</h1><span class="fr-tk">${s.tk}</span>${stw(s)}</div>
    <div class="factbar num">
      <span class="f"><span class="v">${s.pris.toFixed(2).replace('.',',')}</span> ${fmtChg(s.idag)}</span><span class="sep">·</span>
      <span class="f"><span class="k">52 v</span><span class="v">${s.fact.v52}</span></span><span class="sep">·</span>
      <span class="f"><span class="k">Börsvärde</span><span class="v">${s.fact.mcap}</span></span><span class="sep">·</span>
      <span class="f"><span class="k">P/E</span><span class="v">${s.fact.pe}</span></span><span class="sep">·</span>
      <span class="f"><span class="k">Dir.avk</span><span class="v">${s.fact.dir}</span></span>
    </div>
    <div class="whyline"><b>Varför du äger det</b>${s.why}</div>
    <div class="anchbar" id="anchbar">${anchors.map(([id,l])=>`<button class="anch" data-a="${id}" onclick="jumpTo('${id}')">${l}</button>`).join('')}</div>
    <section class="sec" id="sec-hant"><div class="sech"><h2>Vad har hänt</h2><span class="sm">AI · grundat · citerat</span></div>${secHant(s)}</section>
    <section class="sec" id="sec-skal"><div class="sech"><h2>Ditt skäl</h2><span class="sm">pelare mot dina larmnivåer</span></div>${tabSkal(s)}</section>
    ${s.report?`<section class="sec" id="sec-rapport"><div class="sech"><h2>Senaste rapporten</h2><span class="sm">Q3 2026</span></div>${tabRapport(s)}</section>`:''}
    ${s.fund?`<section class="sec" id="sec-fund"><div class="sech"><h2>Fundamenta</h2><span class="sm">ur rapporterna · exempeldata</span></div>${tabFund(s)}</section>`:''}
    ${x?secAgare(s)+secBlankUtd(s)+secKalHist(s):''}
    <section class="sec" id="sec-fraga"><div class="sech"><h2>Fråga AI</h2><span class="sm">grundat · med källa</span></div>${tabChat(s)}</section>`;
  wireChat(s);wireAnchors();
}
function jumpTo(id){const el=document.getElementById('sec-'+id);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});}
function wireAnchors(){
  const bar=document.getElementById('anchbar');if(!bar)return;
  const obs=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){const id=e.target.id.replace('sec-','');
    bar.querySelectorAll('.anch').forEach(a=>a.classList.toggle('on',a.dataset.a===id));}})},{rootMargin:'-15% 0px -70% 0px'});
  document.querySelectorAll('section.sec').forEach(sc=>obs.observe(sc));
}
function secHant(s){
  return `<div class="lane">
    <div class="prose">${s.what.map(w=>`<p><span class="tag ${w.t}">${w.t}</span>${w.txt}${w.c?` <a class="cit">${w.c}</a>`:''}</p>`).join('')}</div>
    <div class="rail"><div class="rlab">Talen bakom</div>
      ${s.rail.map(c=>`<div class="chip"><div class="ck">${c.k}</div><div class="cv"><span class="v">${c.v}</span><span class="dd ${c.dc}">${c.dd}</span></div><div class="cc">${c.cc}</div></div>`).join('')||'<div class="cc" style="color:var(--faint);font-size:12px">Inga nya tal idag.</div>'}
    </div></div>`;
}
function secAgare(s){const x=s.extras;
  return `<section class="sec" id="sec-agare"><div class="sech"><h2>Ägare & insyn</h2><span class="sm">FI insynsregister · exempeldata</span></div>
    <div class="duo">
      <div><div class="slabel" style="margin-top:0">Största ägare</div>
        <table class="dt"><tbody>${x.agare.map(a=>`<tr><td>${a[0]}</td><td>${a[1]}</td></tr>`).join('')}</tbody></table></div>
      <div><div class="slabel" style="margin-top:0">Insynshandel</div>
        <table class="dt"><tbody>${x.insyn.map(i=>`<tr><td>${i[1]} <span class="faintc" style="font-size:10px;font-family:var(--mono)">${i[0]}</span></td><td class="${i[4]}">${i[2]}</td><td>${i[3]}</td></tr>`).join('')}</tbody></table>
        <div class="ownnote"><span class="${x.insynCls}">${x.insynNet}</span></div></div>
    </div></section>`;
}
function secBlankUtd(s){const x=s.extras;
  return `<section class="sec" id="sec-blankutd"><div class="sech"><h2>Blankning & utdelning</h2><span class="sm">FI blankningsregister · exempeldata</span></div>
    <div class="duo">
      <div><div class="slabel" style="margin-top:0">Blankning, andel av aktier</div>
        <div class="kv ${x.blank.cls}">${x.blank.nu}</div>
        <div class="ownnote"><span class="${x.blank.cls}">${x.blank.trend}.</span> ${x.blank.note}</div></div>
      <div><div class="slabel" style="margin-top:0">Utdelning per aktie, kr</div>
        <table class="dt"><tbody>${x.utd.map(u=>`<tr><td>${u[0]}</td><td>${u[1]}</td></tr>`).join('')}</tbody></table>
        <div class="ownnote">${x.utdNext}</div></div>
    </div></section>`;
}
function secKalHist(s){const x=s.extras;
  return `<section class="sec" id="sec-kalhist"><div class="sech"><h2>Kalender & historik</h2><span class="sm">allt samlat, daterat</span></div>
    <div class="duo">
      <div><div class="slabel" style="margin-top:0">Kommande</div>
        <table class="dt"><tbody>${x.kal.map(k=>`<tr><td style="font-family:var(--mono);color:var(--gold);font-size:11px">${k[0]}</td><td style="text-align:left;font-family:var(--sans);color:var(--ink)">${k[1]}</td></tr>`).join('')}</tbody></table></div>
      <div><div class="slabel" style="margin-top:0">Hänt, med våra analyser</div>
        <table class="dt"><tbody>${x.hist.map(h=>`<tr><td style="font-family:var(--mono);color:var(--faint);font-size:10.5px;vertical-align:top;white-space:nowrap">${h[0]}</td><td style="text-align:left;font-family:var(--sans);color:var(--mut);white-space:normal;line-height:1.5">${h[1]}</td></tr>`).join('')}</tbody></table></div>
    </div></section>`;
}
function pcardHTML(p){
  const stTxt=p.s==='g'?'håller':p.s==='r'?'bruten':'bevaka';
  const stCls=p.s==='g'?'pos':p.s==='r'?'neg':'gold';
  return `<div class="pcard ${p.s==='r'?'rr':''}">
    <div class="ph"><span class="pt">${p.n}</span><span class="pv"><span class="${stCls}">${stTxt}</span> · ${p.now}</span></div>
    <div class="pchart">${pillChart(p.pts,p.larm,p.s)}</div>
    <div class="pmeta"><span>${Q[0]}</span><span class="gold">${p.larmLab}</span><span>${Q[Q.length-1]}</span></div>
    <div class="pev">${p.ev}</div>
  </div>`;
}
function tabRapport(s){
  const r=s.report;
  return `<div class="vlab">${ic('ask','sm')} AI · rapporten på 15 sekunder</div>
  <p class="verdict">${r.verdict}</p>
  <div class="slab">Utfall mot konsensus, i fjol och guidning</div>
  <div class="tscroll"><table class="dt">
    <thead><tr><th>Nyckeltal</th><th>Utfall</th><th>Konsensus</th><th>Mot kons.</th><th>I fjol</th><th>Mot i fjol</th><th>Guidning</th><th>Trend 6 kv</th></tr></thead>
    <tbody>${r.grid.map(g=>`<tr><td>${g[0]}</td><td>${g[1]}</td><td class="mutc">${g[2]}</td><td class="${g[4]}">${g[3]}</td><td class="mutc">${g[5]}</td><td class="${g[7]}">${g[6]}</td><td class="faintc">${g[8]}</td><td class="sparkcell">${spark(g[9],76,18,g[7]==='neg'?'#E0726F':'#5FB89A')}</td></tr>`).join('')}</tbody>
  </table></div>
  <div class="slab">Segment</div>
  <div class="tscroll"><table class="dt">
    <thead><tr><th>Segment</th><th>Omsättning, Mkr</th><th>Tillväxt</th><th>EBIT-marginal</th><th>Förändring</th></tr></thead>
    <tbody>${r.seg.map(g=>`<tr><td>${g[0]}</td><td>${g[1]}</td><td class="${g[3]}">${g[2]}</td><td>${g[4]}</td><td class="${g[6]}">${g[5]}</td></tr>`).join('')}</tbody>
  </table></div>
  <div class="cols">
    <div class="mini good"><h4>Bra</h4><ul>${r.good.map(x=>`<li>${x}</li>`).join('')}</ul></div>
    <div class="mini bad"><h4>Dåligt</h4><ul>${r.bad.map(x=>`<li>${x}</li>`).join('')}</ul></div>
  </div>
  <div class="slab">Överraskningar</div>
  <div class="mini"><ul>${r.surprises.map(x=>`<li>${x}</li>`).join('')}</ul></div>
  <div class="slab">Från ledningen</div>
  ${r.quotes.map(q=>`<div class="quote">”${q.q}”<span class="who">${q.who}</span></div>`).join('')}
  <div class="slab">Hur det rör ditt skäl</div>
  <p style="font-size:14px;line-height:1.6;color:var(--mut);margin:0">${r.tes}</p>`;
}
function tabFund(s){
  const f=s.fund;
  return `<div class="vlab">${ic('ask','sm')} AI · läsanvisning</div>
  <p class="verdict" style="font-size:15.5px">${f.ai}</p>
  <div class="slab">Kvartalen</div>
  <div class="tscroll"><table class="dt">
    <thead><tr><th>Nyckeltal</th>${Q.map(q=>`<th>${q}</th>`).join('')}<th>Mot i fjol</th><th>Trend</th></tr></thead>
    <tbody>${f.rows.map(row=>{const[name,pts,yoy,cls,dec]=row;
      return `<tr><td>${name}</td>${pts.map(p=>`<td>${p.toLocaleString('sv-SE',{minimumFractionDigits:dec,maximumFractionDigits:dec})}</td>`).join('')}<td class="${cls}">${yoy}</td><td class="sparkcell">${spark(pts,76,18,cls==='neg'?'#E0726F':cls==='pos'?'#5FB89A':'#646B76')}</td></tr>`;}).join('')}</tbody>
  </table></div>
  <div class="slab">Multiplar mot egen historik</div>
  <div class="tscroll"><table class="dt" style="max-width:520px">
    <thead><tr><th>Multipel</th><th>Nu</th><th>5-årssnitt</th><th>Mot snittet</th></tr></thead>
    <tbody>${f.mult.map(m=>{const neg=m[3].startsWith('+');return `<tr><td>${m[0]}</td><td>${m[1]}</td><td class="mutc">${m[2]}</td><td class="${neg?'neg':'pos'}">${m[3]}</td></tr>`;}).join('')}</tbody>
  </table></div>
  <div class="note">Jämförelsen är mot bolagets egen historik, aldrig ett omdöme om köpvärdhet. Exempeldata.</div>`;
}
function tabSkal(s){
  const broken=s.pillars.some(p=>p.s==='r');
  const note=broken?`<div class="tnote"><b>Skälet är utmanat.</b> En pelare korsade sin larmnivå. Det betyder inte sälj, det betyder att en av dina egna förutsättningar inte längre håller. Ompröva den, inte hela innehavet i panik.</div>`:'';
  return `${note}
  <p style="color:var(--mut);font-size:13px;margin:0 0 16px;max-width:64ch">Du skrev ditt skäl som testbara pelare med larmnivåer. Kurvorna nedan är pelarnas underliggande mått, med din larmnivå ritad som streckad linje. Vi stör dig bara när en kurva korsar sin linje.</p>
  ${s.pillars.map(pcardHTML).join('')}`;
}
function tabChat(s){
  const qs=Object.keys(s.chat);
  return `<div class="seed">${qs.map(q=>`<button class="seedb" onclick="ask('${q.replace(/'/g,"\\'")}')">${q}</button>`).join('')}</div>
  <div class="chat" id="chat"><div class="bub a">Fråga mig om ${s.namn}. Jag svarar grundat, med källa och siffrorna synliga, och säger ifrån när jag inte vet.</div></div>
  <div class="askbar"><input id="askin" placeholder="Fråga om ${s.namn}…"><button onclick="askIn()">Fråga</button></div>`;
}
function dataTable(dt){if(!dt)return '';
  return `<table class="dt"><thead><tr>${dt.head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${dt.rows.map(r=>`<tr>${r.map((c,i)=>`<td${i===0?' style="font-family:var(--sans);color:var(--mut)"':''}>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;}
let chatStock=null;
function wireChat(s){chatStock=s;const i=document.getElementById('askin');if(i)i.onkeydown=e=>{if(e.key==='Enter')askIn();};}
function ask(q){const s=chatStock||S(cur),chat=document.getElementById('chat');
  chat.insertAdjacentHTML('beforeend',`<div class="bub u">${q}</div>`);
  const a=s.chat[q];
  const html=a?`${a.txt}${dataTable(a.data)}`:'<span class="tag slutsats">slutsats</span> Prototyp: förberedda svar på de föreslagna frågorna. I produkten hämtas svar och tabeller ur källdata.';
  setTimeout(()=>{chat.insertAdjacentHTML('beforeend',`<div class="bub a">${html}</div>`);window.scrollTo(0,document.body.scrollHeight);},200);}
function askIn(){const i=document.getElementById('askin');if(i&&i.value.trim()){ask(i.value.trim());i.value='';}}

/* ============ global chat ============ */
const GLOBAL={
 'Vad kräver mest uppmärksamhet?':{txt:'<span class="tag slutsats">slutsats</span> Telvio. Bruttomarginalen korsade din larmnivå 40,0% <a class="cit">1</a>. Norlux också, men positivt: stark rapport, alla pelare håller <a class="cit">2</a>.',
   data:{head:['Bolag','Pelare','Nu','Larm'],rows:[['Telvio','Bruttomarginal','38,0%','<span class=neg>40,0% korsad</span>'],['Norlux','Org. tillväxt','11,0%','<span class=pos>8,0% håller</span>']]}},
 'Vilka skäl vacklar?':{txt:'<span class="tag fakta">fakta</span> Ett av fem: Telvio, pelaren om stigande marginal är bruten <a class="cit">1</a>. Utdelningstäckningen där är dessutom satt på bevakning (1,15x mot larm 1,0x).',data:null},
 'Dold koncentrationsrisk?':{txt:'<span class="tag slutsats">slutsats</span> Norlux och Telvio är båda känsliga för samma europeiska industricykel. Tillsammans 46% av portföljen. Ingen varning, men en korrelation värd att känna till.',
   data:{head:['Innehav','Andel','Cykelkänslighet'],rows:[['Norlux','28%','europeisk industri'],['Telvio','18%','europeisk industri'],['Övriga tre','54%','blandad']]}}
};
function renderFragaG(){
  main.innerHTML=`<div class="masthead">Marginalen · Ägar-AI<span class="r">Grundad AI</span></div>
  <div class="eyebrow">Hela portföljen</div><h1 class="big">Fråga AI</h1>
  <div class="sub">Svar med källa och siffrorna synliga, aldrig påhittade tal.</div>
  <div class="seed">${Object.keys(GLOBAL).map(q=>`<button class="seedb" onclick="askG('${q.replace(/'/g,"\\'")}')">${q}</button>`).join('')}</div>
  <div class="chat" id="gchat"><div class="bub a">Jag känner dina fem innehav och ditt skäl för varje. Fråga vad du vill.</div></div>
  <div class="askbar"><input id="gin" placeholder="Fråga om din portfölj…"><button onclick="askGIn()">Fråga</button></div>`;
  const i=document.getElementById('gin');if(i)i.onkeydown=e=>{if(e.key==='Enter')askGIn();};
}
function askG(q){const chat=document.getElementById('gchat');chat.insertAdjacentHTML('beforeend',`<div class="bub u">${q}</div>`);
  const a=GLOBAL[q];const html=a?`${a.txt}${dataTable(a.data)}`:'<span class="tag slutsats">slutsats</span> Prototyp: förberedda svar på de föreslagna frågorna.';
  setTimeout(()=>{chat.insertAdjacentHTML('beforeend',`<div class="bub a">${html}</div>`);window.scrollTo(0,document.body.scrollHeight);},200);}
function askGIn(){const i=document.getElementById('gin');if(i&&i.value.trim()){askG(i.value.trim());i.value='';}}

render();
</script>
</body>
</html>
