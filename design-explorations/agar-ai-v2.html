<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ägarkollen · av Marginalen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E0F11; --bg2:#131417; --card:#16181C; --card2:#1C1F24;
    --line:#262A30; --line2:#333842;
    --ink:#ECEEF1; --mut:#9AA1AC; --faint:#646B76;
    --gold:#E0A43B; --gold-soft:#1F232C; --gold-d:#7E5E22;
    --pos:#5FB89A; --pos-soft:#16241F;
    --neg:#E0726F; --neg-soft:#261A1D; --neg-d:#6E3A33;
    --bgt:rgba(14,15,17,.92);
    --disp:'Fraunces',Georgia,serif; --sans:'Inter',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
  }
  html[data-theme="light"]{
    --bg:#F7F6F3; --bg2:#F1EFEA; --card:#FFFFFF; --card2:#F3F1EB;
    --line:#E6E3DB; --line2:#D2CEC3;
    --ink:#23252B; --mut:#5C6470; --faint:#8B929B;
    --gold:#9C6B10; --gold-soft:#F6ECD8; --gold-d:#C9A45C;
    --pos:#1E7A5C; --pos-soft:#E4F0EA;
    --neg:#BA4A42; --neg-soft:#F7E6E4; --neg-d:#DCA69F;
    --bgt:rgba(247,246,243,.92);
  }
  html[data-theme="light"] .askbar button{background:#E5B04A;color:#241C09}
  html[data-theme="light"] .bub.u{background:#E5B04A;color:#241C09}
  html[data-theme="light"] .logo .mark, html[data-theme="light"] .top .mark{background:linear-gradient(150deg,#E5B04A,#c98a28)}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.55}
  .mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
  button{font-family:inherit;cursor:pointer}
  ::selection{background:var(--gold-soft)}
  .ico{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle}
  .ico svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .ico.sm svg{width:14px;height:14px}
  .pos{color:var(--pos)}.neg{color:var(--neg)}.gold{color:var(--gold)}.mutc{color:var(--mut)}.faintc{color:var(--faint)}

  /* shell */
  .app{display:grid;grid-template-columns:224px 1fr;min-height:100vh}
  .side{background:var(--bg2);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:3px;position:sticky;top:0;height:100vh}
  .logo{display:flex;align-items:center;gap:10px;font-family:var(--disp);font-weight:600;font-size:18px;padding:4px 10px 20px}
  .logo .mark{width:24px;height:24px;border-radius:7px;background:linear-gradient(150deg,var(--gold),#c98a28);display:grid;place-items:center;flex:0 0 auto}
  .logo .mark svg{width:15px;height:15px;stroke:#15171a;stroke-width:2.2;fill:none}
  .nav{background:none;border:none;color:var(--mut);text-align:left;padding:10px 11px;border-radius:9px;font-size:14px;display:flex;align-items:center;gap:11px;transition:background .16s,color .16s}
  .nav:hover{background:var(--card);color:var(--ink)}
  .nav.on{background:var(--card2);color:var(--ink)}
  .nav.on .ico{color:var(--gold)}
  .sidefoot{margin-top:auto;font-size:11px;color:var(--faint);padding:6px 10px;line-height:1.55}
  .mocktag{font-family:var(--mono);font-size:9.5px;color:var(--faint);border:1px solid var(--line2);border-radius:7px;padding:5px 8px;letter-spacing:.04em;text-align:center;margin-bottom:9px}
  .main{padding:28px 42px 90px;max-width:980px}
  @media(max-width:760px){.app{grid-template-columns:1fr}.side{display:none}.main{padding:20px}}

  .masthead{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:20px;font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
  .masthead .r{margin-left:auto;color:var(--mut)}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
  h1.big{font-family:var(--disp);font-weight:600;font-size:34px;margin:8px 0 3px;letter-spacing:-.5px;line-height:1.05}
  .sub{color:var(--mut);font-size:14px;margin-bottom:20px}
  .slab{display:flex;align-items:center;gap:12px;margin:28px 2px 12px;font-family:var(--mono);font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint)}
  .slab::after{content:'';flex:1;height:1px;background:var(--line)}

  /* ===== front page rows with data blocks ===== */
  .front{border-top:1px solid var(--line2);margin-top:4px}
  .frow{display:grid;grid-template-columns:1fr auto;gap:8px 26px;padding:17px 4px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .14s;align-items:start}
  .frow:hover{background:var(--bg2)}
  .fr-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .fr-name{font-family:var(--disp);font-weight:600;font-size:19px;letter-spacing:-.2px}
  .fr-tk{font-family:var(--mono);font-size:10.5px;color:var(--faint);letter-spacing:.05em}
  .stword{font-size:12px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
  .stword .d{width:6px;height:6px;border-radius:50%;background:currentColor;flex:0 0 auto}
  .frow p{color:var(--mut);font-size:13.5px;line-height:1.55;margin:6px 0 0;max-width:56ch}
  .fr-src{margin-top:7px;font-size:11px;color:var(--faint);font-family:var(--mono)}
  .dblock{text-align:right;min-width:190px}
  .dblock .price{font-family:var(--mono);font-size:15px}
  .dblock .price .chg{font-size:12px;margin-left:8px}
  .dblock .sp{margin:6px 0 5px;color:var(--faint)}
  .dblock .micro{font-family:var(--mono);font-size:10.5px;color:var(--faint);letter-spacing:.02em}
  .dblock .micro b{color:var(--mut);font-weight:500}
  .frow.smallr .fr-name{font-size:15.5px;font-weight:500}
  .frow.smallr p{margin-top:3px;font-size:12.5px}
  .frow.smallr .dblock .price{font-size:13px}
  .endrow{padding:13px 4px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--faint);display:flex;gap:10px;align-items:baseline;line-height:1.6}
  .endrow .el{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;flex:0 0 92px;padding-top:2px}
  .endrow .ev b{color:var(--mut);font-weight:500}
  .endrow .ev i{font-style:normal;color:var(--mut)}

  /* ===== stock page ===== */
  .back{background:none;border:none;color:var(--mut);font-size:13px;margin-bottom:14px;display:flex;align-items:center;gap:7px;padding:0}
  .back:hover{color:var(--ink)}
  .shead{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-bottom:10px}
  .shead h1{font-family:var(--disp);font-weight:600;font-size:29px;margin:0;letter-spacing:-.4px}
  .factbar{display:flex;flex-wrap:wrap;gap:6px 0;align-items:baseline;font-family:var(--mono);font-size:12.5px;color:var(--mut);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 2px;margin-bottom:14px}
  .factbar .f{display:inline-flex;gap:7px;align-items:baseline}
  .factbar .k{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
  .factbar .v{color:var(--ink)}
  .factbar .sep{margin:0 14px;color:var(--line2)}
  .whyline{color:var(--mut);font-size:13.5px;margin:0 0 16px;border-left:2px solid var(--gold-d);padding-left:12px;line-height:1.5}
  .whyline b{color:var(--faint);font-weight:500;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:3px}
  /* single-page: sticky anchor bar + sections */
  .anchbar{position:sticky;top:0;z-index:20;background:var(--bgt);backdrop-filter:blur(8px);display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin:0 0 4px;padding:6px 0}
  .thbtn{width:100%;background:none;border:1px solid var(--line2);border-radius:9px;color:var(--mut);padding:8px;font-size:12px;margin-bottom:9px;transition:.14s}
  .thbtn:hover{border-color:var(--gold);color:var(--ink)}
  .anch{background:none;border:none;color:var(--mut);padding:8px 12px;font-size:12.5px;border-radius:8px;white-space:nowrap;transition:.14s}
  .anch:hover{color:var(--ink)}
  .anch.on{color:var(--ink);background:var(--card2)}
  section.sec{scroll-margin-top:58px;padding:24px 0 10px;border-top:1px solid var(--line);margin-top:16px}
  section.sec:first-of-type{border-top:none;margin-top:0;padding-top:10px}
  .sech{display:flex;align-items:baseline;gap:11px;margin:0 0 14px}
  .sech h2{font-family:var(--disp);font-weight:600;font-size:19px;margin:0;letter-spacing:-.2px}
  .sech .sm{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
  .duo{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  @media(max-width:680px){.duo{grid-template-columns:1fr}}
  .kv{font-family:var(--mono);font-size:24px;margin-top:2px}
  .ownnote{font-size:12px;color:var(--mut);margin-top:9px;line-height:1.55}

  /* two-lane: prose + data rail */
  .lane{display:grid;grid-template-columns:1fr 264px;gap:24px;align-items:start}
  @media(max-width:820px){.lane{grid-template-columns:1fr}}
  .prose .lab{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-bottom:11px}
  .prose p{margin:0 0 11px;font-size:14.5px;line-height:1.62}
  .tag{display:inline-block;font-size:10px;font-family:var(--mono);letter-spacing:.05em;border-radius:5px;padding:2px 7px;margin-right:7px;text-transform:uppercase}
  .tag.fakta{background:var(--pos-soft);color:var(--pos)}.tag.slutsats{background:var(--gold-soft);color:var(--gold)}
  .cit{font-family:var(--mono);font-size:9.5px;color:var(--gold);background:var(--gold-soft);border-radius:4px;padding:1px 5px;vertical-align:super;cursor:pointer;margin-left:2px}
  .rail{display:flex;flex-direction:column;gap:9px}
  .rail .rlab{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:-2px}
  .chip{border:1px solid var(--line);border-radius:10px;padding:10px 13px;background:var(--card)}
  .chip .ck{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
  .chip .cv{display:flex;align-items:baseline;gap:9px;margin-top:3px}
  .chip .cv .v{font-family:var(--mono);font-size:17px}
  .chip .cv .dd{font-family:var(--mono);font-size:11.5px}
  .chip .cc{font-size:11px;color:var(--mut);margin-top:2px}

  /* tables */
  .tscroll{overflow-x:auto}
  table.dt{width:100%;border-collapse:collapse;font-size:12.5px}
  table.dt th{text-align:right;color:var(--faint);font-weight:500;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;padding:0 0 9px 14px;white-space:nowrap}
  table.dt th:first-child{text-align:left;padding-left:0}
  table.dt td{padding:9px 0 9px 14px;border-top:1px solid var(--line);font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
  table.dt td:first-child{text-align:left;font-family:var(--sans);color:var(--ink);padding-left:0}
  table.dt tr:hover td{background:var(--bg2)}
  table.dt td .u{color:var(--faint);font-size:10px;margin-left:3px}
  .sparkcell{color:var(--faint)}
  .note{font-size:11px;color:var(--faint);margin:8px 2px 0;font-family:var(--mono)}

  /* verdict + minis + quotes */
  .verdict{font-family:var(--disp);font-size:17.5px;line-height:1.45;margin:0 0 4px}
  .vlab{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-bottom:9px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0}
  @media(max-width:640px){.cols{grid-template-columns:1fr}}
  .mini h4{margin:0 0 9px;font-size:10.5px;font-family:var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--mut)}
  .mini.good h4{color:var(--pos)}.mini.bad h4{color:var(--neg)}
  .mini ul{margin:0;padding:0;list-style:none}
  .mini li{font-size:13px;line-height:1.5;margin-bottom:7px;padding-left:15px;position:relative}
  .mini li::before{content:'';position:absolute;left:0;top:8px;width:4px;height:4px;border-radius:50%;background:var(--line2)}
  .mini.good li::before{background:var(--pos)}.mini.bad li::before{background:var(--neg)}
  .quote{border-left:2px solid var(--gold-d);padding:3px 0 3px 15px;margin:12px 0;font-size:14.5px;line-height:1.55;font-family:var(--disp);font-style:italic}
  .quote .who{display:block;font-size:10.5px;color:var(--faint);font-family:var(--mono);font-style:normal;margin-top:5px}

  /* pillar cards with threshold charts */
  .pcard{border:1px solid var(--line);border-radius:12px;padding:15px 17px 13px;margin-bottom:11px;background:var(--card)}
  .pcard.rr{border-color:var(--neg-d)}
  .pcard .ph{display:flex;align-items:baseline;gap:11px;flex-wrap:wrap}
  .pcard .pt{font-family:var(--disp);font-weight:500;font-size:15px}
  .pcard .pv{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--mut)}
  .pchart{margin:10px 0 4px;position:relative}
  .pchart svg{display:block;width:100%;height:58px}
  .pmeta{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9.5px;color:var(--faint);letter-spacing:.03em}
  .pev{font-size:12px;color:var(--mut);margin-top:7px;line-height:1.5}
  .tnote{background:var(--neg-soft);border:1px solid var(--neg-d);border-radius:11px;padding:13px 15px;font-size:13px;color:#f3c8c2;margin-bottom:15px;line-height:1.55}
  .tnote b{color:#fff}

  /* chat */
  .chat{display:flex;flex-direction:column;gap:13px;margin-bottom:16px}
  .bub{max-width:92%;padding:13px 16px;border-radius:14px;font-size:14px;line-height:1.6}
  .bub.u{align-self:flex-end;background:var(--gold);color:#15171a;font-weight:500}
  .bub.a{align-self:flex-start;background:var(--card);border:1px solid var(--line)}
  .bub.a table.dt{margin-top:10px;font-size:11.5px}
  .bub.a table.dt td{padding:6px 0 6px 12px}
  .seed{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .seedb{background:var(--card);border:1px solid var(--line2);border-radius:99px;padding:8px 13px;font-size:12.5px;color:var(--mut);transition:.14s}
  .seedb:hover{border-color:var(--gold);color:var(--ink)}
  .askbar{display:flex;gap:9px;position:sticky;bottom:14px}
  .askbar input{flex:1;background:var(--card2);border:1px solid var(--line2);border-radius:12px;color:var(--ink);padding:12px 15px;font-size:14px;outline:none;font-family:var(--sans)}
  .askbar input:focus{border-color:var(--gold)}
  .askbar button{background:var(--gold);border:none;color:#15171a;border-radius:12px;padding:0 18px;font-weight:600}

  /* ===== sidofält: lägg till + från Marginalen ===== */
  .addbtn{background:none;border:1px dashed var(--line2);border-radius:9px;color:var(--mut);text-align:left;padding:10px 11px;font-size:13.5px;display:flex;align-items:center;gap:10px;margin-top:6px;transition:.14s}
  .addbtn:hover{border-color:var(--gold);color:var(--ink)}
  .fm{border-top:1px solid var(--line);margin:12px 6px 0;padding:11px 4px 2px}
  .fm .fmt{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
  .fm a{display:block;color:var(--mut);text-decoration:none;font-size:12.5px;padding:4px 2px;border-radius:6px}
  .fm a:hover{color:var(--ink)}

  /* ===== Ägarbrevet ===== */
  .brev{border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden;max-width:640px}
  .brev .bh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
  .brev .bh .bt{font-family:var(--disp);font-weight:600;font-size:18px}
  .brev .bh .bd{font-family:var(--mono);font-size:10px;color:var(--faint);letter-spacing:.08em;text-transform:uppercase}
  .bsec{padding:15px 20px 6px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
  .bitem{padding:9px 20px 12px}
  .bitem+.bitem{border-top:1px solid var(--line)}
  .bitem.click{cursor:pointer;transition:background .14s}
  .bitem.click:hover{background:var(--bg2)}
  .bitem h4{font-family:var(--disp);font-size:15px;font-weight:500;margin:0 0 4px}
  .bitem h4 .st{font-family:var(--sans);font-size:11.5px;font-weight:400;margin-left:8px}
  .bitem p{font-size:12.5px;color:var(--mut);margin:0;line-height:1.55}
  .bitem .fd{font-size:11.5px;color:var(--mut);margin-top:5px}
  .bitem .fd b{color:var(--gold);font-weight:500;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;margin-right:6px}
  .pw{padding:12px 20px;background:var(--bg2);font-family:var(--mono);font-size:11px;color:var(--faint);border-top:1px solid var(--line);line-height:1.6}
  .pw b{color:var(--mut);font-weight:500}

  /* ===== Förklara-läget: klickbara termer + panel ===== */
  .term{border-bottom:1px dashed var(--gold-d);cursor:help}
  .term:hover{border-bottom-style:solid}
  .tpop{position:fixed;right:22px;bottom:22px;width:min(370px,calc(100vw - 44px));background:var(--card);border:1px solid var(--gold-d);border-radius:14px;padding:16px 18px 14px;z-index:80;box-shadow:0 18px 50px rgba(0,0,0,.3);display:none}
  .tpop.show{display:block}
  .tpop .tk2{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:5px}
  .tpop .tt{font-family:var(--disp);font-weight:600;font-size:16.5px;margin:0 0 6px;padding-right:22px}
  .tpop p{font-size:13px;color:var(--mut);line-height:1.55;margin:0 0 11px}
  .tpop .tl{display:flex;gap:14px;font-size:12px;flex-wrap:wrap}
  .tpop .tl a{color:var(--gold);text-decoration:none}
  .tpop .tl a:hover{text-decoration:underline}
  .tpop .tx{position:absolute;top:9px;right:11px;background:none;border:none;color:var(--faint);font-size:15px;padding:4px}
  .tpop .tx:hover{color:var(--ink)}

  /* ===== onboarding (Lägg till bolag) ===== */
  .obwrap{max-width:600px}
  .prog{display:flex;gap:6px;margin:2px 0 26px}
  .prog i{height:3px;flex:1;border-radius:2px;background:var(--line2);transition:background .3s}
  .prog i.on{background:var(--gold)}
  .chips2{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .chip2{background:var(--card);border:1px solid var(--line2);border-radius:99px;padding:9px 15px;font-size:13.5px;color:var(--mut);transition:.14s;cursor:pointer}
  .chip2:hover{color:var(--ink)}
  .chip2.sel{border-color:var(--gold);color:var(--ink);background:var(--gold-soft)}
  .sent{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;font-family:var(--disp);font-size:18px;line-height:1.75;margin-bottom:14px}
  .sent .co{color:var(--gold);font-weight:600}
  .sent input{background:none;border:none;border-bottom:1.5px solid var(--gold-d);color:var(--ink);font-family:var(--disp);font-size:18px;outline:none;min-width:120px;padding:0 2px 2px}
  .sent input:focus{border-bottom-color:var(--gold)}
  .course{display:flex;align-items:center;gap:13px;background:var(--gold-soft);border:1px solid var(--gold-d);border-radius:13px;padding:13px 15px;text-decoration:none;color:inherit;margin-bottom:10px;transition:.15s}
  .course:hover{border-color:var(--gold)}
  .course .ct b{font-size:13.5px;font-weight:600;display:block;color:var(--ink)}
  .course .ct span{font-size:12px;color:var(--mut)}

/* ============ chart helpers ============ */
function spark(pts,w=72,h=20,color){
  const mn=Math.min(...pts),mx=Math.max(...pts),r=mx-mn||1;
  const xs=pts.map((p,i)=>[(i/(pts.length-1))*(w-4)+2, h-3-((p-mn)/r)*(h-7)]);
  const path=xs.map(p=>p.map(n=>n.toFixed(1)).join(',')).join(' ');
  const last=xs[xs.length-1];
  const c=color||C().neu;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${path}" fill="none" stroke="${c}" stroke-width="1.4"/><circle cx="${last[0]}" cy="${last[1]}" r="2" fill="${c}"/></svg>`;
}
function pillChart(pts,larm,status){
  const W=560,H=58,P=6;
  const all=larm==null?pts:[...pts,larm];
  const mn=Math.min(...all),mx=Math.max(...all),pad=(mx-mn||1)*0.18,lo=mn-pad,hi=mx+pad,r=hi-lo;
  const y=v=>H-P-((v-lo)/r)*(H-2*P);
  const xs=pts.map((p,i)=>[(i/(pts.length-1))*(W-14)+7,y(p)]);
  const path=xs.map(p=>p.map(n=>n.toFixed(1)).join(',')).join(' ');
  const last=xs[xs.length-1];
  const col=status==='r'?C().neg:status==='y'?C().gold:C().pos;
  const larmLine=larm==null?'':`<line x1="7" x2="${W-7}" y1="${y(larm).toFixed(1)}" y2="${y(larm).toFixed(1)}" stroke="${C().larm}" stroke-width="1" stroke-dasharray="4 4"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${larmLine}<polyline points="${path}" fill="none" stroke="${col}" stroke-width="1.8"/><circle cx="${last[0]}" cy="${last[1]}" r="3" fill="${col}"/></svg>`;
}

function jumpTo(id){const el=document.getElementById('sec-'+id);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});}
function wireAnchors(){
  const bar=document.getElementById('anchbar');if(!bar)return;
  const obs=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){const id=e.target.id.replace('sec-','');
    bar.querySelectorAll('.anch').forEach(a=>a.classList.toggle('on',a.dataset.a===id));}})},{rootMargin:'-15% 0px -70% 0px'});
  document.querySelectorAll('section.sec').forEach(sc=>obs.observe(sc));
}

/* ============ Förklara-läget: vad menas med det här? ============ */
const TERMS={
 'organisk tillväxt':{t:'Organisk tillväxt',d:'Hur mycket försäljningen växer av egen kraft, utan förvärv. Visar om själva verksamheten drar eller om bolaget bara köper sig större.'},
 'fritt kassaflöde':{t:'Fritt kassaflöde',d:'Pengarna som blir kvar när alla utgifter och investeringar är betalda. Det som kan bli utdelning, återköp eller nästa förvärv.'},
 'bruttomarginal':{t:'Bruttomarginal',d:'Hur många kronor av varje hundralapp i försäljning som blir kvar efter direkta kostnader. Faller den tjänar bolaget mindre på varje såld krona.'},
 'rörelsemarginal':{t:'Rörelsemarginal (EBIT)',d:'Andelen av försäljningen som blir vinst från själva verksamheten, före räntor och skatt.'},
 'konsensus':{t:'Konsensus',d:'Snittet av vad analytikerna räknade med. Att slå konsensus betyder att det gick bättre än väntat.'},
 'guidning':{t:'Guidning',d:'Bolagets egen prognos om framtiden. En höjd guidning är ofta en större nyhet än själva kvartalet.'},
 'P/E':{t:'P/E-tal',d:'Aktiens pris delat med vinsten per aktie. Ungefär: hur många år av dagens vinst du betalar för bolaget.'},
 'blankning':{t:'Blankning',d:'Att låna aktier och sälja dem i hopp om att köpa tillbaka billigare. Hög och stigande blankning betyder att fler satsar på nedgång.'},
 'direktavkastning':{t:'Direktavkastning',d:'Utdelningen delat med aktiekursen, i procent per år.'},
 'goodwill':{t:'Goodwill',d:'Skillnaden mellan vad ett bolag betalade för ett köp och vad det köpta bolagets tillgångar var värda på pappret. Kvittot på förvärvens prislapp.'},
 'insynsköp':{t:'Insynsköp',d:'När vd, styrelse eller ledning köper aktier i sitt eget bolag. Måste anmälas till Finansinspektionen och blir offentligt.'},
 'utspädning':{t:'Utspädning',d:'När bolaget ger ut nya aktier och din andel av bolaget blir mindre.'}
};
const TERMKEYS=Object.keys(TERMS).sort((a,b)=>b.length-a.length);
function termify(root){
  if(!root)return;
  root.querySelectorAll('.prose p,.verdict,.pev,.ownnote,.bitem p,.frow p,.cc,.bub.a').forEach(el=>{
    if(el.dataset.tf)return; el.dataset.tf='1';
    let h=el.innerHTML;
    for(const k of TERMKEYS){
      const re=new RegExp('('+k.replace(/[.*+?^${}()|[\]\\\/]/g,'\\$&')+')(?![^<]*>)(?![^<]*<\\/span>)','i');
      if(re.test(h)){h=h.replace(re,'<span class="term" data-t="'+k+'">$1</span>');}
    }
    el.innerHTML=h;
  });
}
function openTerm(k){
  const t=TERMS[k];if(!t)return;
  const p=document.getElementById('tpop');
  p.innerHTML=`<button class="tx" onclick="document.getElementById('tpop').classList.remove('show')">${svgi('x')}</button>
    <div class="tk2">Vad menas med det här?</div>
    <div class="tt">${t.t}</div><p>${t.d}</p>
    <div class="tl"><a href="/ordlista">Hela ordlistan →</a><a href="/fokus">Lektionen i Marginalen (3 min) →</a></div>`;
  p.classList.add('show');
}
document.addEventListener('click',e=>{
  const term=e.target.closest('.term');
  if(term){e.stopPropagation();openTerm(term.dataset.t);return;}
  if(!e.target.closest('.tpop'))document.getElementById('tpop').classList.remove('show');
},true);
