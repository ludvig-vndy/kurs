<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ägarkollen · Livsgången</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#17130F; --bg2:#1C1712; --card:#211B15; --card2:#282017;
    --line:#33291F; --line2:#463A2B;
    --ink:#EDE7DB; --mut:#A69C8B; --faint:#6E6454;
    --ox:#C96B5E; --ox-soft:#342019; --ox-ink:#1C0F0B;
    --gold:#D9A84E; --gold-soft:#2E2617; --gold-d:#8A6E33;
    --pos:#6FB893; --pos-soft:#1B2721;
    --neg:#DD7A6C; --neg-soft:#2E1D18; --neg-d:#6E3A30;
    --disp:'Outfit',system-ui,sans-serif; --sans:'Inter',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
  }
  html[data-theme="light"]{
    --bg:#F7F4EC; --bg2:#F1ECE0; --card:#FCFAF4; --card2:#F3EEE2;
    --line:#E4DDCC; --line2:#CFC6B0;
    --ink:#211C17; --mut:#5C544A; --faint:#8A8172;
    --ox:#8A2E26; --ox-soft:#F3E3DD; --ox-ink:#FBF7EE;
    --gold:#9A6E1C; --gold-soft:#F1E8D1; --gold-d:#C4A867;
    --pos:#2E6B4C; --pos-soft:#E3EEE5;
    --neg:#A8382E; --neg-soft:#F6E4E0; --neg-d:#D8A89E;
  }
  html[data-theme="light"] .narr{background:linear-gradient(140deg,#FCFAF4,#F1ECE0)}
  html[data-theme="light"] .tnote{color:#7A2E28}
  html[data-theme="light"] .tnote b{color:#5C1F1A}

  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.55}
  .mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
  button{font-family:inherit;cursor:pointer}
  ::selection{background:var(--ox-soft)}
  .pos{color:var(--pos)}.neg{color:var(--neg)}.gold{color:var(--gold)}.mutc{color:var(--mut)}.faintc{color:var(--faint)}

  .top{display:flex;align-items:center;gap:10px;justify-content:center;padding:20px;font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
  .top .mark{width:20px;height:20px;border-radius:6px;background:var(--ox);display:grid;place-items:center}
  .top .mark svg{width:12px;height:12px;stroke:var(--ox-ink);stroke-width:2.2;fill:none}
  .mock{font-size:9px;border:1px solid var(--line2);border-radius:6px;padding:3px 7px;margin-left:8px;letter-spacing:.05em}
  .thb{margin-left:10px;background:none;border:1px solid var(--line2);border-radius:6px;color:var(--mut);font-size:9.5px;padding:4px 9px;letter-spacing:.05em;cursor:pointer}
  .thb:hover{color:var(--ink);border-color:var(--ox)}

  .wrap{max-width:860px;margin:0 auto;padding:0 22px 100px}

  /* journey timeline */
  .tl{display:flex;gap:0;margin:6px 0 34px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg2)}
  .tl button{flex:1;background:none;border:none;border-right:1px solid var(--line);padding:11px 6px;color:var(--faint);transition:.14s}
  .tl button:last-child{border-right:none}
  .tl button:hover{color:var(--ink);background:var(--card)}
  .tl button.on{background:var(--card2);color:var(--ink)}
  .tl .d{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
  .tl button.on .d{color:var(--ox)}
  .tl .t{display:block;font-size:11px;margin-top:3px}
  .tl button.done .d{color:var(--pos)}

  /* narrator */
  .narr{border:1px solid var(--line2);background:linear-gradient(140deg,#211B15,#1C1712);border-radius:16px;padding:24px 26px;margin-bottom:26px}
  .narr .step{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ox);margin-bottom:10px}
  .narr h1{font-family:var(--disp);font-weight:600;font-size:28px;line-height:1.14;letter-spacing:-.4px;margin:0 0 10px}
  .narr p{color:var(--mut);font-size:14.5px;line-height:1.62;margin:0}
  .narr p b{color:var(--ink);font-weight:500}

  .demo-label{display:flex;align-items:center;gap:10px;margin:0 2px 10px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
  .demo-label::after{content:'';flex:1;height:1px;background:var(--line)}
  .demo{border:1px solid var(--line);border-radius:16px;padding:22px 24px;background:var(--bg)}

  .nextbar{display:flex;gap:11px;margin-top:26px;flex-wrap:wrap}
  .btn{border-radius:13px;padding:15px 24px;font-size:14.5px;border:1px solid var(--line2);background:var(--card2);color:var(--ink);transition:.15s;display:inline-flex;align-items:center;gap:9px;text-decoration:none}
  .btn:hover{border-color:var(--ox)}
  .btn.prim{background:var(--ox);border-color:var(--ox);color:var(--ox-ink);font-weight:600;flex:1;justify-content:center;font-size:15px}
  .btn.prim:hover{filter:brightness(1.1)}
  .btn.ghost{color:var(--mut)}

  /* map (intro) */
  .map{display:flex;flex-direction:column;gap:0;border-left:2px solid var(--line2);margin:6px 0 6px 8px;padding-left:0}
  .stop{position:relative;padding:0 0 26px 26px}
  .stop:last-child{padding-bottom:2px}
  .stop::before{content:'';position:absolute;left:-7px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--ox)}
  .stop .sd{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ox)}
  .stop h3{font-family:var(--disp);font-weight:500;font-size:17px;margin:4px 0 4px}
  .stop p{color:var(--mut);font-size:13.5px;line-height:1.55;margin:0;max-width:58ch}
  .jobb{margin-top:22px;border-top:1px solid var(--line);padding-top:16px;font-size:13.5px;color:var(--mut);line-height:1.6}
  .jobb b{color:var(--ink);font-weight:500}
  .eco{margin-top:24px;border:1px solid var(--line);border-radius:14px;background:var(--bg2);overflow:hidden}
  .eco .ecl{padding:13px 17px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ox)}
  .eco .er{display:flex;gap:12px;padding:12px 17px;border-bottom:1px solid var(--line);font-size:13px;align-items:baseline}
  .eco .er:last-of-type{border-bottom:none}
  .eco .er b{color:var(--ink);font-weight:500;font-family:var(--disp);font-size:14px;flex:0 0 auto}
  .eco .er span{color:var(--mut)}
  .eco .ef{padding:10px 17px;font-size:11.5px;color:var(--faint);border-top:1px solid var(--line)}

  /* morgonbrevet */
  .brev{border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden;max-width:620px}
  .brev .bh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
  .brev .bh .bt{font-family:var(--disp);font-weight:600;font-size:18px}
  .brev .bh .bd{font-family:var(--mono);font-size:10px;color:var(--faint);letter-spacing:.08em;text-transform:uppercase}
  .bsec{padding:15px 20px 6px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
  .bitem{padding:9px 20px 12px}
  .bitem+.bitem{border-top:1px solid var(--line)}
  .bitem h4{font-family:var(--disp);font-size:15px;font-weight:500;margin:0 0 4px}
  .bitem h4 .st{font-family:var(--sans);font-size:11.5px;font-weight:400;margin-left:8px}
  .bitem p{font-size:12.5px;color:var(--mut);margin:0;line-height:1.55}
  .bitem .fd{font-size:11.5px;color:var(--mut);margin-top:5px}
  .bitem .fd b{color:var(--gold);font-weight:500;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;margin-right:6px}
  .pw{padding:12px 20px;background:var(--bg2);font-family:var(--mono);font-size:11px;color:var(--faint);border-top:1px solid var(--line);line-height:1.6}
  .pw b{color:var(--mut);font-weight:500}

  /* reused product components (from v2) */
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
  h2.big{font-family:var(--disp);font-weight:600;font-size:26px;margin:6px 0 3px;letter-spacing:-.4px}
  .sub{color:var(--mut);font-size:13.5px;margin-bottom:16px}
  .front{border-top:1px solid var(--line2)}
  .frow{display:grid;grid-template-columns:1fr auto;gap:8px 24px;padding:15px 2px;border-bottom:1px solid var(--line);align-items:start}
  .fr-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .fr-name{font-family:var(--disp);font-weight:600;font-size:18px}
  .fr-tk{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
  .stword{font-size:12px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
  .stword .d{width:6px;height:6px;border-radius:50%;background:currentColor}
  .frow p{color:var(--mut);font-size:13px;line-height:1.55;margin:5px 0 0;max-width:52ch}
  .dblock{text-align:right;min-width:170px}
  .dblock .price{font-family:var(--mono);font-size:14px}
  .dblock .price .chg{font-size:11.5px;margin-left:7px}
  .dblock .sp{margin:5px 0 4px;color:var(--faint)}
  .dblock .micro{font-family:var(--mono);font-size:10px;color:var(--faint)}
  .dblock .micro b{color:var(--mut);font-weight:500}
  .endrow{padding:12px 2px;border-bottom:1px solid var(--line);font-size:12px;color:var(--faint);display:flex;gap:10px;align-items:baseline}
  .endrow .el{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;flex:0 0 88px;padding-top:2px}
  .endrow .ev b{color:var(--mut);font-weight:500}
  .hl{outline:2px solid var(--neg-d);outline-offset:-2px;border-radius:10px;background:var(--neg-soft)}

  .sent{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;font-family:var(--disp);font-size:17px;line-height:1.7;margin-bottom:12px}
  .sent .co{color:var(--gold);font-weight:600}
  .sent .fill{border-bottom:1.5px solid var(--gold-d);padding:0 2px}

  .pcard{border:1px solid var(--line);border-radius:12px;padding:14px 16px 12px;margin-bottom:10px;background:var(--card)}
  .pcard.rr{border-color:var(--neg-d)}
  .pcard .ph{display:flex;align-items:baseline;gap:11px;flex-wrap:wrap}
  .pcard .pt{font-family:var(--disp);font-weight:500;font-size:14.5px}
  .pcard .pv{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--mut)}
  .pchart svg{display:block;width:100%;height:54px;margin:9px 0 3px}
  .pmeta{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;color:var(--faint)}
  .pev{font-size:11.5px;color:var(--mut);margin-top:6px;line-height:1.5}
  .tnote{background:var(--neg-soft);border:1px solid var(--neg-d);border-radius:11px;padding:12px 15px;font-size:12.5px;color:#f3c8c2;margin:12px 0 0;line-height:1.55}
  .tnote b{color:#fff}

  .verdict{font-family:var(--disp);font-size:16.5px;line-height:1.45;margin:0 0 4px}
  .vlab{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
  .tscroll{overflow-x:auto}
  table.dt{width:100%;border-collapse:collapse;font-size:12px}
  table.dt th{text-align:right;color:var(--faint);font-weight:500;font-size:9px;letter-spacing:.06em;text-transform:uppercase;padding:0 0 8px 12px;white-space:nowrap}
  table.dt th:first-child{text-align:left;padding-left:0}
  table.dt td{padding:8px 0 8px 12px;border-top:1px solid var(--line);font-family:var(--mono);text-align:right;white-space:nowrap}
  table.dt td:first-child{text-align:left;font-family:var(--sans);color:var(--ink);padding-left:0}
  .slabel{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:18px 0 10px;display:flex;gap:10px;align-items:center}
  .slabel::after{content:'';flex:1;height:1px;background:var(--line)}

  /* stats (day 90) */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:6px}
  @media(max-width:640px){.stats{grid-template-columns:1fr 1fr}}
  .stat{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--card);text-align:center}
  .stat .v{font-family:var(--mono);font-size:24px}
  .stat .k{font-size:11px;color:var(--mut);margin-top:5px;line-height:1.4}
  .ledger{border:1px solid var(--line);border-radius:12px;background:var(--bg2);margin-top:12px;overflow:hidden}
  .lrow{display:flex;gap:12px;padding:11px 15px;border-bottom:1px solid var(--line);font-size:12.5px;align-items:baseline}
  .lrow:last-child{border-bottom:none}
  .lrow .ld{font-family:var(--mono);font-size:10px;color:var(--gold);flex:0 0 54px;letter-spacing:.05em}
  .lrow .lt{color:var(--mut)}.lrow .lt b{color:var(--ink);font-weight:500}

  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  .fade{animation:f .25s ease}@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="top"><span class="mark" id="mk"></span> Marginalen · Ägarkollen · Livsgången <span class="mock">DEMO · EXEMPELDATA</span> <button class="thb" id="thbtn"></button></div>
<div class="wrap">
  <div class="tl" id="tl"></div>
  <div id="body"></div>
</div>

<script>
document.getElementById('mk').innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="#15171a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>';

/* theme */
const PAL={dark:{pos:'#5FB89A',neg:'#E0726F',gold:'#E0A43B',neu:'#646B76',larm:'#7E5E22'},
           light:{pos:'#1E7A5C',neg:'#C04A42',gold:'#B07A1E',neu:'#9AA0A8',larm:'#C9A45C'}};
let curTheme=localStorage.getItem('agarai-theme')||'light';
function C(){return PAL[curTheme];}
function applyTheme(){document.documentElement.dataset.theme=curTheme;
  const b=document.getElementById('thbtn');if(b)b.textContent=curTheme==='light'?'Mörkt tema':'Ljust tema';}

/* charts */
function spark(pts,w=100,h=22,c){ c=c||C().neu;
  const mn=Math.min(...pts),mx=Math.max(...pts),r=mx-mn||1;
  const xs=pts.map((p,i)=>[(i/(pts.length-1))*(w-4)+2,h-3-((p-mn)/r)*(h-7)]);
  const path=xs.map(p=>p.map(n=>n.toFixed(1)).join(',')).join(' ');const l=xs[xs.length-1];
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${path}" fill="none" stroke="${c}" stroke-width="1.4"/><circle cx="${l[0]}" cy="${l[1]}" r="2" fill="${c}"/></svg>`;}
function pillChart(pts,larm,status){
  const W=560,H=54,P=6;const all=larm==null?pts:[...pts,larm];
  const mn=Math.min(...all),mx=Math.max(...all),pad=(mx-mn||1)*0.18,lo=mn-pad,hi=mx+pad,r=hi-lo;
  const y=v=>H-P-((v-lo)/r)*(H-2*P);
  const xs=pts.map((p,i)=>[(i/(pts.length-1))*(W-14)+7,y(p)]);
  const path=xs.map(p=>p.map(n=>n.toFixed(1)).join(',')).join(' ');const l=xs[xs.length-1];
  const col=status==='r'?C().neg:status==='y'?C().gold:C().pos;
  const ll=larm==null?'':`<line x1="7" x2="${W-7}" y1="${y(larm).toFixed(1)}" y2="${y(larm).toFixed(1)}" stroke="${C().larm}" stroke-width="1" stroke-dasharray="4 4"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${ll}<polyline points="${path}" fill="none" stroke="${col}" stroke-width="1.8"/><circle cx="${l[0]}" cy="${l[1]}" r="3" fill="${col}"/></svg>`;}
function fmtChg(v){const s=v>0?'+':'';const c=v>0?'pos':v<0?'neg':'mutc';return `<span class="${c}">${s}${v.toFixed(1).replace('.',',')}%</span>`;}

/* steps */
const STEPS=[
 {d:'Överblick',t:'Kartan'},
 {d:'Dag 0',t:'Du berättar varför'},
 {d:'Dag 1',t:'Morgonbrevet'},
 {d:'Dag 12',t:'Vi säger till'},
 {d:'Dag 47',t:'Rapportdagen'},
 {d:'Dag 90',t:'Backspegeln'}
];
let step=0;
const tl=document.getElementById('tl'),body=document.getElementById('body');
function go(n){step=Math.max(0,Math.min(STEPS.length-1,n));render();window.scrollTo(0,0);}
function render(){
  tl.innerHTML=STEPS.map((s,i)=>`<button class="${i===step?'on':i<step?'done':''}" onclick="go(${i})"><span class="d">${s.d}</span><span class="t">${s.t}</span></button>`).join('');
  body.className='fade';
  [ch0,ch1,ch2,ch3,ch4,ch5][step]();
}

/* ch0: map */
function ch0(){body.innerHTML=`
  <div class="narr">
    <div class="step">Demo · Livsgången · Överblick</div>
    <h1>Så fungerar tjänsten</h1>
    <p>Du berättar en gång <b>varför du äger dina aktier</b>. Sen jobbar tjänsten åt dig: den läser rapporter, pressmeddelanden och register, och säger till när något viktigt händer i just dina bolag. Du läser ett kort brev varje morgon, det tar två minuter. <b>Det här är en demo</b> av de första 90 dagarna, precis som de skulle kännas i produkten. All data är påhittad exempeldata.</p>
  </div>
  <div class="map">
    <div class="stop"><div class="sd">Dag 0 · en gång · ~10 min</div><h3>Du berättar varför du äger dina aktier</h3><p>Lägg in ett bolag, berätta varför du äger det och sätt dina gränser. Mer än så behöver du aldrig göra, och det är enda gången produkten ber dig om något.</p></div>
    <div class="stop"><div class="sd">Dag 1 och framåt · 07:30 · 90 sekunder</div><h3>Morgonbrevet</h3><p>Två delar: dina bolag, och det allmänna som är värt att veta idag, alltid översatt till vad det betyder för just dig. De flesta dagar är svaret: inget viktigt har hänt. Då vet du det, och är klar.</p></div>
    <div class="stop"><div class="sd">Några gånger per år</div><h3>Vi säger till när något händer</h3><p>En kurva går under din gräns. Då, och först då, hör vi av oss. Du ser exakt vad som ändrats, med siffror och källa.</p></div>
    <div class="stop"><div class="sd">Varje kvartal · automatiskt</div><h3>Rapporten analyseras åt dig</h3><p>Bolaget släpper sin rapport 07:30. En minut senare ligger analysen klar: mot vad marknaden väntade sig, mot i fjol och mot ditt skäl. Varje siffra kommer ur rapporten, ingen är påhittad.</p></div>
    <div class="stop"><div class="sd">Dag 90 · kvartalsvis</div><h3>Backspegeln</h3><p>Hur mycket tid kostade kvartalet dig? Nästan ingen alls. Och allt vi sagt ligger kvar, öppet att granska. Sen börjar det om.</p></div>
  </div>
  <div class="jobb"><b>Så här enkelt är det:</b> berätta varför du äger dina aktier (en gång). Läs morgonbrevet (två minuter). Får du ett larm tittar du efter vad som hänt och bestämmer själv vad du vill göra. Resten sköter vi.</div>
  <div class="eco">
    <div class="ecl">Demon visar själva bevakningstjänsten. I paketet finns också:</div>
    <div class="er"><b>Kursen i aktieanalys</b><span>Marginalen: kursen som lär dig tänka som en ägare, inte en spekulant.</span></div>
    <div class="er"><b>Analysverktygen</b><span>checklistor och verktyg från kursen, för när du vill göra jobbet själv.</span></div>
    <div class="er"><b>Warrant-verktyget</b><span>"Hitta bästa hävstångsprodukten": ett eget verktyg för den som handlar med hävstång.</span></div>
    <div class="ef">Demon nedan visar bara bevakningstjänsten.</div>
  </div>
  <div class="nextbar"><button class="btn prim" onclick="go(1)">Starta resan: Dag 0, du säger varför →</button></div>`;}

/* ch1: day 0 */
function ch1(){body.innerHTML=`
  <div class="narr">
    <div class="step">Steg 1 av 5 · Dag 0 · cirka 10 minuter, en gång</div>
    <h1>Du säger varför du äger</h1>
    <p>Du lägger in <b>Norlux Industri</b> och svarar på en enda fråga: varför äger du det? Sen gör vi om svaret till tre konkreta saker att hålla koll på, med en gräns för varje som <b>du</b> själv sätter. Mer jobb än så här blir det aldrig. Härifrån är det vi som jobbar, inte du.</p>
  </div>

function pc(n,s,now,pts,larm,larmLab,ev){
  return `<div class="pcard ${s==='r'?'rr':''}"><div class="ph"><span class="pt">${n}</span><span class="pv"><span class="${s==='r'?'neg':s==='y'?'gold':'pos'}">${s==='r'?'bruten':s==='y'?'bevaka':'håller'}</span> · ${now}</span></div>
  <div class="pchart">${pillChart(pts,larm,s)}</div>
  <div class="pmeta"><span>6 kvartal</span><span class="gold">${larmLab}</span><span>nu</span></div>
  <div class="pev">${ev}</div></div>`;}
