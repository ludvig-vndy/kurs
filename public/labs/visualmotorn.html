<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visualmotorn · alla sex typer animerade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Spectral:ital,wght@0,400;0,600;1,400&family=Schibsted+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F4EF; --card:#FCFAF4; --ink:#211C17; --ink-soft:#4A4239; --muted:#6E6456; --faint:#C7BBA6;
    --rule:rgba(33,28,23,.16); --rule-strong:rgba(33,28,23,.42); --oxblood:#8A2E26; --gold:#9A6E1C; --good:#3E7A4F;
    --slab:"Zilla Slab",Georgia,serif; --serif:"Spectral",Georgia,serif; --mono:"Schibsted Grotesk",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--serif);line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1040px;margin:0 auto;padding:0 clamp(20px,5vw,52px)}
  header{padding:26px 0 18px;border-bottom:2px solid var(--rule-strong)}
  .word{font-family:var(--slab);font-weight:700;font-size:20px;letter-spacing:.06em;text-transform:uppercase;color:var(--oxblood);text-decoration:none}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-top:16px}
  h1{font-family:var(--slab);font-weight:600;font-size:clamp(26px,3.4vw,36px);letter-spacing:-.008em;margin:4px 0 0}
  .sub{font-size:15.5px;color:var(--ink-soft);margin:8px 0 0;max-width:62ch}
  .alla{display:inline-flex;margin:18px 0 0;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:11px 20px;cursor:pointer}
  .alla:hover{background:var(--oxblood);border-color:var(--oxblood)}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:28px 0 60px}
  @media (max-width:820px){.grid{grid-template-columns:1fr}}
  .kort{border:1px solid var(--rule-strong);background:var(--card);padding:22px 24px;display:flex;flex-direction:column}
  .kort__topp{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .kort__typ{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--oxblood)}
  .kort__lek{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
  .kort h2{font-family:var(--slab);font-weight:600;font-size:19px;margin:8px 0 14px}
  .scen{min-height:190px;display:flex;flex-direction:column;justify-content:center}
  .figt{font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;color:var(--faint);margin-top:12px;line-height:1.5}
  .spela{align-self:flex-start;margin-top:14px;background:none;border:1px solid var(--rule-strong);color:var(--ink-soft);font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:9px 16px;cursor:pointer}
  .spela:hover{color:var(--oxblood);border-color:var(--oxblood)}

  /* rutnat */
  .rutnat{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;max-width:300px}
  .cell{aspect-ratio:1;background:rgba(33,28,23,.08);border-radius:2px}
  .cell.mark{background:var(--oxblood)}
  /* linjediagram */
  .linje svg{display:block;width:100%;height:auto}
  /* stapeldiagram */
  .staplar{display:flex;gap:26px;align-items:flex-end;height:150px;padding:0 6px}
  .stapel{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
  .stapel .v{font-family:var(--mono);font-size:11px;color:var(--ink-soft)}
  .stapel .b{width:100%;max-width:64px;border-radius:2px 2px 0 0;background:var(--ink)}
  .stapel.neg .b{background:var(--oxblood);border-radius:0 0 2px 2px}
  .stapel .k{font-family:var(--mono);font-size:10px;letter-spacing:.02em;color:var(--muted);text-align:center;line-height:1.3;min-height:26px}
  /* flode */
  .flode{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .nod{border:1px solid var(--rule-strong);background:var(--paper);font-family:var(--mono);font-size:11.5px;padding:10px 13px;line-height:1.35}
  .nod.accent{border-color:var(--oxblood);color:var(--oxblood)}
  .op{font-family:var(--slab);font-size:20px;color:var(--muted)}
  /* andel */
  .andel{display:flex;height:34px;border-radius:3px;overflow:hidden;max-width:420px}
  .andel span{display:block;height:100%}
  .andel-et{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px}
  .andel-et .e{font-family:var(--mono);font-size:10.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .andel-et .p{width:10px;height:10px;border-radius:2px;display:inline-block}
  /* jamforelse */
  .jamf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .jamf .sida{border:1px solid var(--rule-strong);background:var(--paper);padding:14px 16px}
  .jamf .r{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--oxblood);margin-bottom:6px}
  .jamf .t{font-size:13.5px;line-height:1.5;color:var(--ink-soft)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="word" href="/fokus">Marginalen</a>
    <div class="eyebrow">Visualmotorn · prototyp · Motion-koreografi</div>
    <h1>Alla sex visualtyper, animerade</h1>
    <p class="sub">Varje kort är en riktig visual ur kursen, ritad av vår egen renderare och satt i rörelse av Motion. Samma koreografier kopplas sedan till berättarrösten: rörelsen triggas när orden sägs.</p>
    <button class="alla" id="alla">Spela alla i följd ▸</button>
  </header>
  <div class="grid" id="grid"></div>
</div>

<script src="/vendor/motion-12.min.js"></script>
<script>
(function(){
  var M=window.Motion, reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var EASE=[0.22,1,0.36,1];
  function anim(el,kf,opt){ if(reduce||!M){ instant(el,kf); return Promise.resolve(); } return M.animate(el,kf,opt); }
  function instant(els,kf){ (els.length!=null&&!els.nodeType?[].slice.call(els):[els]).forEach(function(e){ for(var k in kf){ var v=Array.isArray(kf[k])?kf[k][kf[k].length-1]:kf[k]; if(k==='opacity')e.style.opacity=v; else if(k==='width')e.style.width=v; else e.style.transform=''; } }); }
  var vanta=function(ms){ return new Promise(function(r){ setTimeout(r, reduce?0:ms); }); };

  var ORDNING=['rutnat','linjediagram','stapeldiagram','andel','flode','jamforelse'];
  var RUBRIK={rutnat:'Ägar-rutnätet',linjediagram:'Pris mot värde',stapeldiagram:'Samma verksamhet, två år',andel:'Avkastningens källor',flode:'Kedjan till product-market fit',jamforelse:'Två sätt att förlora'};
  var DATA=null, KOR={};

  fetch('/labs/data/visualprov.json').then(function(r){return r.json();}).then(function(d){ DATA=d.prov; bygg(); });

  function kort(typ){
    var p=DATA[typ], div=document.createElement('div'); div.className='kort';
    div.innerHTML='<div class="kort__topp"><span class="kort__typ">'+typ+'</span><span class="kort__lek">lektion '+p.lektion+'</span></div>'+
      '<h2>'+RUBRIK[typ]+'</h2><div class="scen" data-scen></div>'+
      '<div class="figt">'+(p.visual.figurtext||'')+'</div>'+
      '<button class="spela" type="button">Spela ▸</button>';
    var scen=div.querySelector('[data-scen]');
    div.querySelector('.spela').addEventListener('click', function(){ KOR[typ](scen, p.visual); });
    return div;
  }
  function bygg(){
    var g=document.getElementById('grid');
    ORDNING.forEach(function(t){ g.appendChild(kort(t)); RITA[t](document.querySelectorAll('[data-scen]')[ORDNING.indexOf(t)], DATA[t].visual); });
    document.getElementById('alla').addEventListener('click', async function(){
      for(var i=0;i<ORDNING.length;i++){ var t=ORDNING[i]; await KOR[t](document.querySelectorAll('[data-scen]')[i], DATA[t].visual); await vanta(350); }
    });
  }

  // ── Renderare (data -> DOM/SVG, deterministiskt) + koreografi per typ ──
  var RITA={}, NS='http://www.w3.org/2000/svg';
  function el(n,a){var e=document.createElementNS(NS,n);for(var k in (a||{}))e.setAttribute(k,a[k]);return e;}

  RITA.rutnat=function(scen,v){
    var g=document.createElement('div'); g.className='rutnat';
    for(var c=0;c<(v.celler||100);c++){ var d=document.createElement('div'); d.className='cell'+(c<(v.markerad||0)?' mark':''); if(c<(v.markerad||0)) d.style.opacity=0; g.appendChild(d); }
    scen.innerHTML=''; scen.appendChild(g);
  };
  KOR.rutnat=function(scen,v){
    RITA.rutnat(scen,v);
    var a=anim(scen.querySelectorAll('.cell.mark'),{opacity:[0,1],scale:[.4,1]},{delay:M&&M.stagger(0.07),type:'spring',stiffness:320,damping:18});
    return a;
  };

  RITA.linjediagram=function(scen,v){
    var W=340,H=150,P=10;
    var alla=v.serier.flatMap(function(s){return s.punkter;});
    var min=Math.min.apply(null,alla), max=Math.max.apply(null,alla);
    var X=function(i,n){return P+i/(n-1)*(W-2*P);}, Y=function(val){return H-P-(val-min)/(max-min)*(H-2*P);};
    var svg=el('svg',{viewBox:'0 0 '+W+' '+H});
    v.serier.forEach(function(s,si){
      var pts=s.punkter.map(function(p,i){return X(i,s.punkter.length)+','+Y(p);}).join(' ');
      var pl=el('polyline',{points:pts,fill:'none','stroke-width':s.accent?2.6:1.8,
        stroke:s.accent?'var(--oxblood)':'var(--ink)','data-serie':si,
        'stroke-linecap':'round','stroke-linejoin':'round'});
      if(s.stil==='streckad') pl.setAttribute('data-streckad','1');
      svg.appendChild(pl);
    });
    if(v.markor){
      var s=v.serier[v.markor.serieIndex];
      var cx=X(v.markor.punktIndex,s.punkter.length), cy=Y(s.punkter[v.markor.punktIndex]);
      svg.appendChild(el('circle',{cx:cx,cy:cy,r:5,fill:'var(--gold)','data-markor':'1'}));
      var t=el('text',{x:cx+9,y:cy+4,'font-size':'11','font-family':'var(--mono)',fill:'var(--gold)','data-markoret':'1'}); t.textContent=v.markor.etikett; svg.appendChild(t);
    }
    var w=document.createElement('div'); w.className='linje'; w.appendChild(svg);
    scen.innerHTML=''; scen.appendChild(w);
  };
  KOR.linjediagram=async function(scen,v){
    RITA.linjediagram(scen,v);
    var linjer=scen.querySelectorAll('polyline'), mk=scen.querySelector('[data-markor]'), et=scen.querySelector('[data-markoret]');
    if(mk){mk.style.opacity=0;} if(et){et.style.opacity=0;}
    for(var i=0;i<linjer.length;i++){
      var pl=linjer[i], len=pl.getTotalLength();
      if(pl.hasAttribute('data-streckad')){
        // streckad serie: tonas in (dashoffset kolliderar med dash-monstret)
        pl.setAttribute('stroke-dasharray','5 5'); pl.style.opacity=0;
        await anim(pl,{opacity:[0,1]},{duration:.8,ease:'easeOut'});
        pl.style.opacity=1; // Motion committar inte slutvarden pa SVG med inline-preset
      } else {
        pl.setAttribute('stroke-dasharray',len); pl.setAttribute('stroke-dashoffset',len);
        await anim(pl,{strokeDashoffset:[len,0]},{duration:1.1,ease:EASE});
        pl.setAttribute('stroke-dashoffset',0);
      }
    }
    if(mk){ await anim(mk,{opacity:[0,1],scale:[.3,1]},{type:'spring',stiffness:400,damping:16}); mk.style.opacity=1; }
    if(et){ await anim(et,{opacity:[0,1]},{duration:.3}); et.style.opacity=1; }
  };

  RITA.stapeldiagram=function(scen,v){
    var maxAbs=Math.max.apply(null,v.data.map(function(d){return Math.abs(d.varde);}));
    var w=document.createElement('div'); w.className='staplar';
    v.data.forEach(function(d){
      var s=document.createElement('div'); s.className='stapel'+(d.varde<0?' neg':'');
      var h=Math.round(Math.abs(d.varde)/maxAbs*96);
      s.innerHTML='<span class="v">'+(d.varde>0?'+':'')+d.varde+' %</span><span class="b" style="height:'+h+'px"></span><span class="k">'+d.kategori+'</span>';
      w.appendChild(s);
    });
    scen.innerHTML=''; scen.appendChild(w);
  };
  KOR.stapeldiagram=function(scen,v){
    RITA.stapeldiagram(scen,v);
    var bars=scen.querySelectorAll('.b'), vals=scen.querySelectorAll('.v');
    vals.forEach(function(x){x.style.opacity=0;});
    var a=anim(bars,{scaleY:[0,1]},{delay:M&&M.stagger(0.14),duration:.7,ease:EASE});
    bars.forEach(function(b){ b.style.transformOrigin=b.closest('.neg')?'top':'bottom'; });
    return Promise.resolve(a).then(function(){ return anim(vals,{opacity:[0,1],y:[6,0]},{delay:M&&M.stagger(0.08),duration:.35}); });
  };

  RITA.andel=function(scen,v){
    var farger=['var(--good)','var(--gold)','rgba(33,28,23,.35)'];
    var bar=document.createElement('div'); bar.className='andel';
    var et=document.createElement('div'); et.className='andel-et';
    v.delar.forEach(function(d,i){
      var s=document.createElement('span'); s.style.background=farger[i%farger.length]; s.style.width=d.varde+'%'; s.dataset.mal=d.varde; bar.appendChild(s);
      var e=document.createElement('span'); e.className='e'; e.innerHTML='<span class="p" style="background:'+farger[i%farger.length]+'"></span>'+d.etikett+' '+d.varde+' %'; et.appendChild(e);
    });
    scen.innerHTML=''; scen.appendChild(bar); scen.appendChild(et);
  };
  KOR.andel=async function(scen,v){
    RITA.andel(scen,v);
    var segs=scen.querySelectorAll('.andel span'), ets=scen.querySelectorAll('.andel-et .e');
    ets.forEach(function(x){x.style.opacity=0;});
    for(var i=0;i<segs.length;i++){
      var mal=segs[i].dataset.mal+'%'; segs[i].style.width='0%';
      await anim(segs[i],{width:['0%',mal]},{duration:.55,ease:EASE});
      anim(ets[i],{opacity:[0,1]},{duration:.3});
    }
  };

  RITA.flode=function(scen,v){
    var w=document.createElement('div'); w.className='flode';
    v.noder.forEach(function(n){
      if(n.operator){ var o=document.createElement('span'); o.className='op'; o.textContent=n.operator==='plus'?'+':'='; w.appendChild(o); }
      var d=document.createElement('div'); d.className='nod'+(n.accent?' accent':''); d.textContent=n.etikett; w.appendChild(d);
    });
    scen.innerHTML=''; scen.appendChild(w);
  };
  KOR.flode=async function(scen,v){
    RITA.flode(scen,v);
    var barn=scen.querySelectorAll('.flode > *');
    barn.forEach(function(b){b.style.opacity=0;});
    for(var i=0;i<barn.length;i++){
      var arNod=barn[i].classList.contains('nod');
      await anim(barn[i], arNod?{opacity:[0,1],scale:[.85,1]}:{opacity:[0,1]},
        arNod?{type:'spring',stiffness:300,damping:20}:{duration:.25});
    }
    var acc=scen.querySelector('.nod.accent');
    if(acc) await anim(acc,{scale:[1,1.06,1]},{duration:.5,ease:'easeInOut'});
  };

  RITA.jamforelse=function(scen,v){
    var w=document.createElement('div'); w.className='jamf';
    v.element.forEach(function(e){
      var s=document.createElement('div'); s.className='sida';
      s.innerHTML='<div class="r">'+e.rubrik+'</div><div class="t">'+e.text+'</div>';
      w.appendChild(s);
    });
    scen.innerHTML=''; scen.appendChild(w);
  };
  KOR.jamforelse=async function(scen,v){
    RITA.jamforelse(scen,v);
    var sidor=scen.querySelectorAll('.sida');
    sidor.forEach(function(s){s.style.opacity=0;});
    for(var i=0;i<sidor.length;i++){
      await anim(sidor[i],{opacity:[0,1],x:[i===0?-18:18,0]},{duration:.5,ease:EASE});
    }
  };
})();
</script>
</body>
</html>
