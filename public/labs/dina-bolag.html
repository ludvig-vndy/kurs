<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dina bolag · Delägaren</title>
<meta name="description" content="Din bevakning och bolagsbriefingar, som en arbetsyta i Marginalen.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Spectral:ital,wght@0,300;0,400;0,500;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Tokens och masthead lånade ur broadsheet.css: samma hus som brevet och
     kursen. Skillnaden är registret, inte huden: det här är en arbetsyta, så
     den får vara tätare och mer tabellär, men bär samma identitet. */
  :root{
    --paper:#F6F4EF; --paper-2:#EBE6DD; --card:#FCFAF4;
    --ink:#211C17; --ink-soft:#4A4239; --muted:#6E6456; --faint:#C7BBA6;
    --rule:rgba(33,28,23,.16); --rule-strong:rgba(33,28,23,.42);
    --oxblood:#2C5646; --gold:#B07C1E;
    --good:#2F7A55; --good-soft:#E7EFE6; --bad:#9B3A2E; --bad-soft:#F3E3DD; --gold-soft:#F1E8D1;
    --serif:"Spectral",Georgia,serif; --display:"Outfit",system-ui,sans-serif; --mono:"Inter",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0}
  html{-webkit-text-size-adjust:100%;scrollbar-gutter:stable;overflow-x:clip}
  body{background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100dvh;display:flex;flex-direction:column}
  a{color:inherit}
  :focus-visible{outline:2px solid var(--oxblood);outline-offset:2px}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .wrap{width:100%;max-width:1080px;margin:0 auto;padding:0 clamp(20px,5vw,52px)}

  /* ── masthead (delad) ──────────────────────────────────────────────── */
  .masthead{padding:30px 0 0}
  .mast-top{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;padding-bottom:14px}
  .wordmark-wrap{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
  .wordmark{font-family:var(--display);font-weight:500;font-size:clamp(24px,3.2vw,36px);letter-spacing:.04em;text-transform:uppercase;line-height:.9;color:var(--oxblood)}
  .byline{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-decoration:none;border-bottom:1px solid var(--rule-strong);padding-bottom:1px}
  .byline:hover{color:var(--oxblood)}
  .nav-div{width:1px;height:14px;background:var(--rule-strong);align-self:center}
  .nav-back{color:var(--muted)!important}
  .edition{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:right;line-height:1.7}
  .mast-rule{height:2px;background:var(--rule-strong)}
  .nav{display:flex;flex-wrap:wrap;gap:2px 22px;padding:2px 0;font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase}
  .nav a{display:inline-flex;align-items:center;min-height:40px;color:var(--muted);text-decoration:none}
  .nav a:hover,.nav a.here{color:var(--ink)}
  .nav a.here{color:var(--oxblood)}

  main{flex:1;padding-bottom:96px}
  .page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin:22px 0 6px}
  .h-title{font-family:var(--display);font-weight:300;font-size:clamp(30px,4.4vw,46px);line-height:1.04;letter-spacing:-.02em}
  .h-side{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .ghost{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);border:1px solid var(--rule-strong);padding:11px 18px;border-radius:99px;text-decoration:none;background:none;cursor:pointer;transition:border-color .2s,color .2s;white-space:nowrap}
  .ghost:hover{border-color:var(--oxblood);color:var(--oxblood)}
  .page-h-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

  /* ── Dina bolag: arbetsyta ─────────────────────────────────────────── */
  .lede{font-family:var(--serif);font-size:18px;color:var(--ink-soft);max-width:60ch;margin-top:8px}
  .lede b{font-weight:500;color:var(--ink)}

  /* ── Portföljöversikt (summary) ────────────────────────────────────────
     Ägarens tre tal, inte en handlartavla: värdet och totalavkastningen är
     de stora, dagsavkastningen visas liten med flit. Ett band binder ihop
     dem, allokeringen ligger som en tunn stapel under, inte som kort. */
  .ovr{border-top:2px solid var(--rule-strong);border-bottom:1px solid var(--rule);margin:24px 0 6px;padding:20px 0 18px}
  .ovr-fig{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 40px}
  .ovr-block{min-width:0}
  .ovr-k{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
  .ovr-tot{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:clamp(30px,5vw,42px);font-weight:500;letter-spacing:-.01em;line-height:1;color:var(--ink)}
  .ovr-tot .kr{font-size:.5em;font-weight:400;color:var(--muted);margin-left:4px;letter-spacing:.02em}
  .ovr-avk{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:clamp(19px,3vw,24px);font-weight:500;line-height:1.1}
  .ovr-avk .pct{font-size:.78em;margin-left:8px;opacity:.92}
  .ovr-avk.up{color:var(--good)} .ovr-avk.dn{color:var(--bad)}
  /* Dagen: medvetet liten och tyst. Ägare, inte spekulant. */
  .ovr-day{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted);letter-spacing:.01em;margin-top:2px}
  .ovr-day .v.up{color:var(--good)} .ovr-day .v.dn{color:var(--bad)}
  .ovr-day .lbl{color:var(--faint)}
  /* Allokering: tunn stapel + en rad text, ingen tårtbit-cirkus. */
  .alloc{margin-top:16px}
  .alloc-bar{display:flex;height:7px;border-radius:99px;overflow:hidden;background:var(--paper-2)}
  .alloc-bar span{display:block;height:100%;border-right:1.5px solid var(--paper)}
  .alloc-bar span:last-child{border-right:none}
  .alloc-line{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;color:var(--muted);margin-top:8px}
  .alloc-line b{color:var(--ink);font-weight:500}

  /* ── Sektionshuvuden: gör Äger/Följer omisskännligt ────────────────── */
  .split{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 12px;margin:26px 0 4px}
  .split .lab{font-family:var(--display);font-weight:600;font-size:21px;letter-spacing:-.01em;color:var(--ink)}
  .split.foljer .lab{color:var(--gold)}
  .split.ager .lab{color:var(--oxblood)}
  .split .meta{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--muted);font-variant-numeric:tabular-nums}
  .split::after{content:"";flex:1;min-width:20px;height:2px;background:var(--rule-strong);align-self:center;margin-left:4px}
  /* Undergrupp inom Äger (uppmärksamhet/rör sig/lugnt): mjukare flagga. */
  .flag{display:flex;align-items:center;gap:12px;margin:16px 0 2px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .flag::after{content:"";flex:1;height:1px;background:var(--rule)}
  .flag .cnt{color:var(--oxblood)}

  /* ── Innehavsrad (Äger): namn+status vänster, tal högerställda ──────── */
  .hold{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:3px 18px;align-items:baseline;padding:11px 4px;border-top:1px solid var(--rule);text-decoration:none;color:inherit;cursor:pointer;transition:background .14s,transform .2s}
  .hold:hover{background:var(--card);transform:translateX(4px)}
  .hold:first-of-type{border-top:none}
  .hold>div{min-width:0}
  .dot{width:8px;height:8px;border-radius:50%;position:relative;top:6px}
  .dot.neg{background:var(--bad)} .dot.pos{background:var(--good)} .dot.gold{background:var(--gold)} .dot.calm{background:var(--faint)}
  .hold .nm{font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:-.01em}
  .hold .tk{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--faint);margin-left:8px}
  /* Status: en enda scanningsbar rad, klipps med ellips. Full text i briefingen. */
  .hold .ln{color:var(--ink-soft);font-size:14px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hold .go{font-family:var(--mono);font-size:12px;color:var(--faint);margin-top:4px;letter-spacing:.02em}
  .hold:hover .go{color:var(--oxblood)}

  /* Talkolumnen: två rader. Rad 1 = värde + andel (position), rad 2 =
     totalavkastning (prominent) och i dag (liten). Allt tabellärt och
     högerställt så kolumnen linjerar rad mot rad. */
  .rt{text-align:right;font-variant-numeric:tabular-nums}
  .rt .amt{font-family:var(--mono);font-size:15px;color:var(--ink);white-space:nowrap}
  .rt .amt .andel{font-size:11px;color:var(--muted);margin-left:9px}
  .rt .tavk{font-family:var(--mono);font-size:15px;font-weight:500;margin-top:4px;white-space:nowrap}
  .rt .tavk.up{color:var(--good)} .rt .tavk.dn{color:var(--bad)}
  .rt .tavk .kr{font-size:11px;font-weight:400;color:var(--muted);margin-left:7px}
  .rt .day{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:2px;white-space:nowrap}
  .rt .day .v.up{color:var(--good)} .rt .day .v.dn{color:var(--bad)}
  .rt .day .lbl{color:var(--faint)}

  /* ── Bevakningsrad (Följer): ingen position, kursförändring + skäl + affordance ── */
  .hold.watchrow .rt{text-align:left}
  .hold .fchg{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:15px;font-weight:500;white-space:nowrap}
  .hold .fchg.up{color:var(--good)} .hold .fchg.dn{color:var(--bad)}
  .hold .fchg .lbl{font-family:var(--mono);font-size:10.5px;font-weight:400;color:var(--faint);margin-left:8px;letter-spacing:.02em;white-space:normal}
  .hold .watch{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:5px;letter-spacing:.02em;max-width:44ch}
  .hold .watch b{color:var(--good);font-weight:500}
  .hold .make{font-family:var(--mono);font-size:12.5px;color:var(--faint);margin-top:7px;letter-spacing:.02em}
  .hold:hover .make{color:var(--oxblood)}

  /* Äger/Följer-pill: liten etikett per rad, syns vid skumläsning. */
  .tag{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:99px;border:1px solid var(--rule-strong);color:var(--muted);margin-left:8px;white-space:nowrap;vertical-align:middle}
  .tag.ager{color:var(--oxblood);border-color:var(--oxblood)}
  .tag.foljer{color:var(--gold);border-color:var(--gold)}

  /* ── Briefing ──────────────────────────────────────────────────────── */
  /* Bevakningen är en bred arbetsyta; briefingen är en läsning, så den får en
     lugnare centrerad spaltbredd. Samma hus, olika register. */
  .brief{max-width:764px;margin:0 auto}
  .back{background:none;border:none;cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:inline-flex;align-items:center;gap:8px;padding:22px 0 6px}
  .back:hover{color:var(--oxblood)}
  .shead{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px;margin-top:6px}
  .shead h1{font-family:var(--display);font-weight:400;font-size:clamp(32px,4.6vw,50px);letter-spacing:-.02em;line-height:1}
  .shead .tk{font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--faint)}
  .shead .status{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;border:1px solid var(--rule-strong);color:var(--bad)}
  .shead .pr{margin-left:auto;font-family:var(--mono);font-size:16px;font-variant-numeric:tabular-nums;text-align:right}
  .shead .pr .chg{font-size:12px;margin-left:6px;color:var(--bad)}
  .factbar{display:flex;flex-wrap:wrap;gap:2px 0;align-items:baseline;font-family:var(--mono);font-size:13px;color:var(--muted);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:12px 2px;margin:16px 0 20px;font-variant-numeric:tabular-nums}
  .factbar .f{display:inline-flex;gap:7px;align-items:baseline}
  .factbar .k{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
  .factbar .v{color:var(--ink)}
  .factbar .sep{margin:0 16px;color:var(--rule-strong)}

  .why{background:var(--card);border:1px solid var(--rule);padding:16px 18px;margin-bottom:22px}
  .why .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between;gap:10px}
  .why .k .edit{color:var(--oxblood);cursor:pointer}
  .why .t{font-family:var(--serif);font-size:17px;color:var(--ink);line-height:1.5}
  .verdict{font-family:var(--display);font-weight:300;font-size:clamp(20px,2.6vw,26px);line-height:1.32;letter-spacing:-.01em;color:var(--ink);margin-bottom:6px}
  .verdict-src{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-bottom:8px}

  section.sec{border-top:2px solid var(--rule-strong);padding:26px 0 24px;margin-top:6px}
  .sech{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:16px}
  .prose{max-width:66ch}
  .prose p{color:var(--ink-soft);margin-bottom:13px}
  .prose .lab{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;margin-right:8px;padding:2px 7px;border:1px solid var(--rule-strong);color:var(--muted)}
  .prose .lab.slut{color:var(--oxblood);border-color:var(--oxblood)}
  .cit{font-family:var(--mono);font-size:10px;color:var(--oxblood);vertical-align:super;margin-left:2px;cursor:help;text-decoration:none}

  /* vakter (pelare): gauges, inte marknadsföringskort */
  .pil{padding:16px 0 18px;border-top:1px solid var(--rule)}
  .pil:first-child{border-top:none;padding-top:2px}
  .pil .ph{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:4px}
  .pil .pstate{width:9px;height:9px;border-radius:50%;flex:0 0 auto;position:relative;top:1px}
  .pil.g .pstate{background:var(--good)} .pil.r .pstate{background:var(--bad)} .pil.y .pstate{background:var(--gold)}
  .pil .pn{font-family:var(--display);font-weight:500;font-size:16px}
  .pil .pnow{margin-left:auto;font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
  .pil.r .pnow{color:var(--bad)} .pil.g .pnow{color:var(--good)} .pil.y .pnow{color:var(--gold)}
  .pil svg{width:100%;max-width:440px;height:auto;display:block;margin:8px 0 4px;overflow:visible}
  .pil .pm{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;letter-spacing:.03em;color:var(--faint)}
  .pil .pm .larm{color:var(--oxblood)}
  .pil .pev{color:var(--muted);font-size:14px;margin-top:9px;max-width:62ch;line-height:1.5}

  /* räkenskaper: tabell */
  .tscroll{overflow-x:auto;margin-top:2px}
  table.dt{width:100%;border-collapse:collapse;font-size:13.5px}
  table.dt th{text-align:right;color:var(--faint);font-weight:500;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;padding:0 0 10px 16px;white-space:nowrap}
  table.dt th:first-child{text-align:left;padding-left:0}
  table.dt td{padding:11px 0 11px 16px;border-top:1px solid var(--rule);font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;color:var(--ink)}
  table.dt td:first-child{text-align:left;font-family:var(--serif);font-size:15px;color:var(--ink-soft);padding-left:0}
  table.dt td .d{font-size:11px;margin-left:4px}
  .neg{color:var(--bad)} .pos{color:var(--good)} .mutc{color:var(--muted)}
  .airead{background:var(--card);border:1px solid var(--rule);padding:15px 18px;margin-top:18px;font-family:var(--serif);font-size:15.5px;color:var(--ink-soft);line-height:1.55}
  .airead .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--oxblood);margin-bottom:6px}

  /* ägarbild + kalender: kompakta rader, inga kort */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:32px}
  @media(max-width:720px){.grid2{grid-template-columns:1fr;gap:24px}}
  .rows{list-style:none}
  .rows li{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-top:1px solid var(--rule);font-size:14.5px}
  .rows li:first-child{border-top:none}
  .rows .rv{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap}
  .rows .rv.neg{color:var(--bad)}
  .subh{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
  .note{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.5}

  /* ── ambient Fråga ─────────────────────────────────────────────────── */
  .askdock{position:fixed;left:0;right:0;bottom:0;z-index:40;background:linear-gradient(transparent,var(--paper) 26%)}
  .askbar{max-width:760px;margin:0 auto;padding:0 clamp(20px,5vw,52px) 18px;display:flex;align-items:center;gap:12px}
  .askbar form{flex:1;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--rule-strong);border-radius:99px;padding:11px 12px 11px 18px;box-shadow:0 6px 24px rgba(33,28,23,.10)}
  .askctx{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--oxblood);white-space:nowrap;border-right:1px solid var(--rule);padding-right:12px}
  .askbar input{flex:1;border:none;background:none;font-family:var(--serif);font-size:15px;color:var(--ink);outline:none;min-width:0}
  .askbar input::placeholder{color:var(--muted)}
  .kbd{font-family:var(--mono);font-size:10px;letter-spacing:.04em;color:var(--faint);border:1px solid var(--rule-strong);border-radius:6px;padding:3px 7px;white-space:nowrap}
  .asksend{border:none;background:var(--oxblood);color:var(--paper);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
  .asksend svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  .askpanel{position:fixed;left:0;right:0;bottom:74px;z-index:41;display:none}
  .askpanel.show{display:block}
  .askpanel .inner{max-width:760px;margin:0 auto;padding:0 clamp(20px,5vw,52px)}
  .askcard{background:var(--card);border:1px solid var(--rule-strong);border-radius:16px;padding:16px 18px;box-shadow:0 18px 50px rgba(33,28,23,.22)}
  .askcard .seedh{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
  .seed{display:flex;gap:8px;flex-wrap:wrap}
  .seedb{font-family:var(--serif);font-size:14px;background:var(--paper);border:1px solid var(--rule-strong);border-radius:99px;padding:8px 14px;color:var(--ink-soft);cursor:pointer;transition:.15s}
  .seedb:hover{border-color:var(--oxblood);color:var(--oxblood)}
  .ans{margin-top:14px;padding-top:14px;border-top:1px solid var(--rule);display:none}
  .ans.show{display:block}
  .ans .q{font-family:var(--display);font-weight:500;font-size:15px;margin-bottom:8px}
  .ans p{font-size:14.5px;color:var(--ink-soft);line-height:1.55;margin-bottom:10px}
  .ans .lab{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;margin-right:7px;padding:2px 6px;border:1px solid var(--rule-strong);color:var(--muted)}
  .ans .lab.slut{color:var(--oxblood);border-color:var(--oxblood)}
  .ans table.dt{margin-top:6px;font-size:12.5px}
  .ans table.dt td{padding:7px 0 7px 12px}
  .ans .foot{display:flex;gap:20px;flex-wrap:wrap;margin-top:12px;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
  .ans .foot a{color:var(--oxblood);text-decoration:none} .ans .foot a.kurs{color:var(--muted)}
  .ans .foot a:hover{text-decoration:underline}
  .askx{position:absolute;top:-40px;right:clamp(20px,5vw,52px);background:var(--card);border:1px solid var(--rule-strong);border-radius:99px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:6px 12px;cursor:pointer}

  /* ── footer (delad) ────────────────────────────────────────────────── */
  .site-foot{border-top:2px solid var(--rule-strong)}
  .site-foot .wrap{padding-top:26px;padding-bottom:40px}
  .site-foot__top{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
  .site-foot__mark{font-family:var(--display);font-weight:500;font-size:20px;letter-spacing:.04em;text-transform:uppercase;text-decoration:none;color:var(--ink)}
  .site-foot__nav{display:flex;flex-wrap:wrap;gap:10px 22px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
  .site-foot__nav a{color:var(--muted);text-decoration:none}
  .site-foot__nav a:hover{color:var(--oxblood)}
  .site-foot__fine{margin-top:16px;font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;color:var(--faint)}

  [data-reveal]{opacity:0;transform:translateY(8px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
  [data-reveal].on{opacity:1;transform:none}
  @media (prefers-reduced-motion:reduce){[data-reveal]{opacity:1!important;transform:none!important;transition:none}.hold:hover{transform:none}}
  @media(max-width:560px){
    .factbar .sep{margin:0 10px}
    .shead .pr{margin-left:0;width:100%;text-align:left}
    .askctx{display:none}
    .ovr-fig{gap:14px 32px}
    /* stapla talkolumnen under namn+status så inga tal tvingar bredd på
       auto-kolumnen; talen vänsterställs och ligger på egen rad. */
    .hold{grid-template-columns:14px 1fr}
    .hold .rt{grid-column:2;text-align:left;margin-top:9px}
    .hold.watchrow .rt{margin-top:6px}
    /* På smalt: håll värde/andel och avkastning/dag ihop på var sin rad
       men lägg dem sida vid sida i stället för högerkolumn. */

    .rt .day{display:inline;margin-left:14px}
    .hold .go{margin-top:9px}
  }
  @media(max-width:360px){
    .rt .pos-share,.rt .day{display:block;margin-left:0}
  }

<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&display=swap" rel="stylesheet">
<style>.wordmark,.housemark{font-family:"Zilla Slab",Georgia,serif;font-weight:700;letter-spacing:.03em}</style>
<script src="/labs/site-masthead.js"></script>
</head>
<body>

<site-masthead active="bolag"></site-masthead>

<main class="wrap">
  <div id="view"></div>
</main>

<!-- Ambient Fråga: dockad rad + panel. Kontextmedveten, inte en flik. -->
<div class="askpanel" id="askpanel" aria-hidden="true">
  <div class="inner" style="position:relative">
    <button class="askx" id="askx">Stäng · Esc</button>
    <div class="askcard">
      <div class="seedh" id="seedh">Fråga om din portfölj</div>
      <div class="seed" id="seed"></div>
      <div class="ans" id="ans"></div>
    </div>
  </div>
</div>
<div class="askdock">
  <div class="askbar">
    <form id="askform">
      <span class="askctx" id="askctx">Din portfölj</span>
      <input id="askinput" type="text" placeholder="Fråga om din portfölj..." autocomplete="off" aria-label="Fråga AI">
      <span class="kbd">⌘K</span>
      <button class="asksend" type="submit" aria-label="Fråga"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></button>
    </form>
  </div>
</div>

<footer class="site-foot">
  <div class="wrap">
    <div class="site-foot__top">
      <a class="site-foot__mark" href="/hem">Delägaren</a>
      <nav class="site-foot__nav">
        <a href="/hem">Hem</a>
        <a href="/fokus">Kursöversikt</a>
        <a href="/labs/agarbrevet.html">Ägarbrevet</a>
        <a href="/verktyg">Verktyg</a>
      </nav>
    </div>
    <p class="site-foot__fine">Prototyp · exempeldata · fiktiva bolag, påhittade siffror. Information i utbildningssyfte, aldrig köp- eller säljråd.</p>
  </div>
</footer>

<script defer src="/vendor/supabase-js-2.110.2.min.js"></script>
<script defer src="/labs/agarbrevet-supabase.js"></script>
<script>
// Mock-datan (Telvio m.fl.) ar borttagen: boot() renderar riktiga innehav
// (renderReal) eller tomt tillstand (renderEmpty). Se git-historiken.

// ── Ambient Fråga ─────────────────────────────────────────────────────
const panel=document.getElementById('askpanel'), seed=document.getElementById('seed'),
  seedh=document.getElementById('seedh'), ansEl=document.getElementById('ans'),
  ctxEl=document.getElementById('askctx'), inp=document.getElementById('askinput');
let CUR=null;
function setAsk(ask){
  CUR=ask;
  if(ask){ ctxEl.textContent=ask.ctx; inp.placeholder='Fråga om '+ask.ctx+'...'; seedh.textContent=ask.seedh; }
  else { ctxEl.textContent='Din portfölj'; inp.placeholder='Fråga om din portfölj...'; seedh.textContent='Fråga om din portfölj'; }
  const seeds = ask ? ask.seeds : ['Vilket bolag behöver mig mest i dag?','Äger jag för mycket av samma sak?','Vad hände i natt?'];
  seed.innerHTML = seeds.map(q=>'<button class="seedb" type="button">'+q+'</button>').join('');
  seed.querySelectorAll('.seedb').forEach((b,i)=> b.addEventListener('click', ()=> answer(seeds[i])));
  ansEl.classList.remove('show'); ansEl.innerHTML='';
}
function answer(q){
  const a = (CUR && CUR.answer && (q===CUR.answer.q)) ? CUR.answer : null;
  if(a){
    ansEl.innerHTML = '<div class="q">'+a.q+'</div>'+a.html+'<div class="foot">'+a.foot+'</div>';
  } else {
    ansEl.innerHTML = '<div class="q">'+q+'</div><p>I prototypen är ett exempelsvar inkopplat på Telvios "Hur illa är det?". '+
      'I skarpt läge svarar modellen på frågan, med varje siffra spårad till källa och en länk till rätt lektion.</p>'+
      '<div class="foot"><a href="#">Så fungerar källgrinden →</a></div>';
  }
  ansEl.classList.add('show');
  openPanel();
}
function openPanel(){ panel.classList.add('show'); panel.setAttribute('aria-hidden','false'); }
function closePanel(){ panel.classList.remove('show'); panel.setAttribute('aria-hidden','true'); }
document.getElementById('askx').addEventListener('click', closePanel);
document.getElementById('askform').addEventListener('submit', e=>{ e.preventDefault(); answer(inp.value.trim()||(CUR?CUR.seeds[0]:'Vad hände i natt?')); });
inp.addEventListener('focus', openPanel);
document.addEventListener('keydown', e=>{
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); inp.focus(); openPanel(); }
  if(e.key==='Escape') closePanel();
});

// ── Reveal + start ────────────────────────────────────────────────────
function reveal(){
  const els=document.querySelectorAll('[data-reveal]:not(.on)');
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){ els.forEach(el=>el.classList.add('on')); return; }
  const io=new IntersectionObserver((en)=>{en.forEach(x=>{if(x.isIntersecting){x.target.classList.add('on');io.unobserve(x.target);}})},{rootMargin:'0px 0px -6% 0px',threshold:.05});
  els.forEach(el=>io.observe(el));
}


// ── Riktiga innehav (Supabase) kontra demo ────────────────────────────
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtSEK(n){ if(n==null||isNaN(n)) return null; return Math.round(n).toLocaleString('sv-SE')+' kr'; }

function realRow(h){
  const foljer = h.relation==='foljer';
  const tag = '<span class="tag '+(foljer?'foljer':'ager')+'">'+(foljer?'följer':'äger')+'</span>';
  const ansk = (h.quantity!=null && h.gav!=null) ? fmtSEK(h.quantity*h.gav) : null;
  const antal = (h.quantity!=null) ? (Number(h.quantity).toLocaleString('sv-SE')+' st') : '';
  const kalla = h.source==='csv' ? 'CSV' : (h.source==='manual' ? 'manuell inmatning' : (h.source||'import'));
  const ln = 'Importerad från '+kalla+'. Analys och bevakning tillkommer när motorn körts på bolaget.';
  const rt = ansk
    ? '<div class="amt">'+ansk+(antal?'<span class="andel">'+antal+'</span>':'')+'</div>'+
      '<div class="day"><span class="lbl">anskaffningsvärde</span></div>'
    : (antal?'<div class="amt">'+antal+'</div>':'');
  return '<div class="hold" aria-disabled="true">'+
    '<span class="dot calm"></span>'+
    '<div><div><span class="nm">'+esc(h.name)+'</span>'+(h.ticker?'<span class="tk">'+esc(h.ticker)+'</span>':'')+tag+'</div>'+
    '<div class="ln">'+ln+'</div></div>'+
    '<div class="rt">'+rt+'</div></div>';
}

function pageHeader(){
  // Samma huvud som demovyn: identitet/utloggning ligger nu i masthuvudets chip.
  return '<div class="page-h" data-reveal><h1 class="h-title">Dina bolag</h1>'+
    '<div class="page-h-actions">'+
      '<a class="ghost" href="/labs/importera.html">Importera innehav</a>'+
      '<a class="ghost" href="/labs/lagg-till-bolag.html">+ Lägg till bolag</a>'+
    '</div></div>';
}
function groupH(txt){
  return '<div style="font-family:var(--mono);font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px">'+txt+'</div>';
}

function renderReal(holds, user){
  const owned = holds.filter(h=>h.relation!=='foljer');
  const follow = holds.filter(h=>h.relation==='foljer');
  let html = pageHeader();
  if(owned.length){ html += groupH('Äger ('+owned.length+')') + owned.map(realRow).join(''); }
  if(follow.length){ html += groupH('Följer ('+follow.length+')') + follow.map(realRow).join(''); }
  view.innerHTML = html;
  reveal();
  setAsk(null);
}

function renderEmpty(user){
  view.innerHTML = pageHeader() +
    '<div style="text-align:center;padding:56px 20px;color:var(--muted)">'+
      '<div style="font-family:var(--serif);font-size:22px;color:var(--ink);margin:0 0 10px">Inga innehav än.</div>'+
      '<p style="max-width:42ch;margin:0 auto 22px;font-size:15px">Importera din depå från Avanza eller Nordnet, så lägger vi in bolagen här och börjar bevaka dem åt dig.</p>'+
      '<a href="/labs/importera.html" style="display:inline-block;background:var(--oxblood);color:#fff;font-family:var(--mono);font-size:13px;letter-spacing:.04em;padding:12px 22px;border-radius:2px;text-decoration:none">Importera innehav &rarr;</a>'+
    '</div>';
  reveal();
  setAsk(null);
}

async function boot(){
  history.replaceState({v:'list'},'');
  // Sidan ar inloggningsgrindad -> riktiga innehav eller tomt tillstand galler.
  if(!(window.AB && window.AB.ready)){ renderEmpty(); return; }
  let user=null;
  try{ user = await AB.getUser(); }catch(e){}
  if(!user){ renderEmpty(); return; }
  // Flusha en import som lades undan innan inloggningen.
  try{
    const pend = localStorage.getItem('agarbrevet-pending-import');
    if(pend){
      const rows = JSON.parse(pend);
      if(rows && rows.length){ await AB.insertHoldings(rows); }
      localStorage.removeItem('agarbrevet-pending-import');
    }
  }catch(e){ console.error('flush pending import:', e); }
  let holds=[];
  try{ holds = await AB.listHoldings(); }catch(e){ console.error('listHoldings:', e); }
  if(holds && holds.length) renderReal(holds, user);
  else renderEmpty(user);
}
// Modulen laddas nu deferrat: kor boot efter DOM (AB garanterat redo da).
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
</script>
</body>
</html>
