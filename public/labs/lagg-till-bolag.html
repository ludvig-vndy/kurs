<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lägg till bolag · Delägaren</title>
<meta name="description" content="Lägg till ett bolag i din bevakning. Ett steg räcker, resten är valfritt.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Spectral:ital,wght@0,300;0,400;0,500;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F4EF; --paper-2:#EBE6DD; --card:#FCFAF4;
    --ink:#211C17; --ink-soft:#4A4239; --muted:#6E6456; --faint:#C7BBA6;
    --rule:rgba(33,28,23,.16); --rule-strong:rgba(33,28,23,.42);
    --oxblood:#2C5646; --gold:#B07C1E; --good:#2F7A55;
    --serif:"Spectral",Georgia,serif; --display:"Outfit",system-ui,sans-serif; --mono:"Inter",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0}
  html{-webkit-text-size-adjust:100%;scrollbar-gutter:stable;overflow-x:clip}
  body{background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:18px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100dvh;display:flex;flex-direction:column}
  a{color:inherit}
  :focus-visible{outline:2px solid var(--oxblood);outline-offset:2px}
  .wrap{width:100%;max-width:1080px;margin:0 auto;padding:0 clamp(20px,5vw,52px)}

  .masthead{padding:30px 0 0}
  .mast-top{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;padding-bottom:14px}
  .wordmark-wrap{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
  .wordmark{font-family:var(--display);font-weight:500;font-size:clamp(24px,3.2vw,36px);letter-spacing:.04em;text-transform:uppercase;line-height:.9;color:var(--oxblood)}
  .byline{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-decoration:none;border-bottom:1px solid var(--rule-strong);padding-bottom:1px}
  .byline:hover{color:var(--oxblood)}
  .nav-div{width:1px;height:14px;background:var(--rule-strong);align-self:center}
  .nav-back{color:var(--muted)!important}
  .edition{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:right;line-height:1.7}
  .mast-rule{height:2px;background:var(--rule-strong)}
  .nav{display:flex;flex-wrap:wrap;gap:2px 22px;padding:2px 0;font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase}
  .nav a{display:inline-flex;align-items:center;min-height:40px;color:var(--muted);text-decoration:none}
  .nav a:hover,.nav a.here{color:var(--ink)}
  .nav a.here{color:var(--oxblood)}

  main{flex:1;padding-bottom:60px}
  .flow{max-width:600px;margin:0 auto}

  /* stegmätare */
  .pips{display:flex;gap:6px;margin:28px 0 24px}
  .pips i{height:3px;flex:1;background:var(--paper-2);transition:background .3s}
  .pips i.on{background:var(--oxblood)}

  .kicker{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--oxblood);margin-bottom:10px}
  h1{font-family:var(--display);font-weight:300;font-size:clamp(28px,4vw,42px);line-height:1.06;letter-spacing:-.02em}
  .sub{font-family:var(--serif);font-size:17px;color:var(--ink-soft);margin-top:12px;max-width:54ch}

  /* val av bolag: sök + träfflista */
  .searchwrap{position:relative;margin-top:22px}
  .searchwrap input{width:100%;background:var(--card);border:1px solid var(--rule-strong);border-radius:12px;font-family:var(--serif);font-size:17px;color:var(--ink);padding:15px 16px 15px 46px;outline:none;transition:border-color .15s,box-shadow .15s}
  .searchwrap input:focus{border-color:var(--oxblood);box-shadow:0 0 0 4px rgba(44,86,70,.12)}
  .searchwrap input::placeholder{color:var(--muted)}
  .searchwrap .sic{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:18px}
  .results{display:flex;flex-direction:column;margin-top:8px}
  .rrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 15px;border:1px solid var(--rule);border-top:none;background:var(--card);cursor:pointer;text-align:left;font-family:var(--serif);font-size:16px;color:var(--ink);transition:background .12s}
  .rrow:first-child{border-top:1px solid var(--rule);border-radius:10px 10px 0 0}
  .rrow:last-child{border-radius:0 0 10px 10px}
  .rrow:only-child{border-radius:10px}
  .rrow:hover,.rrow.sel{background:var(--paper-2)}
  .rrow .rmeta{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);white-space:nowrap}
  .rrow.sel .rmeta{color:var(--oxblood)}
  .rrow.add{color:var(--oxblood)} .rrow.add .rmeta{color:var(--oxblood)}
  .rempty{font-family:var(--mono);font-size:12px;color:var(--muted);padding:10px 2px;line-height:1.6}
  .quick{margin-top:16px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .quick .ql{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
  .chip{font-family:var(--display);font-weight:500;font-size:14.5px;background:var(--card);border:1px solid var(--rule-strong);border-radius:99px;padding:8px 15px;color:var(--ink-soft);cursor:pointer;transition:.15s}
  .chip:hover{border-color:var(--oxblood);color:var(--oxblood)}
  .chip.sel{border-color:var(--oxblood);color:var(--paper);background:var(--oxblood)}

  /* skäl-mening (förslag, valfritt) */
  .sent{background:var(--card);border:1px solid var(--rule);padding:22px 24px;font-family:var(--serif);font-size:19px;line-height:1.8;margin-top:22px}
  .sent .co{color:var(--oxblood);font-weight:500;font-family:var(--display)}
  .sent input{background:none;border:none;border-bottom:1.5px solid var(--oxblood);color:var(--ink);font-family:var(--serif);font-size:18px;outline:none;min-width:120px;max-width:100%;padding:0 2px 2px}
  .hint{font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;color:var(--faint);margin-top:12px;line-height:1.6}

  /* kurs-korsvägar */
  .cross{display:flex;align-items:center;gap:14px;background:var(--paper-2);border:1px solid var(--rule);padding:14px 16px;text-decoration:none;color:inherit;margin-top:12px;transition:.15s}
  .cross:hover{border-color:var(--oxblood)}
  .cross .ic{font-family:var(--display);font-size:20px;color:var(--gold);flex:0 0 auto;width:24px;text-align:center}
  .cross b{font-family:var(--display);font-weight:600;font-size:14.5px;display:block}
  .cross span{font-size:13.5px;color:var(--muted)}
  .cross .arr{margin-left:auto;color:var(--oxblood);font-family:var(--display);font-size:20px}

  /* vakter */
  .vrow{background:var(--card);border:1px solid var(--rule);padding:15px 17px;margin-top:12px}
  .vrow .vn{font-family:var(--display);font-weight:500;font-size:16px;margin-bottom:9px}
  .vrow .vg{display:flex;align-items:center;gap:10px}
  .vrow .vg .gl{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);flex:0 0 auto}
  .vrow .vg input{flex:1;background:var(--paper);border:1px solid var(--rule-strong);color:var(--ink-soft);font-size:14px;padding:8px 11px;outline:none;font-family:var(--serif)}
  .vrow .vg input:focus{border-color:var(--oxblood);color:var(--ink)}

  /* klart */
  .done-card{border:1px solid var(--rule);background:var(--card);padding:18px 20px;margin-top:18px}
  .done-card .dh{font-family:var(--display);font-weight:600;font-size:15px;margin-bottom:8px}
  .done-card p{font-size:14.5px;color:var(--ink-soft);line-height:1.7}

  /* knappar */
  .nav-btns{display:flex;gap:10px;margin-top:26px;flex-wrap:wrap}
  .btn{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;padding:14px 22px;border-radius:99px;border:1px solid var(--rule-strong);background:none;color:var(--ink-soft);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px;transition:.2s}
  .btn:hover{border-color:var(--oxblood);color:var(--oxblood)}
  .btn.prim{background:var(--ink);border-color:var(--ink);color:var(--paper)}
  .btn.prim:hover{background:var(--oxblood);border-color:var(--oxblood);color:var(--paper);transform:translateX(3px)}
  .btn.prim[disabled]{opacity:.4;pointer-events:none}
  .btn.ghost{border-color:transparent;color:var(--muted)}
  .btn.ghost:hover{color:var(--oxblood)}
  .spacer{flex:1}

  .site-foot{border-top:2px solid var(--rule-strong)}
  .site-foot .wrap{padding-top:24px;padding-bottom:40px}
  .site-foot__fine{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;color:var(--faint)}

  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .step{animation:fade .4s cubic-bezier(.2,.7,.2,1)}
  @media(prefers-reduced-motion:reduce){.step{animation:none}}
</style>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&display=swap" rel="stylesheet">
<style>.wordmark,.housemark{font-family:"Zilla Slab",Georgia,serif;font-weight:700;letter-spacing:.03em}</style>
<script src="/labs/site-masthead.js"></script>
</head>
<body>

<site-masthead active=""></site-masthead>

<main class="wrap">
  <div class="flow">
    <div class="pips" id="pips"></div>
    <div id="step"></div>
  </div>
</main>

<footer class="site-foot">
  <div class="wrap"><p class="site-foot__fine">Prototyp · exempeldata · fiktiva bolag. Information i utbildningssyfte, aldrig köp- eller säljråd.</p></div>
</footer>

<script defer src="/vendor/supabase-js-2.110.2.min.js"></script>
<script defer src="/labs/agarbrevet-supabase.js"></script>
<script>
// "Vanliga" = bolag motorn faktiskt bevakar i dag (motor/bolag.json), så POC-loopen
// (lägg till -> följ -> brev -> fråga) fungerar direkt för dem.
// Namn + ticker (som i companies.json) så chip-tillägg joinar mot kurs och historik.
const BOLAG = [
  {n:'Unibap Space Solutions', t:'UNIBAP'},
  {n:'Lifco',                  t:'LIFCO.B'},
  {n:'Evolution',              t:'EVO'},
  {n:'Telia Company',          t:'TELIA'},
  {n:'Sectra',                 t:'SECT.B'},
  {n:'Axfood',                 t:'AXFO'},
];
// Söket har två lager. Lokalt: den bundlade companies.json, ~1165 nordiska bolag
// med kurs, snabb och offline. Den är en ögonblicksbild av de ~500 största per
// marknad och saknar därför hela First North, alltså Ferroamp, Nyab och resten av
// småbolagssvansen som den här målgruppen faktiskt äger. Fjärrlagret /api/bolagssok
// (Yahoo) fyller svansen och ger tickern, så kurs och historik fungerar direkt.
let UNIVERSE = [];  // [{n:namn, t:ticker, m:marknad, c:landskod, p:kurs, ch:dagens%}]
fetch('/labs/data/companies.json').then(r=>r.ok?r.json():null).then(d=>{
  UNIVERSE = Array.isArray(d) ? d : (d && d.bolag) || [];
  if(document.getElementById('cosearch')) renderResults();
}).catch(()=>{});

// Fjärrträffar per sökterm. null = inte sökt än, [] = sökt utan träff.
const FJARR = new Map();
let fjarrTimer = null;
function sokFjarr(q){
  if(q.length < 2 || FJARR.has(q)) return;
  clearTimeout(fjarrTimer);
  fjarrTimer = setTimeout(function(){
    FJARR.set(q, []); // markera som pågående så vi inte skickar om
    fetch('/api/bolagssok?q='+encodeURIComponent(q))
      .then(r=>r.ok?r.json():null)
      .then(d=>{ FJARR.set(q, (d && d.traffar) || []); if(searchQ.trim().toLowerCase()===q) renderResults(); })
      .catch(()=>{});
  }, 250);
}
let searchQ='';
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const OB = {
  a:'köpa upp lönsamma småbolag och driva dem bättre',
  b:'marknaden är fragmenterad och kassaflödet betalar nästa förvärv',
  vakter:[
    ['Växer minst 8 procent per år av egen kraft','säg till om det faller under 8 procent två kvartal i rad'],
    ['Stigande lönsamhet (rörelsemarginal)','säg till om den faller under fjolårets nivå'],
    ['Inga nya aktier trycks','säg till om antalet aktier ökar'],
  ]
};
let step=0, sel=null, selT=null, selC=null, qty='', gav='';
const NSTEP=3;
const pipsEl=document.getElementById('pips'), stepEl=document.getElementById('step');

function pips(){ pipsEl.innerHTML = Array.from({length:NSTEP},(_,i)=>'<i class="'+(i<=step?'on':'')+'"></i>').join(''); }

// ── Spara det tillagda bolaget till Dina bolag (holdings) ─────────────────
let savedFor=null, saveState='';
function saveNoteText(){
  if(saveState==='saving') return 'Sparar i Dina bolag ...';
  if(saveState==='saved')  return 'Sparat i Dina bolag.';
  if(saveState==='login')  return 'Sparas i Dina bolag så fort du loggar in.';
  if(saveState.indexOf('error:')===0) return 'Kunde inte spara: '+saveState.slice(6);
  return '';
}
function setSaveNote(state){ saveState=state; const el=document.getElementById('saveNote'); if(el) el.textContent=saveNoteText(); }
function num(s){
  if(s==null) return null;
  var t=String(s).trim().replace(/[\s  ]/g,'').replace(/,/g,'.');
  if(t==='') return null;
  var n=parseFloat(t);
  return (isNaN(n)||n<0) ? null : n;
}
function persistHolding(){
  if(!sel || savedFor===sel) return;   // spara varje bolag en gång
  savedFor=sel;
  const row={ name:sel, ticker:selT||null, land:selC||null, isin:null, quantity:num(qty), gav:num(gav), relation:'ager', source:'manual' };
  if(!(window.AB && window.AB.ready)){ setSaveNote('login'); return; }
  setSaveNote('saving');
  window.AB.getUser().then(u=>{
    if(u){ return window.AB.insertHoldings([row]).then(()=>setSaveNote('saved')); }
    // Ej inloggad: lägg i samma pending-kö som importen; Dina bolag flushar den efter login.
    try{
      const key='agarbrevet-pending-import';
      const cur=JSON.parse(localStorage.getItem(key)||'[]');
      cur.push(row); localStorage.setItem(key, JSON.stringify(cur));
    }catch(e){}
    setSaveNote('login');
  }).catch(e=>setSaveNote('error:'+((e&&e.message)||e)));
}

function render(){
  pips();
  let h='';
  if(step===0){
    h='<div class="kicker">Lägg till bolag · steg 1 av 3</div>'+
      '<h1>Vilket bolag äger du?</h1>'+
      '<div class="sub">Sök på namn, ticker eller ISIN, eller välj ett vanligt nedan. Mer än så behövs inte: bevakning och sammanfattningar startar direkt.</div>'+
      '<div class="searchwrap"><span class="sic">⌕</span>'+
        '<input id="cosearch" type="text" autocomplete="off" placeholder="Sök bolag, t.ex. Volvo eller Sivers" value="'+esc(searchQ)+'"></div>'+
      '<div class="results" id="results"></div>'+
      '<div class="quick"><span class="ql">Vanliga</span>'+
        BOLAG.map(b=>'<button class="chip'+(sel===b.n?' sel':'')+'" data-b="'+esc(b.n)+'" data-t="'+esc(b.t)+'" data-c="'+esc(b.c||'')+'">'+esc(b.n)+'</button>').join('')+'</div>'+
      '<div class="nav-btns"><a class="btn ghost" href="/labs/dina-bolag.html">Avbryt</a><span class="spacer"></span>'+
        '<button class="btn prim" id="next" '+(sel?'':'disabled')+'>'+(sel?'Fortsätt med '+esc(sel)+' →':'Fortsätt →')+'</button></div>';
  } else if(step===1){
    const cn = sel||'bolaget';
    h='<div class="kicker">Steg 2 av 3 · valfritt</div>'+
      '<h1>Ditt innehav i '+cn+'</h1>'+
      '<div class="sub">Fyll i om du vill följa din avkastning. Lämnar du tomt bevakar vi '+cn+' från och med i dag, utan siffror, och du kan lägga till dem när som helst senare.</div>'+
      '<div class="vrow"><div class="vg"><span class="gl">Antal aktier</span><input id="f-qty" inputmode="decimal" autocomplete="off" value="'+esc(qty)+'" placeholder="t.ex. 1119"></div></div>'+
      '<div class="vrow"><div class="vg"><span class="gl">Inköpskurs per aktie</span><input id="f-gav" inputmode="decimal" autocomplete="off" value="'+esc(gav)+'" placeholder="t.ex. 4,34"></div></div>'+
      '<div class="nav-btns"><button class="btn" data-go="0">← Tillbaka</button><span class="spacer"></span>'+
        '<button class="btn ghost" id="hskip">Hoppa över</button>'+
        '<button class="btn prim" id="hnext">Fortsätt →</button></div>';
  } else {
    persistHolding();
    const cn = sel||'bolaget';
    h='<div class="kicker">Klart</div>'+
      '<h1>Vi håller koll på '+cn+' åt dig.</h1>'+
      '<div class="sub">Vi bevakar '+cn+' enligt kursens regler: rapporter, nyckeltal och väsentliga händelser läses och sammanfattas varje morgon, med källa på varje siffra.</div>'+
      '<div class="done-card"><div class="dh">Det här händer nu</div>'+
        '<p>I morgon 07:30: ditt första Ägarbrev med '+cn+' i.<br>Vid rapport: analysen klar inom minuter, varje siffra med källa.<br>Om en av våra gränser passeras: vi säger till samma morgon.</p>'+
        '<div id="saveNote" style="margin-top:12px;padding-top:12px;border-top:1px solid var(--rule);font-family:var(--mono);font-size:12.5px;color:var(--oxblood)">'+saveNoteText()+'</div></div>'+
      '<div class="nav-btns"><button class="btn ghost" data-go="0">Lägg till ett bolag till</button><span class="spacer"></span>'+
        '<a class="btn prim" href="/labs/dina-bolag.html">Öppna Dina bolag →</a></div>';
  }
  stepEl.innerHTML = '<div class="step">'+h+'</div>';
  wire();
}

// Träfflistan: filtrerar universumet och erbjuder ALLTID att lägga till det man
// skrivit, så vilket bolag som helst går att lägga till (inte bara de fördefinierade).
function renderResults(){
  const rEl=document.getElementById('results'); if(!rEl) return;
  const q=searchQ.trim().toLowerCase();
  if(!q){ rEl.innerHTML=''; return; }
  const lokala=UNIVERSE.filter(o=>o.n.toLowerCase().includes(q)||(o.t&&o.t.toLowerCase().includes(q)));
  // Fjärrsök alltid: de lokala träffarna kan vara få eller fel bolag (sök på
  // "ferro" och du får Ferronordic, inte Ferroamp).
  sokFjarr(q);
  const sedda=new Set(lokala.map(o=>String(o.t||'').toUpperCase()+':'+o.n.toLowerCase()));
  const fjarr=(FJARR.get(q)||[])
    .map(t=>({n:t.namn, t:t.ticker, m:t.bors, c:t.land}))
    .filter(o=>!sedda.has(String(o.t).toUpperCase()+':'+o.n.toLowerCase())
            && !lokala.some(l=>String(l.t||'').toUpperCase()===String(o.t).toUpperCase()));
  const hits=lokala.concat(fjarr).slice(0,8);
  let html=hits.map(o=>'<button type="button" class="rrow'+(sel===o.n?' sel':'')+'" data-pick="'+esc(o.n)+'" data-t="'+esc(o.t||'')+'" data-c="'+esc(o.c||'')+'">'+
    '<span>'+esc(o.n)+'</span><span class="rmeta">'+(sel===o.n?'vald ✓':esc((o.t||'')+' · '+o.m))+'</span></button>').join('');
  const typed=searchQ.trim();
  if(typed && !hits.some(o=>o.n.toLowerCase()===q)){
    html+='<button type="button" class="rrow add" data-pick="'+esc(typed)+'" data-t="" data-c="">'+
      '<span>Lägg till ”'+esc(typed)+'”</span><span class="rmeta">nytt bolag →</span></button>';
  }
  if(!html) html='<div class="rempty">Söker. Hittar vi inget går det ändå att lägga till namnet du skrivit.</div>';
  rEl.innerHTML=html;
  rEl.querySelectorAll('[data-pick]').forEach(b=>b.addEventListener('click',()=>{ sel=b.dataset.pick; selT=b.dataset.t||null; selC=b.dataset.c||null; render(); }));
}

function wire(){
  const cs=stepEl.querySelector('#cosearch');
  if(cs){
    renderResults();
    cs.addEventListener('input',()=>{ searchQ=cs.value; renderResults(); });
    cs.addEventListener('keydown',e=>{
      if(e.key==='Enter'){ e.preventDefault();
        const first=stepEl.querySelector('.rrow[data-pick]');
        if(first){ sel=first.getAttribute('data-pick'); selT=first.getAttribute('data-t')||null; selC=first.getAttribute('data-c')||null; render(); }
      }
    });
  }
  stepEl.querySelectorAll('.chip[data-b]').forEach(c=>c.addEventListener('click',()=>{
    sel = c.dataset.b; selT = c.dataset.t||null; selC = c.dataset.c||null; render();
  }));
  const next=stepEl.querySelector('#next'); if(next) next.addEventListener('click',()=>{step=1;render();});
  const fq=stepEl.querySelector('#f-qty'); if(fq) fq.addEventListener('input',()=>{qty=fq.value;});
  const fg=stepEl.querySelector('#f-gav'); if(fg) fg.addEventListener('input',()=>{gav=fg.value;});
  const hn=stepEl.querySelector('#hnext'); if(hn) hn.addEventListener('click',()=>{step=2;render();});
  const hs=stepEl.querySelector('#hskip'); if(hs) hs.addEventListener('click',()=>{qty='';gav='';step=2;render();});
  stepEl.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>{
    const g=+b.dataset.go;
    if(g===0 && step===2){ sel=null; selT=null; selC=null; qty=''; gav=''; savedFor=null; }
    step=g; render();
  }));
}
render();
</script>
</body>
</html>
