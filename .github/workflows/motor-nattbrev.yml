# Nattbrevet: kör motorn i molnet varje morgon och lägger dagens brev i KV, så
# /labs/agarbrevet.html visar det utan att din dator behöver vara på.
#
# Bygger INTE om sajten. Brevet går via KV (/api/brev), och en ombyggnad skulle
# bara deploya om samma statiska sidor i onödan. Det var precis vad det gamla
# upptack-daily-jobbet gjorde innan det togs bort.
#
# Ordningen är medveten: minnet hämtas först, brevet publiceras före minnet
# sparas. Faller publiceringen sparas inte minnet heller, och nästa körning
# upptäcker samma pressmeddelanden på nytt i stället för att tappa dem tyst.
#
# Secrets som måste finnas på repot (Settings, Secrets and variables, Actions):
#   ANTHROPIC_API_KEY      extraktionen och brevtexten
#   SUPABASE_URL           bevakningslistan läses ur innehaven
#   SUPABASE_SECRET_KEY
#   CLOUDFLARE_API_TOKEN   token med Workers KV Storage: Edit
#   CLOUDFLARE_ACCOUNT_ID
#   RESEND_API_KEY         valfri. Utan den skrivs brevet bara till sidan.

name: Nattbrevet (motorn)

on:
  schedule:
    # 00:07 UTC, ~02:07 svensk sommartid. Ser tidigt ut, och det ar meningen:
    # GitHub koar schemalagda jobb, och de sju korningarna 1 till 7 september
    # startade 241 till 306 MINUTER efter sin tid. Med den gamla raden (04:30
    # UTC) landade morgonbrevet 10:30 till 11:36 svensk tid, alltsa vid lunch,
    # medan sidan stampade det "07:30". Fyra till fem timmars marginal fran
    # 00:07 lagger det i stallet 06:00 till 07:00.
    #
    # Udda minut med flit: hel och halvtimme ar de mest kobelastade lagena.
    # Kliv inte bakat forbi midnatt UTC: datumet i brevet ar UTC-datumet, och
    # 23:xx UTC skulle datera natten till fel dag for en svensk lasare.
    - cron: '7 0 * * *'
  workflow_dispatch:

# Två körningar samtidigt skulle skriva över varandras minne i KV.
concurrency:
  group: motor-nattbrev
  cancel-in-progress: false

jobs:
  brev:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      # Rapportkalendern och vaerderingen i brevet. Saknas den kor jobbet vidare
      # utan kalenderblocket, se motor/borsdata.mjs.
      BORSDATA_API: ${{ secrets.BORSDATA_API }}
    steps:
      - uses: actions/checkout@v4

      # Motorn använder bara Nodes egna moduler, så inget npm ci behövs.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Hämta motorns minne ur KV
        run: node motor/state-kv.mjs hamta

      - name: Kör motorn
        run: node motor/natt.mjs

      - name: Publicera brevet till KV
        run: node motor/publicera-brev.mjs

      - name: Uppdatera Frågas dokumentarkiv
        run: node motor/bygg-arkiv.mjs --kor

      - name: Spara motorns minne till KV
        run: node motor/state-kv.mjs spara
