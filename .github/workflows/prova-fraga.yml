# Provkorning av Fraga mot riktiga Anthropic och riktiga MFN.
#
# Enhetstesterna stubbar modellen, och det duger for logiken. Tva saker gar inte
# att prova sa: att modell-id:t claude-sonnet-5 finns och nyckeln har tillgang
# till det, och att verktygsloopen fungerar mot det verkliga API:t. Bada faller
# TYST i produktion, routningen ramlar tillbaka pa Haiku och svaret blir grundare
# utan att nagon marker det.
#
# Kostar nagra ore per korning, sa bara pa begaran. Ingen schemalaggning.
#
# JOBBET GAR ALLTID GRONT, med flit. Domen star i jobbsammanfattningen i
# stallet. Det har ar ett workflow_dispatch-prov som inte grindar nagot: det
# finns for att en manniska ska LASA utfallet, och den som kor det laser loggen
# anda. Ett rott kryss har gjorde alltsa ingen nytta, men skickade ett mejl till
# alla som prenumererar pa repots Actions. Under en felsokningskvall blev det
# tio mejl pa en halvtimme, och da slutar man lasa dem.
#
# Skriptet sjalvt returnerar fortfarande 1 vid fel, sa `node tools/prova-fraga.mjs`
# lokalt eller i ett riktigt grindande jobb beter sig som vanligt.

name: Prova Fragan (kostar pengar)

on:
  workflow_dispatch:
    inputs:
      avancerat:
        description: 'Kör avancerade metodfrågor med intern diagnostik'
        type: boolean
        default: false
      baslinje:
        description: 'Jämför med chatbotkoden före förbättringskedjan (69de416)'
        type: boolean
        default: false
      lost_format:
        description: 'Experiment: utan API-strict på svara, oförändrad servervalidering'
        type: boolean
        default: false
      analys_high:
        description: 'Experiment: högre resonemangsnivå enbart i svarsgeneratorn'
        type: boolean
        default: false
      analys_opus:
        description: 'Experiment: Opus 5 enbart i svarsgeneratorn, övriga kontroller oförändrade'
        type: boolean
        default: false
      granskar_motivering:
        description: 'Experiment: granskaren motiverar även positiva beslut i samma anrop'
        type: boolean
        default: false
      fryst_payload:
        description: 'Fryst granskningsprov: gzip/base64 med offentliga eller fiktiva testdata, aldrig nycklar'
        type: string
        default: ''
      publika_bolag:
        description: 'Volvo/TRATON: hämta daterade offentliga rapporter, sex frågor, högst 2 USD'
        type: boolean
        default: false
      public_receipt_key:
        description: 'Publik RSA-nyckel i base64 för krypterade provsvar; aldrig privat nyckel'
        type: string
        default: ''
      publik_kurs_pa_begaran:
        description: 'Publikt experiment: korta kursposter och läsning på begäran i stället för automatiska långutdrag'
        type: boolean
        default: false
      publik_samlad_start:
        description: 'Publikt experiment: beställ nödvändig rapportläsning i samma svar som planeringen'
        type: boolean
        default: false
      publik_inlasning:
        description: 'Endast PDF-extraktion av två låsta rapporter, högst 0,50 USD; inga chattfrågor'
        type: boolean
        default: false
      basfragor:
        description: 'Basfrågor (lager 1): riktigt arkiv ur KV, riktiga Börsdata-tal, mäter kostnad och tid per moment'
        type: boolean
        default: false
      bas_urval:
        description: 'Basfrågor: kommaseparerat urval, t.ex. marginalserie,roic. Tomt kör alla nio.'
        type: string
        default: ''

jobs:
  prov:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      FRAGA_AVANCERAT: ${{ inputs.avancerat }}
      FRAGA_PROV_LOST_FORMAT: ${{ inputs.lost_format }}
      FRAGA_PROV_ANALYS_HIGH: ${{ inputs.analys_high }}
      FRAGA_PROV_ANALYS_OPUS: ${{ inputs.analys_opus }}
      FRAGA_PROV_GRANSKAR_MOTIVERING: ${{ inputs.granskar_motivering }}
      # Endast basfrageprovet. Borsdata lases live, KV lases skrivskyddat.
      BORSDATA_API: ${{ secrets.BORSDATA_API }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Välj fast baslinje
        if: ${{ inputs.baslinje }}
        run: git restore --source=69de416 -- functions/api
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prova Fragan
        if: ${{ inputs.fryst_payload == '' && !inputs.publika_bolag && !inputs.basfragor }}
        run: |
          set +e
          node tools/prova-fraga.mjs 2>&1 | tee prov.log
          kod=${PIPESTATUS[0]}
          {
            if [ "$kod" -eq 0 ]; then
              echo "## Alla prov gick igenom"
              echo "Modell-id, verktygsloop, hamtning och grind fungerar mot riktiga API:t."
            else
              echo "## Prov som inte gick igenom"
              echo "Las utfallet nedan. Ett stoppat svar behover inte vara ett fel i koden:"
              echo "grinden ska stoppa ett svar som inte gar att verifiera."
            fi
            echo
            echo '```'
            cat prov.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: Fryst granskningsforsok
        if: ${{ inputs.fryst_payload != '' && !inputs.publika_bolag && !inputs.basfragor }}
        run: |
          set +e
          node tools/prova-fraga-granskning.mjs 2>&1 | tee fryst.log
          {
            echo '## Fryst experiment: läs antal, bedömningar och fel separat'
            echo 'Workflow-status är inte ett kvalitetsbesked. Inga kundanrop eller produktionsändringar.'
            echo '```'
            cat fryst.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: Installera PDF-lasning for publikt prov
        if: ${{ inputs.publika_bolag }}
        run: python -m pip install pypdf==6.14.2
      - name: Publika bolagsrapporter
        if: ${{ inputs.publika_bolag }}
        run: |
          python tools/fraga-publika-kallor.py "$RUNNER_TEMP/publika-kallor"
          set +e
          if [ "${{ inputs.publik_inlasning }}" = "true" ]; then
            node tools/prova-fraga-inlasning.mjs "$RUNNER_TEMP/publika-kallor/sources.json" 2>&1 | tee publikt.log
          else
            node tools/prova-fraga-publikt.mjs "$RUNNER_TEMP/publika-kallor/sources.json" 2>&1 | tee publikt.log
          fi
          echo '## Publikt experiment: workflow-status är inte kvalitetsbesked' >> "$GITHUB_STEP_SUMMARY"
          grep '^PUBLIKT_RESULTAT\|^PUBLIKT_SLUT' publikt.log >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Basfragor mot riktigt arkiv och riktiga Borsdata-tal
        if: ${{ inputs.basfragor }}
        env:
          FRAGA_BAS_URVAL: ${{ inputs.bas_urval }}
        run: |
          set +e
          node tools/prova-fraga-bas.mjs 2>&1 | tee bas.log
          {
            echo '## Basfrågor: lager 1, det Börsdata faktiskt bär'
            echo 'Workflow-status är inte ett kvalitetsbesked. Läs svaren, kostnaden och tiden nedan.'
            echo 'Inget skrivs: ingen KV-put, inget brev, inget mejl.'
            echo
            echo '```'
            cat bas.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
