name: Daglig insynsdata (Upptäck)

# Hämtar FI:s insynsregister, bygger och deployar dagligen så Upptäcks
# Insyn-flöde håller sig färskt. Kör även manuellt via "Run workflow".
#
# Kräver två repo-secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   (behörighet: Cloudflare Pages -> Edit)
#   CLOUDFLARE_ACCOUNT_ID
#
# OBS: jobbet bygger och deployar från origin/trunk. Håll origin i synk med
# det du vill ha live (committa OCH pusha), annars deployar den dagliga körningen
# repo-tillståndet.

on:
  schedule:
    - cron: '0 5 * * *'   # 05:00 UTC dagligen (~07:00 svensk sommartid)
  workflow_dispatch: {}    # manuell körning

permissions:
  contents: write          # för att committa tillbaka uppdaterad JSON

concurrency:
  group: upptack-daily
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Hämta FI-insynsdata
        run: node motor/upptack-json.mjs

      - name: Bygg
        run: npm run build

      - name: Deploya till produktion
        run: npx wrangler pages deploy dist --project-name kurs --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Committa uppdaterad JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/labs/data/upptack-insyn.json
          if git diff --staged --quiet; then
            echo "Ingen förändring i insynsdatan."
          else
            git commit -m "chore(upptack): daglig FI-insynsdata [skip ci]"
            git push
          fi
